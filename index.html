window.CARNET_MODE = 'pwa';
window.CARNET_THREE_URL = 'three.min.js';
window.CARNET_VERSION = '2026-11-06 17:20';
/* Base locale : même interface que la base claude.ai, stockée sur le téléphone */
(function(){
  const KEY = 'carnet.db';
  const seed = {"templates":{"A":{"exercises":[{"main":true,"name":"Soulevé de terre","reps":"1 série lourde de 4, puis 2 séries de 6","scheme":[{"label":"Lourde","reps":4},{"label":"Série 2","reps":6},{"label":"Série 3","reps":6}],"sets":"3","step":2.5,"tip":"Repos de 3 à 5 min. Les deux paumes vers toi. Prise mixte seulement sur la série lourde, en changeant de main à chaque séance.","unit":"kg"},{"loadAt":12,"main":true,"name":"Tractions pronation","reps":"max −1","sets":"3","tip":"Mains un peu plus larges que les épaules. Coudes vers le bas et légèrement vers l’extérieur. Indique le lest : 0 si tu n’en mets pas.","unit":"kg"},{"loadAt":12,"main":true,"name":"Tractions supination","reps":"max −1","sets":"2","tip":"Indique le lest : 0 si tu n’en mets pas.","unit":"kg"},{"name":"Rowing barre","reps":"6-8","sets":"2","tip":"Buste immobile, dos droit.","unit":"kg"},{"name":"Face pull","reps":"12-15","sets":"2","tip":"Poulie à hauteur du visage. Tire vers le front, coudes hauts et sur les côtés. Charge légère.","unit":"kg"},{"name":"Extensions lombaires","sets":"2","reps":"10-12","unit":"kg","step":2.5,"rest":90,"tip":"Sur un banc à lombaires. Commence au poids du corps et note 0. Remonte jusqu’à l’alignement jambes-buste, pas au-delà."},{"name":"Suspension à la barre","sets":"2","reps":"45-60 s","unit":"s","main":true,"rest":90,"tip":"Tiens jusqu’à ce que la prise soit sur le point de lâcher. Dès 60 s aux 2 séries, ajoute du lest et note-le dans la remarque.","alt":"prise"},{"name":"Marche du fermier","reps":"30-40 m","sets":"2","tip":"Note le poids d’une seule main. Dès 40 m sur les 2 séries, ajoute 2 kg par main.","unit":"kg","step":2,"alt":"prise"},{"name":"Curl marteau","sets":"2","reps":"8-12","unit":"kg","step":2,"tip":"Note le poids d’un seul haltère. Coudes le long du corps."}],"name":"Dos · tirage","order":1,"short":"A · Dos"},"B":{"exercises":[{"main":true,"name":"Développé couché","reps":"1 série lourde de 4, puis 2 séries de 6","scheme":[{"label":"Lourde","reps":4},{"label":"Série 2","reps":6},{"label":"Série 3","reps":6}],"sets":"3","step":2.5,"tip":"Premier exercice lourd de la séance. Repos de 3 à 4 min. Avant-bras à peu près verticaux quand la barre touche la poitrine.","unit":"kg","double":true},{"loadAt":10,"main":true,"name":"Dips","reps":"6-10","sets":"2","tip":"Indique le lest : 0 si tu n’en mets pas. Arrête la descente si l’avant de l’épaule te gêne.","unit":"kg"},{"name":"Développé militaire haltères","reps":"8-10","sets":"2","tip":"Note le poids d’un seul haltère. Fessiers serrés, sans te pencher en arrière.","unit":"kg","step":2},{"name":"Extension triceps à la poulie","sets":"2","reps":"10-12","unit":"kg","tip":"Coudes immobiles, le long du corps."},{"name":"Reverse fly","reps":"8-12","sets":"2","tip":"À la machine, poitrine contre le coussin. Coudes légèrement fléchis, épaules basses. Note la charge affichée, au total.","unit":"kg","step":2.5,"rest":90}],"name":"Poussée","order":2,"short":"B · Poussée"},"C":{"exercises":[{"name":"Sauts en longueur ou sur box","reps":"3 sauts","sets":"4","tip":"Après 5 à 8 min de cardio facile et de mobilité. Récupère 1 à 2 min entre les séries. Note la distance sautée ou la hauteur de la box.","unit":"cm","rest":90},{"main":true,"name":"Squat","reps":"1 série lourde de 4, puis 2 séries de 6","scheme":[{"label":"Lourde","reps":4},{"label":"Série 2","reps":6},{"label":"Série 3","reps":6}],"sets":"3","step":2.5,"tip":"Repos de 3 à 5 min. Règle les sécurités du rack sous ta position basse.","unit":"kg"},{"name":"Fentes bulgares","reps":"8-10 par jambe","sets":"3","tip":"Note le poids d’un seul haltère. Fais toutes les répétitions d’une jambe, puis change.","unit":"kg"},{"name":"Leg curl ou Nordic curl","reps":"6-10","sets":"2","tip":"Retour lent, en 2 à 3 secondes.","unit":"kg"},{"name":"Mollets debout ou assis","reps":"10-15","sets":"3","tip":"Une séance debout, la suivante assis. Mouvement lent, sans rebond.","unit":"kg"},{"name":"Développé couché pause","reps":"5","sets":"3","tip":"Rappel pour ton point faible, en fin de séance. Charge proposée : 80 % de ta série lourde. Marque 1 seconde sur la poitrine, sans rebond. Il doit te rester au moins 3 répétitions possibles.","unit":"kg"},{"name":"Planche latérale","reps":"30-45 s par côté","sets":"2","unit":"s","tip":"Corps aligné de la tête aux pieds. Fais le temps indiqué de chaque côté."}],"name":"Jambes · athlétisme","order":3,"short":"C · Jambes"},"D":{"exercises":[{"main":true,"name":"Distance","reps":"Facile : 45 à 70 min. Soutenue : 4 fois 1 km, ou 3 fois 8 min.","sets":"1","tip":"Une seule course soutenue par semaine, jamais la veille de la séance C.","unit":"km"},{"name":"Durée","reps":"Temps total de la course","sets":"1","unit":"min"}],"name":"Course","order":4,"short":"D · Course"}},"settings":{"cycle":{"start":"2026-10-05","weeks":7},"program":{"version":6}}};
  let store; try { store = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { store = null; }
  if (!store) store = { templates: seed.templates, settings: seed.settings, logs: {}, weights: {}, goals: {} };
  const subs = new Set();
  const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} };
  /* Une mise à jour ne touche jamais aux données : elle en garde seulement une copie de sécurité */
  try {
    const seen = localStorage.getItem('carnet.version');
    if (seen && seen !== window.CARNET_VERSION) localStorage.setItem('carnet.db.avant-maj', JSON.stringify(store));
    localStorage.setItem('carnet.version', window.CARNET_VERSION);
  } catch (e) {}
  persist();
  const notify = () => subs.forEach(f => { try { f(); } catch (e) {} });
  const clone = d => JSON.parse(JSON.stringify(d));
  const db = {
    collection: c => ({ onSnapshot(cb){ const f = () => cb({ docs: Object.entries(store[c] || {}).map(([id, d]) => ({ id, exists: true, data: () => clone(d) })) }); subs.add(f); queueMicrotask(f); return () => subs.delete(f); } }),
    doc: p => { const [c, id] = p.split('/'); return {
      async set(d){ (store[c] = store[c] || {})[id] = clone(d); localStorage.setItem(KEY, JSON.stringify(store)); notify(); },
      async delete(){ if (store[c]) delete store[c][id]; persist(); notify(); },
      onSnapshot(cb){ const f = () => { const d = store[c] && store[c][id]; cb({ id, exists: !!d, data: () => d && clone(d) }); }; subs.add(f); queueMicrotask(f); return () => subs.delete(f); }
    }; }
  };
  const downloads = { async save({ filename, data }){
    const file = new File([data], filename, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: filename }); return { status: 'saved' }; }
      catch (e) { if (e && e.name === 'AbortError') throw { code: 'declined' }; }
    }
    const url = URL.createObjectURL(file), a = document.createElement('a');
    a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    return { status: 'saved' };
  } };
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
  window.claude = { use: async n => ({ db, downloads })[n] || null };
})();
</script>

<title>Carnet de séances</title>
<style>
/* Sol de salle : fond caoutchouc, texte craie, couleurs de disques olympiques comme code des séances.
   Colonne unique pensée pour le pouce (max 560 px), barre d'onglets en bas, mode séance plein écran. */
:root{
  --floor:#111315; --rubber:#1a1d20; --steel:#262b30; --line:#323940;
  --chalk:#f1eee6; --dim:#9ba2a9; --ink:#111315;
  --pA:#e0393f; --pB:#2f74de; --pC:#e9b51f; --pD:#32a35a;
  --plate20:#2f74de; --plate10:#32a35a; --plate5:#f1eee6; --plate25:#e0393f; --plate125:#b9c0c6; --bar:#b9c0c6;
  --deload:#8b7be0; --warn:#f4b860; --warn-bg:#3a2a10; --ok:#4cc27a; --bad:#ff6b6b; --claude:#d97757;
  --display:"Big Shoulders Display","Arial Narrow","Roboto Condensed",sans-serif;
  --body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--floor)}
body{color:var(--chalk);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body.locked{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
input,select,textarea{font:inherit;color:var(--chalk);background:var(--floor);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
:focus-visible{outline:3px solid var(--chalk);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:900;text-transform:uppercase;margin:0;line-height:.95;text-wrap:balance;letter-spacing:.01em}
h2{font-size:1.9rem}
h3{font-size:1.35rem}
p{margin:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.15em;font-size:.82rem;color:var(--dim)}
.dim{color:var(--dim)}
.small{font-size:.85rem}
.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:14px calc(96px + env(safe-area-inset-bottom,0px));display:grid;gap:16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-family:var(--display);font-weight:900;font-size:1.25rem;text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:8px}
.brand svg{width:26px;height:26px;flex:none}
/* accueil : la date en très grand, comme un panneau de salle */
.hero{display:grid;gap:12px;padding-top:4px}
.hdate{display:flex;align-items:flex-end;gap:12px;line-height:.8}
.hnum{font-family:var(--display);font-weight:900;font-size:6.2rem;letter-spacing:-.03em;line-height:.78}
.hside{display:grid;gap:6px;padding-bottom:6px}
.hday{font-family:var(--display);font-weight:900;font-size:1.9rem;text-transform:uppercase;line-height:.9}
.hmon{font-family:var(--display);font-weight:800;font-size:1.1rem;text-transform:uppercase;letter-spacing:.14em;color:var(--dim)}
/* disque de séance : la lettre sur un disque à la couleur de la séance */
.disc{--s:58px;width:var(--s);height:var(--s);flex:none;border-radius:50%;background:var(--c);color:var(--ink);display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:calc(var(--s)*.5);line-height:1;box-shadow:inset 0 0 0 calc(var(--s)*.07) color-mix(in srgb,var(--c) 70%,#000),inset 0 0 0 calc(var(--s)*.13) var(--c),inset 0 0 0 calc(var(--s)*.15) color-mix(in srgb,var(--c) 75%,#000)}
.disc.sm{--s:34px}
.chead{display:flex;gap:14px;align-items:center}
.chead h2{font-size:1.75rem}
.sync{font-size:.78rem;color:var(--dim);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--dim)}
.sync.ok i{background:var(--ok)} .sync.wait i{background:var(--warn)} .sync.off i{background:var(--bad)}
.view{display:grid;gap:16px}
.card{background:var(--rubber);border-radius:16px;padding:16px;display:grid;gap:12px;min-width:0}
.card.plate{border-top:8px solid var(--c,var(--line))}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.stack{display:grid;gap:8px}
/* cycle */
.cycle{display:grid;grid-template-columns:repeat(var(--n,7),1fr);gap:4px}
.cycle i{height:10px;background:var(--steel);border-radius:2px}
.cycle i.on{background:var(--chalk)}
.cycle i.dl{background:repeating-linear-gradient(135deg,var(--deload) 0 3px,transparent 3px 6px)}
.cycle i.dl.on{background:var(--deload)}
/* boutons */
.btn{border:0;border-radius:14px;padding:14px 18px;font-family:var(--display);font-weight:900;font-size:1.3rem;text-transform:uppercase;letter-spacing:.04em;background:var(--steel);color:var(--chalk);min-height:56px}
.btn.main{background:var(--chalk);color:var(--ink);width:100%;font-size:1.65rem;min-height:68px}
.btn.wide{width:100%}
.btn.ghost{background:transparent;border:2px solid var(--line)}
.btn.danger{background:transparent;border:2px solid var(--bad);color:var(--bad)}
.btn.sm{font-size:1rem;min-height:44px;padding:8px 14px;border-radius:10px}
.btn.claude{background:var(--claude);color:var(--on-acc)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:transparent;border-radius:10px;min-height:48px;padding:6px 14px;font-family:var(--display);font-weight:800;font-size:1.1rem;text-transform:uppercase;letter-spacing:.04em}
.chip.on{background:var(--c,var(--chalk));border-color:var(--c,var(--chalk));color:var(--ink)}
.chip.sq{min-width:52px;justify-content:center}
.tplpick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tplpick button{border:0;border-radius:14px;min-height:96px;background:var(--steel);text-align:left;padding:12px;display:grid;gap:6px;align-content:start}
.tplpick b{font-family:var(--display);font-weight:900;font-size:1.5rem;text-transform:uppercase;line-height:.95}
.tplpick span{font-size:.8rem;color:var(--dim)}
.alert{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:12px 14px;font-size:.92rem;font-weight:500;display:grid;gap:8px}
.alert button{justify-self:start;border:2px solid currentColor;background:transparent;border-radius:10px;padding:6px 12px;font-weight:600;min-height:40px}
.banner{background:var(--c,var(--chalk));color:var(--ink);border-radius:14px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;border:0;width:100%;text-align:left}
.banner b{font-family:var(--display);font-weight:900;font-size:1.35rem;text-transform:uppercase}
.exl{display:grid;gap:8px}
.exl .r{display:flex;justify-content:space-between;gap:10px;font-size:.95rem}
.exl .r b{font-weight:600;flex:0 1 45%}
.exl .num{font-family:var(--body);font-variant-numeric:tabular-nums}
.exl .r span{color:var(--dim);text-align:right}
.up{color:var(--ok);font-weight:600}
.dlw{color:var(--deload);font-weight:600}
.pr{color:var(--ok);font-weight:700}
/* semaine */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;text-align:center}
.week .d{font-family:var(--display);font-weight:800;font-size:.8rem;color:var(--dim)}
.week button{border:0;height:46px;border-radius:9px;background:var(--steel);font-family:var(--display);font-weight:900;font-size:1.2rem;color:var(--ink);position:relative;padding:0}
.week button.p{background:transparent;border:2px dashed var(--c);color:var(--c)}
.week button.f{background:var(--c)}
.week button.today{box-shadow:0 0 0 2px var(--chalk)}
.week button .w{position:absolute;top:3px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--warn)}
/* calendrier */
.calhead{display:flex;justify-content:space-between;align-items:center}
.calhead button{width:48px;height:48px;border:0;border-radius:10px;background:var(--steel);font-size:1.4rem}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dowh{font-family:var(--display);font-weight:800;font-size:.78rem;color:var(--dim);text-align:center;text-transform:uppercase}
.day{min-height:58px;border-radius:8px;border:2px solid transparent;background:var(--steel);padding:4px;display:flex;flex-direction:column;gap:3px;align-items:flex-start;min-width:0;position:relative}
.day.out{opacity:.35}
.day.dl{background:color-mix(in srgb,var(--deload) 22%,var(--steel))}
.day.sel{border-color:var(--chalk)}
.day .n{font-family:var(--mono);font-size:.75rem}
.day.today .n{background:var(--chalk);color:var(--ink);border-radius:4px;padding:0 4px}
.day .c{font-family:var(--display);font-weight:900;font-size:1.1rem;border-radius:5px;padding:0 5px;color:var(--ink);background:var(--c);max-width:100%;overflow:hidden;white-space:nowrap}
.day .c.p{background:transparent;color:var(--c);box-shadow:inset 0 0 0 2px var(--c)}
.day .w{position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--dim)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend b{width:12px;height:12px;border-radius:3px;display:inline-block}
.confirm{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:12px;display:grid;gap:10px;font-weight:500}
/* progrès */
.lifts{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:10px}
.lift{background:var(--steel);border-radius:12px;padding:12px;display:grid;gap:4px;align-content:start;min-width:0;border-top:5px solid var(--c)}
.lift .v{font-family:var(--display);font-weight:900;font-size:2rem;line-height:.95}
.lift .v .small{display:block;margin-top:3px;line-height:1.2}
.lift svg,.wchart svg{width:100%;display:block}
.zones{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.zone{background:var(--steel);border-radius:10px;padding:10px;display:grid;gap:2px}
.zone b{font-family:var(--display);font-weight:900;font-size:1.5rem}
table.runs{width:100%;border-collapse:collapse;font-size:.88rem}
table.runs td,table.runs th{padding:6px 4px;border-top:1px solid var(--line);text-align:left}
table.runs th{color:var(--dim);font-weight:500;font-size:.78rem}
.form{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.field{display:grid;gap:4px;min-width:0}
.field label{font-size:.8rem;color:var(--dim)}
.field input{width:120px}
.field select{max-width:100%}
.goal{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:6px}
.meter{height:10px;border-radius:5px;background:var(--steel);overflow:hidden}
.meter i{display:block;height:100%;background:var(--chalk)}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.pill.ok{background:color-mix(in srgb,var(--ok) 20%,transparent);color:var(--ok)}
.pill.amb{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.pill.done{background:var(--chalk);color:var(--ink)}
.stats{display:flex;flex-wrap:wrap;gap:10px 26px}
.stat .v{font-family:var(--display);font-weight:900;font-size:1.9rem;line-height:1}
/* programme */
.exrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;border-top:1px solid var(--line);padding-top:10px}
.exrow .t{display:grid;gap:2px;min-width:0}
.exrow .t b{font-weight:600}
.exrow .t span.main{color:var(--chalk)}
.exrow .tools{align-self:start}
.exrow .t span{font-size:.82rem;color:var(--dim)}
.tools{display:flex;gap:4px}
.tools button{width:44px;height:44px;border:0;border-radius:10px;background:var(--steel);font-size:1.05rem}
.sheet{display:grid;gap:12px;background:var(--steel);border-radius:14px;padding:14px}
.sheet .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet .field input,.sheet .field select{width:100%}
.check{display:flex;gap:10px;align-items:center;min-height:44px}
.check input{width:22px;height:22px}
.schemerow{display:grid;grid-template-columns:minmax(0,1fr) 80px 44px;gap:8px;align-items:center}
.schemerow input{width:100%}
/* Claude */
.q{justify-self:end;background:var(--steel);border-radius:14px 14px 4px 14px;padding:10px 14px;max-width:90%}
.a{display:grid;gap:10px;line-height:1.55}
.a ul{margin:0;padding-left:20px;display:grid;gap:4px}
.change{border:2px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px}
.change .before{color:var(--dim);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--bad) 70%,transparent)}
.change .after{font-weight:600}
.change.done{border-color:var(--ok)}
.change.skip{opacity:.5}
textarea{width:100%;min-height:90px;resize:vertical}
.suggest{display:flex;flex-wrap:wrap;gap:8px}
.suggest button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:8px 12px;font-size:.85rem;min-height:40px;text-align:left}
/* barre d'onglets */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--rubber);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:20}
.nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.nav button{border:0;background:transparent;display:grid;justify-items:center;gap:3px;padding:6px 0;min-height:56px;font-size:.62rem;font-weight:600;color:var(--dim);border-radius:10px}
.nav button svg{width:24px;height:24px}
.nav button{position:relative}
.nav button.on{color:var(--chalk);background:var(--steel)}
.nav button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:currentColor}
.nav button.cl{color:var(--claude)}
.nav button.cl.on{color:var(--claude)}
/* ---------- Mode séance ---------- */
.sess{position:fixed;inset:0;z-index:40;background:var(--floor);overflow-y:auto;overscroll-behavior:contain;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sess .in{max-width:560px;margin:0 auto;min-height:100%;padding-inline:16px;padding-block:12px 18px;display:flex;flex-direction:column;gap:14px}
.sess.rest{background:var(--c);color:var(--ink)}
.sess.rest .eyebrow{color:color-mix(in srgb,var(--ink) 72%,transparent)}
.sess.flash{animation:flash .5s steps(2) 6}
@keyframes flash{50%{background:var(--chalk)}}
@media (prefers-reduced-motion:reduce){.sess.flash{animation:none;background:var(--chalk)}}
.shead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.shead button{width:48px;height:48px;border:0;border-radius:12px;background:var(--steel);font-size:1.2rem}
.sess.rest .shead button{background:color-mix(in srgb,var(--ink) 16%,transparent);color:var(--ink)}
.segs{display:flex;gap:3px;flex:1;max-width:220px}
.segs i{flex:1;height:6px;border-radius:2px;background:var(--steel)}
.segs i.on{background:var(--c)}
.segs i.cur{background:var(--chalk)}
.sess h1{font-size:2.9rem;line-height:.88}
.settag{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.settag .t{background:var(--c);color:var(--ink);font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:1rem;padding:3px 9px;border-radius:6px;letter-spacing:.05em}
.stepper{display:grid;grid-template-columns:72px minmax(0,1fr) 72px;align-items:center;background:var(--rubber);border-radius:16px;padding:8px;gap:6px}
.stepper > button{height:72px;border:0;border-radius:12px;background:var(--steel);font-size:2.2rem;font-weight:500}
.stepper > button:active{background:var(--line)}
.stepper .val{display:grid;justify-items:center}
.stepper input{width:100%;background:transparent;border:0;text-align:center;font-family:var(--display);font-weight:900;font-size:4rem;line-height:1;padding:0;color:var(--chalk)}
.stepper .u{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.12em;font-size:.8rem;color:var(--dim)}
.barviz{display:flex;align-items:center;justify-content:center;gap:2px;height:88px;background:var(--rubber);border-radius:12px;padding:0 10px;overflow:hidden}
.barviz .sl{height:10px;background:var(--bar);flex:0 1 28px;min-width:8px;border-radius:2px}
.barviz .co{height:22px;width:5px;flex:none;background:var(--bar);border-radius:1px}
.barviz .sh{height:6px;background:var(--bar);flex:1 1 60px;min-width:24px;background-image:repeating-linear-gradient(90deg,transparent 0 3px,rgba(0,0,0,.18) 3px 4px)}
.barviz .pl{flex:none}
.barviz .pl{border-radius:3px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.done-sets{display:flex;flex-wrap:wrap;gap:6px}
.done-sets button{border:0;border-radius:8px;background:var(--steel);padding:6px 10px;font-family:var(--mono);font-size:.82rem;min-height:40px}
.done-sets button.cur{box-shadow:0 0 0 2px var(--chalk)}
.done-sets button.ok{background:color-mix(in srgb,var(--c) 30%,var(--steel))}
.hintline{font-size:.9rem;color:var(--dim);display:grid;gap:4px}
.hintline b{color:var(--chalk);font-weight:600}
.push{margin-top:auto;display:grid;gap:10px}
.clock{font-family:var(--display);font-weight:900;font-size:min(36vw,170px);line-height:.85;text-align:center;letter-spacing:-.02em}
.rbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rbtns button{border:0;border-radius:14px;min-height:64px;font-family:var(--display);font-weight:900;font-size:1.4rem;text-transform:uppercase;background:color-mix(in srgb,var(--ink) 16%,transparent);color:var(--ink)}
.next{background:var(--ink);color:var(--chalk);border-radius:14px;padding:14px;display:grid;gap:4px}
.next .n{font-family:var(--display);font-weight:900;font-size:1.9rem;text-transform:uppercase;line-height:1}
.next .eyebrow{color:var(--dim)!important}
.sess.rest .btn.main{background:var(--ink);color:var(--chalk)}
.toast{background:var(--ink);color:var(--chalk);border-radius:12px;padding:10px 14px;font-weight:600}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale.six{grid-template-columns:repeat(6,1fr)}
.scale button{border:2px solid var(--line);background:transparent;border-radius:12px;min-height:56px;font-family:var(--display);font-weight:900;font-size:1.6rem}
.scale button.on{background:var(--chalk);color:var(--ink);border-color:var(--chalk)}
.scale-l{display:flex;justify-content:space-between;font-size:.75rem;color:var(--dim)}
.list{display:grid;gap:6px}
.list button{border:0;border-radius:12px;background:var(--rubber);padding:12px;text-align:left;display:flex;justify-content:space-between;gap:10px;min-height:52px}
.list button.cur{box-shadow:0 0 0 2px var(--chalk)}
.pace{font-family:var(--display);font-weight:900;font-size:3.2rem;line-height:.9}
/* onglet Info : schéma animé */
.nav .in{grid-template-columns:repeat(6,1fr)}
.figbox{background:var(--floor);border-radius:12px;width:100%;aspect-ratio:1/1;max-height:60vh;overflow:hidden}
.figbox #fig{position:absolute;inset:6px;width:calc(100% - 12px);height:calc(100% - 12px);display:block}
.figbox canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none}
.figbox.is3d #fig{display:none}
#figmarks{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#figmarks .m-text{font-size:11px}
.viewbtns{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.viewbtns .chip{min-width:0;padding-left:4px;padding-right:4px;min-height:40px;font-size:.9rem;text-align:center}
.viewbtns[hidden]{display:none}
.b{fill:var(--chalk)}
.b-on{fill:var(--c,var(--ok))}
.b-back{fill:var(--dim);opacity:.45}
.b-shoe{fill:var(--dim)}
.b-head{fill:var(--chalk)}
.g-floor{stroke:var(--line);stroke-width:3}
.g-plate{fill:var(--steel);fill-opacity:.88;stroke:var(--bar);stroke-width:2}
.g-ring{fill:none;stroke:var(--line);stroke-width:1.5}
.g-hub{fill:var(--bar)}
.g-box{fill:var(--steel);stroke:var(--line);stroke-width:1.5}
.g-post{stroke:var(--bar);stroke-width:4;stroke-linecap:round}
.g-steelfill{fill:var(--bar)}
.g-weight{fill:var(--bar)}
.g-cable{stroke:var(--dim);stroke-width:1.6;stroke-dasharray:4 3}
.g-guide{stroke:var(--dim);stroke-width:1.3;stroke-dasharray:2 4;stroke-linecap:round}
.m-line{stroke:var(--warn);stroke-width:1.1}
.m-dot{fill:var(--warn);stroke:var(--floor);stroke-width:1.2}
.m-box{fill:var(--warn-bg);stroke:var(--warn);stroke-width:.9}
.m-text{fill:var(--warn);font:600 7.6px var(--body)}
.figtag{position:absolute;z-index:2;pointer-events:none;top:8px;left:10px;font-family:var(--display);font-weight:800;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.figbox{position:relative}
.figtext .figwarn{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:4px;color:var(--warn);font-weight:500}
.figwarn li::before{content:"⚠ "}
.mmap{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:12px;align-items:center}
.mmap svg{width:100%;height:auto;display:block;max-height:300px}
.mm{fill:var(--steel);stroke:var(--floor);stroke-width:.5}
.mm-prim{fill:var(--c,var(--ok))}
.mm-sec{fill:color-mix(in srgb,var(--c,var(--ok)) 42%,var(--steel))}
.mm-skin{fill:var(--line)}
.mm-t{fill:var(--dim);font:600 8px var(--body)}
.mlist{display:grid;gap:10px;font-size:.88rem}
.mlist ul{list-style:none;margin:4px 0 0;padding:0;display:grid;gap:3px}
.mlist .k{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:var(--c,var(--ok))}
.mlist .k.s{background:color-mix(in srgb,var(--c,var(--ok)) 42%,var(--steel))}
.errs li::marker{color:var(--bad)}
/* consignes */
.guide{border-top:1px solid var(--line);padding:2px 0}
.guide summary{font-weight:600;min-height:44px;display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer;list-style:none}
.guide summary::-webkit-details-marker{display:none}
.guide summary::after{content:"›";font-size:1.3rem;color:var(--dim);transition:transform .15s}
.guide[open] summary::after{transform:rotate(90deg)}
.guide ul{margin:0 0 10px;padding-left:18px;display:grid;gap:6px;font-size:.92rem}
/* tuiles de bilan */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile b small{font-size:.55em;color:var(--dim);margin-left:2px}
.msets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px}
.msets div{background:var(--steel);border-radius:10px;padding:8px 10px;display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-size:.88rem}
.msets div b{font-family:var(--display);font-size:1.25rem}
.msets div.zero{opacity:.55}
.tile{background:var(--steel);border-radius:12px;padding:10px 6px;text-align:center;display:grid;gap:2px;min-width:0}
.sess .tile{background:var(--rubber)}
.tile b{font-family:var(--display);font-weight:900;font-size:1.75rem;line-height:1}
.tile span{font-size:.72rem;color:var(--dim)}
.delta{color:var(--ok);font-weight:600}
.notice{border:2px solid var(--ok);border-radius:14px;padding:14px;display:grid;gap:8px;background:var(--rubber)}
.notice ul{margin:0;padding-left:18px;display:grid;gap:3px;font-size:.9rem}
.alert.soft{background:var(--steel);color:var(--chalk)}
.meta{font-size:.82rem;color:var(--dim)}
.inforow svg{width:66px;height:58px;flex:none}
.inforow .nm{flex:1;min-width:0}
.toast.pr{background:var(--chalk);color:var(--ink);font-family:var(--display);font-weight:900;font-size:1.35rem;text-transform:uppercase;line-height:1.05}
.sess.rest .toast.pr{background:var(--ink);color:var(--chalk)}
/* matière et petits mouvements */
body{background-image:radial-gradient(color-mix(in srgb,var(--chalk) 5%,transparent) 1px,transparent 1.4px);background-size:15px 15px}
.card{box-shadow:inset 0 1px 0 color-mix(in srgb,var(--chalk) 5%,transparent)}
@media (prefers-reduced-motion:no-preference){
  button,.chip,.btn,label.btn{transition:transform .08s ease,background-color .15s ease,border-color .15s ease}
  button:active,.btn:active{transform:scale(.97)}
  .view.enter>*{animation:rise .24s ease-out both}
  .stepper input.pop{animation:pop .2s ease-out}
  .toast.pr{animation:pop .35s ease-out}
  .m-dot{animation:beat 1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
}
@keyframes rise{from{opacity:.55;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.09)}100%{transform:scale(1)}}
@keyframes beat{50%{transform:scale(1.5)}}
/* la semaine : des disques enfilés sur une barre */
.week{background:linear-gradient(var(--bar),var(--bar)) no-repeat 0 calc(100% - 19px)/100% 4px;row-gap:6px}
.week button{height:auto;aspect-ratio:1;border-radius:50%;width:100%;max-width:42px;justify-self:center;background:radial-gradient(circle,var(--steel) 0 34%,transparent 36%);padding:0}
.week button.f{background:var(--c);box-shadow:inset 0 0 0 3px color-mix(in srgb,var(--c) 68%,#000)}
.week button.p{background:var(--rubber);border:2px dashed var(--c);color:var(--c)}
.week button.today{box-shadow:0 0 0 2px var(--chalk)}
.week button.f.today{box-shadow:inset 0 0 0 3px color-mix(in srgb,var(--c) 68%,#000),0 0 0 2px var(--chalk)}
.figctl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center}
.figctl input{width:100%;padding:0;border:0;background:transparent;accent-color:var(--c,var(--chalk));height:44px}
.figtext{background:var(--steel);border-radius:10px;padding:12px;min-height:5.4em}
.info ul{margin:0;padding-left:20px;display:grid;gap:6px}
.inforow{border:0;background:var(--steel);border-radius:12px;padding:12px 14px;min-height:52px;width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;font-weight:600}
.gloss{border-top:1px solid var(--line);padding:10px 0}
.gloss summary{font-weight:600;min-height:32px;cursor:pointer}
.gloss p{margin-top:6px}
.alert .row button{justify-self:auto}
[hidden]{display:none!important}

/* ===================== ATLAS =====================
   Sport moderne inspiré de la sculpture antique : fond anthracite, ivoire, une seule couleur d'accent (terre cuite).
   Police système, titres en minuscules, listes sobres, la couleur des séances réservée aux badges teintés.
   Sombre uniquement. Texte anthracite sur la terre cuite : 6,2:1 (le blanc n'atteint que 3:1). */
:root{
  --floor:#141312; --rubber:#1e1c1a; --steel:#2a2724; --line:#3a3632;
  --chalk:#efe8dc; --dim:#a39b8f; --ink:#141312;
  --acc:#e07a4f; --on-acc:#141312;
  --pA:#6fb5a3; --pB:#86a2e6; --pC:#d38fb8; --pD:#cfb487;
  --deload:#b6a6e8; --warn:#e9c46a; --warn-bg:rgba(233,196,106,.12); --ok:#8cc084; --bad:#ef6f5e; --claude:#d97757;
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:var(--body);
}
body{background-image:none;font-size:17px;line-height:1.4;letter-spacing:-.01em}
h1,h2,h3,.eyebrow,.brand,.btn,.chip,.tplpick b,.banner b,.week .d,.dowh,.stepper .u,.settag .t,.rbtns button,.next .n,.pill,.figtag,.toast.pr,.hday,.hmon{text-transform:none!important;letter-spacing:normal}
h1,h2,h3{font-weight:700;line-height:1.15;letter-spacing:-.02em}
h2{font-size:1.4rem} h3{font-size:1.1rem;font-weight:600}
.eyebrow{font-weight:600;font-size:.82rem;color:var(--dim)}
.num,.exl .num{font-family:var(--body);font-variant-numeric:tabular-nums}
/* en-tête : un grand titre par onglet, comme les applis iPhone */
.top{align-items:flex-end;padding-top:6px}
.ltitle{font-size:2.15rem;font-weight:700;letter-spacing:-.03em;line-height:1.05;margin:0}
.sync{padding-bottom:6px}
.hero{gap:8px;padding-top:0}
.hsub{font-size:1rem;color:var(--dim);font-weight:500;margin-top:-6px}
.cycle{gap:3px}
.cycle i{height:4px;border-radius:2px}
.cycle i.on{background:var(--acc)}
/* cartes et listes */
.card{border-radius:14px;padding:14px 16px;gap:12px;box-shadow:none}
.card.plate{border-top:0}
.chead{gap:12px}
.chead h2{font-size:1.3rem}
.disc{--s:44px;border-radius:12px;box-shadow:none;background:color-mix(in srgb,var(--c) 20%,transparent);color:var(--c);font-family:var(--body);font-weight:700;font-size:calc(var(--s)*.46)}
.disc.sm{--s:30px;border-radius:8px}
.exl{gap:0}
.exl .r{padding:9px 0;border-top:.5px solid var(--line);font-size:.95rem}
.exl .r:first-child{border-top:0}
.exl .r b{font-weight:500;flex:1 1 60%}
.exl .r span{flex:0 1 auto}
.lift{border-top:0;background:var(--steel)}
.lift .v,.stat .v,.tile b,.zone b,.pace,.msets div b{font-family:var(--body);font-weight:700;letter-spacing:-.02em}
.lift .v{font-size:1.6rem}
.tile b{font-size:1.45rem}
.tile span{font-size:.75rem}
.tplpick button{border-radius:12px;min-height:84px}
.tplpick b{font-family:var(--body);font-weight:600;font-size:1.05rem;line-height:1.2}
/* boutons : plein pour l'action principale, teinté sinon, texte seul pour les actions secondaires */
.btn{font-family:var(--body);font-weight:600;font-size:1.02rem;border-radius:12px;min-height:50px;padding:12px 16px;background:color-mix(in srgb,var(--acc) 15%,transparent);color:var(--acc)}
.btn.main{background:var(--acc);color:var(--on-acc);font-size:1.1rem;min-height:54px}
.btn.ghost{background:transparent;border:0;color:var(--acc);padding-inline:4px}
.btn.danger{border:0;background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.btn.sm{font-size:.95rem;min-height:40px;padding:8px 12px;border-radius:10px}
.btn.claude{background:var(--claude);color:var(--on-acc)}
.chip{font-family:var(--body);font-weight:600;font-size:.95rem;border:0;background:var(--steel);min-height:40px;border-radius:10px;padding:6px 12px}
.chip.on{background:color-mix(in srgb,var(--c,var(--acc)) 22%,transparent);color:var(--c,var(--acc));border:0;box-shadow:inset 0 0 0 1.5px var(--c,var(--acc))}
.banner{background:color-mix(in srgb,var(--c,var(--acc)) 18%,var(--rubber));color:var(--chalk);border-radius:14px}
.banner b{font-family:var(--body);font-weight:600;font-size:1.05rem}
.alert{background:var(--warn-bg);color:var(--chalk);border-radius:12px;font-weight:400;font-size:.93rem;box-shadow:inset 3px 0 0 var(--warn)}
.alert button{border:0;background:var(--steel);color:var(--chalk);font-weight:600}
.alert.soft{box-shadow:none}
.confirm{background:var(--warn-bg);color:var(--chalk);font-weight:400}
.notice{border:0;background:var(--rubber);box-shadow:inset 3px 0 0 var(--acc)}
input,select,textarea{background:var(--steel);border:0;border-radius:10px}
.pill{font-weight:600}
.toast.pr{font-family:var(--body);font-weight:700;font-size:1.1rem}
/* semaine et calendrier : pastilles teintées */
.week{background:none}
.week .d{font-family:var(--body);font-weight:600}
.week button{border-radius:10px;aspect-ratio:1;max-width:40px;background:var(--steel);font-family:var(--body);font-weight:700;font-size:1rem;color:var(--dim);box-shadow:none}
.week button.f{background:color-mix(in srgb,var(--c) 26%,transparent);color:var(--c);box-shadow:none}
.week button.p{background:transparent;border:1.5px dashed var(--c);color:var(--c)}
.week button.today,.week button.f.today{box-shadow:0 0 0 2px var(--acc)}
.dowh{font-family:var(--body);font-weight:600}
.day{border-radius:10px;border-width:1.5px}
.day .n{font-family:var(--body);font-variant-numeric:tabular-nums}
.day.today .n{background:var(--acc);color:var(--on-acc)}
.day.sel{border-color:var(--acc)}
.day .c{font-family:var(--body);font-weight:700;font-size:.85rem;background:color-mix(in srgb,var(--c) 26%,transparent);color:var(--c)}
.calhead button{background:var(--steel);color:var(--acc)}
/* barre d'onglets façon iPhone */
.nav{background:color-mix(in srgb,var(--rubber) 86%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--line);padding-top:4px}
.nav button{font-size:.66rem;font-weight:500;min-height:50px;gap:2px}
.nav button.on{color:var(--acc);background:transparent}
.nav button.on::before{display:none}
.nav button.cl{color:var(--dim)}
.nav button.cl.on{color:var(--acc)}
/* mode séance */
.sess h1{font-size:1.9rem;line-height:1.1;font-weight:700;letter-spacing:-.02em}
.settag .t{font-family:var(--body);font-weight:600;font-size:.85rem;background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--c)}
.shead button{background:var(--steel);border-radius:50%;width:40px;height:40px;font-size:1rem}
.segs i{height:4px}
.segs i.on{background:var(--c)}

<script>
/* Carnet de séances — logique pure (aucun accès au DOM ni à la base).
   Testée par test/logic.test.js, injectée telle quelle dans la page au build. */
const L = (() => {
  const BW = '__poids__';
  const DAY = 864e5;

  /* ---------- Dates ---------- */
  const pad = n => String(n).padStart(2, '0');
  const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
  const dayDiff = (a, b) => Math.round((parse(b) - parse(a)) / DAY);
  const weeksBetween = (a, b) => dayDiff(a, b) / 7;
  const dow = s => (parse(s).getDay() + 6) % 7;            // 0 = lundi
  const weekStart = s => addDays(s, -dow(s));
  const fr = s => { const d = parse(s); return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}`; };
  const frY = s => `${fr(s)}/${parse(s).getFullYear()}`;

  /* ---------- Nombres ---------- */
  const isNum = v => v !== '' && v != null && typeof v !== 'boolean' && !isNaN(v);
  const r1 = x => Math.round(x * 10) / 10;
  const roundTo = (x, step) => Math.round(Math.round(x / step) * step * 100) / 100;
  const e1rm = (kg, reps) => reps > 1 ? kg * (1 + reps / 30) : kg;   // Epley, comme la v4
  const frNum = x => String(Math.round(x * 100) / 100).replace('.', ',');
  const topOf = r => { const m = String(r ?? '').match(/(\d+)\s*-\s*(\d+)/); return m ? +m[2] : (/^\s*\d+\s*$/.test(String(r ?? '')) ? +r : null); };

  /* Durées : "20:28" → 1228 s, "1:02:05" → 3725 s, "56" → 56 min */
  function parseDur(v) {
    if (v == null || v === '') return null;
    if (typeof v === 'number') return v * 60;
    const p = String(v).trim().split(':').map(Number);
    if (p.some(isNaN)) return null;
    if (p.length === 1) return p[0] * 60;
    if (p.length === 2) return p[0] * 60 + p[1];
    return p[0] * 3600 + p[1] * 60 + p[2];
  }
  function fmtDur(sec) {
    sec = Math.max(0, Math.round(sec));
    const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
    return h ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
  }
  const fmtPace = secPerKm => isFinite(secPerKm) && secPerKm > 0 ? fmtDur(secPerKm) : '—';

  /* ---------- Cycle ---------- */
  function cycleInfo(dateIso, cycle) {
    const n = +cycle?.weeks || 7;
    const w = Math.floor(dayDiff(cycle.start, dateIso) / 7);
    if (w < 0) return null;
    const pos = (w % n) + 1;
    return { pos, n, deload: pos === n, cycleNo: Math.floor(w / n) + 1 };
  }
  function deloadStart(dateIso, cycle) {
    const c = cycleInfo(dateIso, cycle); if (!c) return null;
    return addDays(cycle.start, ((c.cycleNo - 1) * c.n + c.n - 1) * 7);
  }

  /* ---------- Séances types ---------- */
  const tplList = templates => Object.entries(templates || {}).sort((a, b) => (a[1].order ?? 9) - (b[1].order ?? 9));
  const unitOf = ex => ex.unit || 'kg';
  function exDef(templates, name) {
    for (const [id, t] of tplList(templates)) for (const ex of t.exercises || []) if (ex.name === name) return { id, ex };
    return null;
  }
  /* barre = schéma lourde + séries ; pdc = poids du corps lesté ; km ; simple = le reste */
  const kind = ex => ex.scheme ? 'barre' : ex.loadAt ? 'pdc' : unitOf(ex) === 'km' ? 'km' : 'simple';
  /* Deuxième grandeur saisie à chaque série : répétitions, mètres, ou rien */
  function repsUnit(ex) {
    const u = unitOf(ex);
    if (u !== 'kg') return null;
    if (/\d\s*m\b/.test(String(ex.reps || ''))) return 'm';
    return 'reps';
  }
  function valStep(ex) {
    const u = unitOf(ex);
    if (u === 'kg') return kind(ex) === 'pdc' ? 2.5 : (+ex.step || 2.5);
    return { s: 5, cm: 5, km: 0.1, min: 1, reps: 1 }[u] || 1;
  }
  function defaultRest(ex) {
    if (isNum(ex.rest)) return +ex.rest;
    const k = kind(ex), u = unitOf(ex);
    if (k === 'barre') return 180;
    if (k === 'pdc') return 150;
    if (u === 'cm') return 120;
    if (u === 's') return 60;
    return 90;
  }
  const nSets = ex => Math.max(1, ex.scheme ? ex.scheme.length : (parseInt(ex.sets, 10) || 1));

  /* ---------- Historique ---------- */
  function history(logs, exName) {
    return Object.keys(logs || {}).sort()
      .map(k => ({ date: k, e: logs[k].entries?.[exName], log: logs[k] }))
      .filter(x => x.e && !x.e.skipped && isNum(x.e.val));
  }
  function lastBefore(logs, exName, dateIso, cycle, skipDeload) {
    const h = history(logs, exName).filter(x => x.date < dateIso && (!skipDeload || !cycleInfo(x.date, cycle)?.deload));
    return h[h.length - 1] || null;
  }
  function missing(log, tpl, todayIso, dateIso) {
    if (!tpl || !log) return false;
    if (log.status !== 'faite' && dateIso >= todayIso) return false;
    /* Seule une séance sans aucune valeur notée compte comme à compléter : un exercice ajouté plus tard au programme ne rend pas incomplètes les anciennes séances */
    return !Object.values(log.entries || {}).some(e => e?.skipped || isNum(e?.val));
  }

  /* Mesure suivie pour une séance (identique à la v4) */
  function metric(ex, e) {
    if (!e) return null;
    const k = kind(ex);
    if (k === 'barre') {
      const sets = (e.sets || []).filter(s => isNum(s.val) && isNum(s.reps));
      if (!sets.length) return isNum(e.val) ? +e.val : null;
      return Math.max(...sets.map(s => e1rm(+s.val, +s.reps)));
    }
    if (k === 'pdc') {
      const sets = (e.sets || []).filter(s => isNum(s.reps));
      return sets.length ? Math.max(...sets.map(s => +s.reps)) : (isNum(e.reps) ? +e.reps : null);
    }
    return isNum(e.val) ? +e.val : null;
  }
  function describe(ex, e) {
    if (!e) return '';
    if (e.skipped) return 'passé';
    const u = unitOf(ex), ru = repsUnit(ex);
    const fv = v => frNum(+v);
    if (e.sets?.length) {
      return e.sets.filter(s => s && (isNum(s.val) || isNum(s.reps))).map(s => {
        const v = isNum(s.val) ? fv(s.val) : '0';
        if (kind(ex) === 'pdc') return `${+s.val > 0 ? '+' + v + ' kg' : 'sans lest'} × ${isNum(s.reps) ? s.reps : '?'}`;
        if (!ru) return `${v} ${u === 'reps' ? 'répétitions' : u}`;
        return `${v}${u === 'kg' ? ' kg' : ''} × ${isNum(s.reps) ? s.reps : '?'}${ru === 'm' ? ' m' : ''}`;
      }).join(' · ');
    }
    if (!isNum(e.val)) return '';
    return `${fv(e.val)} ${u}${isNum(e.reps) ? ` × ${e.reps}` : ''}`;
  }
  /* Résumé enregistré : val/reps = meilleure série (format v4), + sets et targets */
  function finalize(ex, e) {
    if (!e) return e;
    if (e.skipped) return { skipped: true };
    if (!e.sets) return e;
    const out = {};
    if (e.targets) out.targets = e.targets.slice();
    const sets = e.sets.map(s => s || {}).map(s => ({ val: isNum(s.val) ? +s.val : '', reps: isNum(s.reps) ? +s.reps : '', ...(isNum(s.rir) ? { rir: +s.rir } : {}) }));
    out.sets = sets;
    const done = sets.filter(s => isNum(s.reps) || isNum(s.val));
    if (!done.length) return out;
    if (ex.loadAt) {
      const b = done.reduce((a, s) => (+s.reps || 0) > (+a.reps || 0) ? s : a, done[0]);
      return { ...out, val: isNum(b.val) ? +b.val : 0, reps: isNum(b.reps) ? +b.reps : '' };
    }
    const withVal = done.filter(s => isNum(s.val));
    if (!withVal.length) return out;
    const b = withVal.reduce((a, s) => +s.val > +a.val ? s : a, withVal[0]);
    return { ...out, val: +b.val, reps: isNum(b.reps) ? +b.reps : '' };
  }

  /* ---------- Progression : charges proposées pour la prochaine séance ---------- */
  function suggest(ex, last, opt = {}) {
    const k = kind(ex), deload = !!opt.deload, e = last || null;
    const step = valStep(ex);
    if (k === 'barre') {
      const base = ex.scheme.map(s => +s.reps);
      const lastT = e?.targets?.length === base.length ? e.targets.map(Number) : base;
      const heavyLast = isNum(e?.sets?.[0]?.val) ? +e.sets[0].val : (isNum(e?.val) ? +e.val : null);
      if (heavyLast == null) {
        return { sets: ex.scheme.map((s, i) => ({ label: s.label, val: '', reps: base[i], target: base[i] })), targets: base, note: 'Première fois : choisis une charge qui te laisse encore 1 à 2 répétitions possibles en fin de série.', kindNote: 'first' };
      }
      const met = !!e && ex.scheme.every((s, i) => isNum(e.sets?.[i]?.reps) && +e.sets[i].reps >= lastT[i]);
      let heavy = heavyLast, T = lastT, note = '', kn = 'same';
      if (deload) {
        heavy = roundTo(heavyLast * 0.9, 2.5); T = base;
        const back = roundTo(heavy * 0.9, 2.5);
        return { sets: [{ label: ex.scheme[0].label, val: heavy, reps: T[0], target: T[0] }, { label: ex.scheme[1]?.label || 'Série 2', val: back, reps: T[1] ?? T[0], target: T[1] ?? T[0] }], targets: [T[0], T[1] ?? T[0]], note: 'Semaine d’allègement : charge réduite de 10 %, 2 séries seulement. Arrête-toi quand il te reste 3 à 4 répétitions possibles.', kindNote: 'deload' };
      }
      const plus = lastT.some((t, i) => t > base[i]);
      const r0 = +e?.sets?.[0]?.reps, q0 = e?.sets?.[0]?.rir, hasQ = isNum(q0);
      /* Série lourde trop facile : 2 répétitions de plus que prévu, ou 3 en réserve ou plus. Sans réserve notée, on suppose 1.
         On vise la charge qui laisse environ 1 répétition en réserve. */
      if (met && isNum(r0) && (hasQ ? r0 + +q0 : r0 + 1) >= lastT[0] + 3) {
        heavy = Math.max(heavyLast + step, roundTo(e1rm(heavyLast, hasQ ? r0 + +q0 : r0) / (1 + (base[0] + 1) / 30), step)); T = base;
        note = r0 >= lastT[0] + 2
          ? `Dernière fois, ${r0} répétitions à la série lourde au lieu de ${lastT[0]} : la charge était trop légère, passe à ${frNum(heavy)} kg.`
          : `Dernière fois, il te restait ${q0} répétitions en réserve à la série lourde : la charge était trop légère, passe à ${frNum(heavy)} kg.`;
        kn = 'up';
      } else if (met) {
        if (ex.double && !plus) { T = base.map(r => r + 1); note = 'Dernière fois, tu as fait toutes les répétitions : garde la même charge et fais 1 répétition de plus par série.'; kn = 'reps'; }
        else { heavy = heavyLast + step; T = base; note = `Dernière fois, tu as fait toutes les répétitions : ajoute ${frNum(step)} kg.`; kn = 'up'; }
      } else note = 'Garde la même charge jusqu’à réussir toutes les répétitions prévues.';
      /* Séries suivantes : environ 90 % de la lourde, sans redescendre sous une charge déjà réussie */
      const lastBack = isNum(e?.sets?.[1]?.val) ? +e.sets[1].val : 0;
      const back = met ? Math.max(roundTo(heavy * 0.9, 2.5), Math.min(lastBack, heavy)) : roundTo(heavy * 0.9, 2.5);
      return { sets: ex.scheme.map((s, i) => ({ label: s.label, val: i === 0 ? heavy : back, reps: T[i], target: T[i] })), targets: T, note, kindNote: kn };
    }
    let n = nSets(ex);
    if (deload) n = Math.ceil(n / 2);
    const ls = (e?.sets || []).filter(s => s && (isNum(s.val) || isNum(s.reps)));
    if (k === 'pdc') {
      const lest = ls.length ? Math.max(...ls.map(s => isNum(s.val) ? +s.val : 0)) : (isNum(e?.val) ? +e.val : 0);
      const met = ls.length >= nSets(ex) && ls.every(s => isNum(s.reps) && +s.reps >= ex.loadAt);
      const add = met && !deload ? 2.5 : 0;
      const sets = Array.from({ length: n }, (_, j) => ({ label: `Série ${j + 1}`, val: lest + add, reps: add ? '' : (ls[j]?.reps ?? ls[ls.length - 1]?.reps ?? '') }));
      const note = deload ? 'Semaine d’allègement : moitié moins de séries. Arrête-toi quand il te reste 3 à 4 répétitions possibles.'
        : met ? `Tu as fait ${ex.loadAt} répétitions à toutes les séries : ajoute 2,5 kg de lest.` : (e ? `Ajoute du lest quand tu fais ${ex.loadAt} répétitions à toutes les séries.` : 'Indique le lest : 0 si tu travailles sans lest.');
      return { sets, note, kindNote: deload ? 'deload' : met ? 'up' : 'same' };
    }
    const lastVal = ls.length ? Math.max(...ls.filter(s => isNum(s.val)).map(s => +s.val), -Infinity) : (isNum(e?.val) ? +e.val : null);
    const hasVal = lastVal != null && isFinite(lastVal);
    const top = topOf(ex.reps);
    const ru = repsUnit(ex);
    const met = unitOf(ex) === 'kg' && ru && top && ls.length >= nSets(ex) && ls.every(s => isNum(s.reps) && +s.reps >= top);
    let val = hasVal ? lastVal : (unitOf(ex) === 'reps' ? (parseInt(ex.reps, 10) || '') : '');
    let note = '';
    if (hasVal && deload && unitOf(ex) === 'kg') { val = roundTo(lastVal * 0.9, step); note = 'Semaine d’allègement : charge réduite de 10 %, moitié moins de séries.'; }
    else if (deload) note = 'Semaine d’allègement : moitié moins de séries.';
    else if (met && ru === 'reps' && ls.every(s => +s.reps + (isNum(s.rir) ? +s.rir : 0) >= top + 3)) {
      const minR = Math.min(...ls.map(s => +s.reps + (isNum(s.rir) ? +s.rir : 0))), withQ = ls.some(s => isNum(s.rir));
      val = Math.max(lastVal + step, roundTo(e1rm(lastVal, minR) / (1 + top / 30), step));
      note = `${minR} répétitions ${withQ ? 'possibles' : 'ou plus'} pour un objectif de ${String(ex.reps).replace(/(\d)\s*-\s*(\d)/, '$1 à $2')} : la charge était trop légère, passe à ${frNum(val)} kg.`;
    }
    else if (met) { val = lastVal + step; note = ru === 'm' ? `Tu as tenu ${top} m à chaque série : ajoute ${frNum(step)} kg par main.` : `Tu as atteint le haut de ton objectif de répétitions : ajoute ${frNum(step)} kg.`; }
    const sets = Array.from({ length: n }, (_, j) => ({ label: `Série ${j + 1}`, val, reps: ru ? (met ? '' : (ls[j]?.reps ?? ls[ls.length - 1]?.reps ?? '')) : '' }));
    return { sets, note, kindNote: deload ? 'deload' : met ? 'up' : 'same' };
  }

  /* ---------- Disques et échauffement ---------- */
  function platesPerSide(total, bar = 20, avail = [20, 10, 5, 2.5, 1.25]) {
    if (!isNum(total)) return { side: [], ok: false };
    let rem = Math.round((+total - bar) / 2 * 1000) / 1000;
    if (rem < 0) return { side: [], ok: false, under: true };
    const side = [];
    for (const p of [...avail].sort((a, b) => b - a)) while (rem >= p - 1e-9) { side.push(p); rem = Math.round((rem - p) * 1000) / 1000; }
    return { side, ok: rem < 1e-9, rest: rem };
  }
  function warmup(work, opt = {}) {
    const bar = opt.bar ?? 20;
    if (!isNum(work) || +work < bar + 15) return [];
    const out = opt.fromFloor ? [] : [{ val: bar, reps: 10 }];
    for (const [p, reps] of [[0.4, 5], [0.6, 3], [0.75, 2], [0.88, 1]]) {
      const v = Math.max(bar, roundTo(work * p, 2.5));
      if (v >= work) continue;
      if (out.length && v <= out[out.length - 1].val) continue;
      out.push({ val: v, reps });
    }
    return out;
  }

  /* ---------- Records ---------- */
  function scoreSet(ex, s, bw) {
    if (!s || unitOf(ex) === 'reps') return null;
    const k = kind(ex), u = unitOf(ex);
    if (k === 'barre' || (u === 'kg' && repsUnit(ex) === 'reps' && k !== 'pdc')) return isNum(s.val) && isNum(s.reps) && +s.reps > 0 ? e1rm(+s.val, +s.reps) : null;
    if (k === 'pdc') return isNum(s.reps) && +s.reps > 0 ? e1rm(bw + (isNum(s.val) ? +s.val : 0), +s.reps) : null;
    return isNum(s.val) ? +s.val : null;
  }
  const entrySets = e => (e?.sets?.length ? e.sets : (e && isNum(e.val) ? [{ val: e.val, reps: e.reps }] : [])).filter(Boolean);
  function bestOf(ex, hist, bw) {
    let best = null;
    for (const h of hist) for (const s of entrySets(h.e)) {
      const sc = scoreSet(ex, s, bw);
      if (sc != null && (!best || sc > best.score)) best = { score: sc, set: s, date: h.date };
    }
    return best;
  }
  function prLabel(ex, s, score) {
    const k = kind(ex), u = unitOf(ex);
    if (k === 'barre' || (u === 'kg' && k !== 'pdc' && repsUnit(ex) === 'reps')) return `Max estimé : ${frNum(r1(score))} kg (${frNum(+s.val)} kg × ${s.reps})`;
    if (k === 'pdc') return `${+s.val > 0 ? '+' + frNum(+s.val) + ' kg' : 'sans lest'} × ${s.reps}`;
    if (k === 'km') return `Plus longue course : ${frNum(score)} km`;
    return `${frNum(score)} ${u}`;
  }
  /* Records battus par `entry` par rapport à l'historique précédent (rien la première fois) */
  function newPRs(ex, entry, prevHist, bw = 75) {
    if (!entry || entry.skipped || !prevHist.length) return [];
    const prev = bestOf(ex, prevHist, bw), cur = bestOf(ex, [{ e: entry, date: '' }], bw);
    if (!cur || !prev || cur.score <= prev.score + 1e-6) return [];
    return [prLabel(ex, cur.set, cur.score)];
  }

  /* ---------- Course ---------- */
  function runOf(log, tpl) {
    if (!log || !tpl) return null;
    const exKm = (tpl.exercises || []).find(x => unitOf(x) === 'km');
    const exMin = (tpl.exercises || []).find(x => unitOf(x) === 'min');
    const km = exKm && isNum(log.entries?.[exKm.name]?.val) ? +log.entries[exKm.name].val : null;
    const sec = isNum(log.run?.sec) ? +log.run.sec : (exMin && isNum(log.entries?.[exMin.name]?.val) ? +log.entries[exMin.name].val * 60 : null);
    return { km, sec, pace: km && sec ? sec / km : null, type: log.run?.type || null, hr: log.run?.hr ?? null, treadmill: !!log.run?.treadmill };
  }
  const riegel = (km, sec, toKm) => sec * Math.pow(toKm / km, 1.06);
  function paceZones(ref) {
    const p5 = riegel(ref.km, ref.sec, 5) / 5;
    return { p5, easy: [p5 * 1.22, p5 * 1.33], tempo: p5 * 1.06, interval: p5 * 1.0, ref };
  }
  function bestRunRef(logs, templates, base, todayIso) {
    let best = base ? { ...base, p: riegel(base.km, base.sec, 5) } : null;
    for (const [k, log] of Object.entries(logs || {})) {
      if (log.status !== 'faite' || log.templateId !== 'D' || weeksBetween(k, todayIso) > 12) continue;
      const r = runOf(log, templates?.D);
      if (!r?.km || !r.sec || r.km < 3) continue;
      const p = riegel(r.km, r.sec, 5);
      if (!best || p < best.p) best = { km: r.km, sec: r.sec, p, date: k };
    }
    return best;
  }
  function runPRs(run, prevRuns) {
    const out = [];
    if (!run?.km || !prevRuns.length) return out;
    const longest = Math.max(...prevRuns.map(r => r.km || 0));
    if (run.km > longest + 1e-6) out.push(`Plus longue course : ${frNum(run.km)} km`);
    const paced = prevRuns.filter(r => r.km >= 3 && r.pace);
    if (run.km >= 3 && run.pace && paced.length && run.pace < Math.min(...paced.map(r => r.pace)) - 0.5) out.push(`Meilleure allure : ${fmtPace(run.pace)} /km`);
    return out;
  }

  /* ---------- Enchaînements ---------- */
  function sequenceAlerts(logs, from, to) {
    const out = [], L0 = logs || {};
    const isHard = l => l?.templateId === 'D' && l.run?.type === 'soutenue';
    for (let d = from; d <= to; d = addDays(d, 1)) {
      const a = L0[d], b = L0[addDays(d, 1)];
      if (!a || !b) continue;
      if (isHard(a) && b.templateId === 'C') out.push({ date: d, next: addDays(d, 1), code: 'hard-before-C', text: `Course soutenue le ${fr(d)}, la veille de la séance C : tes jambes seront fatiguées pour le squat et les sauts.` });
      const pair = [a.templateId, b.templateId].sort().join('');
      if (a.templateId === b.templateId && a.templateId !== 'D') out.push({ date: d, next: addDays(d, 1), code: 'same-twice', text: `La séance ${a.templateId} est notée deux jours de suite, le ${fr(d)} et le ${fr(addDays(d, 1))} : vérifie qu’il ne s’agit pas d’un doublon.` });
      if (pair === 'AC') out.push({ date: d, next: addDays(d, 1), code: 'A-C', text: `A et C deux jours de suite (${fr(d)} et ${fr(addDays(d, 1))}) : le bas du dos n’a pas le temps de récupérer entre soulevé de terre et squat.` });
    }
    const weeks = {};
    for (const [d, l] of Object.entries(L0)) if (d >= weekStart(from) && d <= to && isHard(l)) (weeks[weekStart(d)] = weeks[weekStart(d)] || []).push(d);
    for (const [w, ds] of Object.entries(weeks)) if (ds.length > 1) out.push({ date: ds.sort()[1], code: 'two-hard', text: `Deux courses soutenues la semaine du ${fr(w)} : garde-en une seule.` });
    return out.sort((x, y) => x.date.localeCompare(y.date));
  }

  /* Séance suivante dans la rotation A, B, course facile, C, course soutenue,
     en évitant les enchaînements interdits avec ce qui est déjà au calendrier */
  const NEXT = { A: ['B'], B: ['D', 'facile'], 'D:facile': ['C'], C: ['D', 'soutenue'], 'D:soutenue': ['A'] };
  function suggestNext(logs, dateIso) {
    /* Toute séance passée fait avancer la rotation, même sans « Terminer » : faite, on ne la refait pas ; ratée, on ne la rattrape pas. Pour l'annuler, la retirer du calendrier. */
    const prev = Object.keys(logs || {}).filter(k => k < dateIso).sort().pop();
    const l = prev && logs[prev];
    const key = !l ? null : l.templateId === 'D' ? `D:${l.run?.type === 'soutenue' ? 'soutenue' : 'facile'}` : l.templateId;
    const first = NEXT[key] || ['A'];
    const order = [first, ['A'], ['B'], ['D', 'facile'], ['C']].filter((c, i, a) => a.findIndex(x => x.join() === c.join()) === i);
    for (const [id, type] of order) {
      const trial = { ...logs, [dateIso]: { templateId: id, ...(type ? { run: { type } } : {}) } };
      const bad = sequenceAlerts(trial, addDays(dateIso, -1), dateIso).some(a => a.date === dateIso || a.next === dateIso);
      if (!bad) return { id, type: type || null, rotation: id === first[0] && (type || null) === (first[1] || null) };
    }
    return { id: 'D', type: 'facile', rotation: false };
  }

  /* ---------- Consignes en clair ---------- */
  function repsTarget(ex) {
    const r = String(ex.reps ?? '').trim();
    if (/max/i.test(r)) return '1 répétition de moins que ton maximum';
    const m = r.match(/^(\d+)(?:\s*-\s*(\d+))?\s*(par .+)?$/i);
    if (m) return `${m[1]}${m[2] ? ' à ' + m[2] : ''} répétitions${m[3] ? ' ' + m[3] : ''}`;
    return r.replace(/(\d)\s*-\s*(\d)/g, '$1 à $2');
  }
  function repsPlain(ex) {
    const u = unitOf(ex);
    if (u === 'km' || u === 'min') return String(ex.reps ?? '');
    if (ex.scheme?.length) {
      const [first, ...rest] = ex.scheme.map(s => +s.reps);
      if (!rest.length) return `1 série de ${first} répétitions`;
      return rest.every(x => x === rest[0])
        ? `1 série lourde de ${first}, puis ${rest.length} série${rest.length > 1 ? 's' : ''} de ${rest[0]} répétitions`
        : `${ex.scheme.length} séries : ${[first, ...rest].join(', ')} répétitions`;
    }
    const n = nSets(ex), s = n > 1 ? 'séries' : 'série';
    if (/max/i.test(String(ex.reps))) return `${n} ${s}, en t’arrêtant 1 répétition avant ton maximum`;
    const t = repsTarget(ex);
    return t ? `${n} ${s} de ${t}` : `${n} ${s}`;
  }
  /* Quand augmenter : la règle de progression de l'exercice, en une phrase */
  function progressRule(ex) {
    const k = kind(ex), step = frNum(valStep(ex)), ru = repsUnit(ex), top = topOf(ex.reps);
    if (k === 'barre') return ex.double ? `Quand tout est réussi : 1 répétition de plus par série à charge égale, puis +${step} kg` : `+${step} kg quand toutes les répétitions sont réussies`;
    if (k === 'pdc') return `+2,5 kg de lest dès ${ex.loadAt} répétitions à chaque série`;
    if (unitOf(ex) === 'kg' && ru && top) return `+${step} kg dès ${top} ${ru === 'm' ? 'm' : 'répétitions'} à chaque série`;
    return '';
  }
  /* Durée approximative : séries × (effort + repos), changement d'exercice et échauffement compris */
  function estimateMinutes(tpl) {
    let sec = 8 * 60;
    const alts = new Set();
    for (const ex of tpl?.exercises || []) {
      if (ex.alt) { if (alts.has(ex.alt)) continue; alts.add(ex.alt); }
      const u = unitOf(ex);
      if (u === 'km' || u === 'min') return null;
      const effort = /par (côté|jambe)/i.test(String(ex.reps)) ? 90 : 45;
      sec += nSets(ex) * (effort + defaultRest(ex)) + 60;
      if (ex.scheme) sec += 180;   // montée en charge
    }
    return Math.round(sec / 300) * 5;
  }
  /* Bilan chiffré d'une séance : tonnage = charge × répétitions, hors poids du corps et marche du fermier */
  function sessionStats(log, tpl, templates) {
    let tonnage = 0, sets = 0;
    for (const { ex, e } of entryRows(log, tpl, templates)) {
      if (!e || e.skipped) continue;
      const done = (e.sets || []).filter(s => s && (isNum(s.val) || isNum(s.reps)));
      sets += done.length;
      if (unitOf(ex) === 'kg' && repsUnit(ex) === 'reps' && kind(ex) !== 'pdc') for (const s of done) if (isNum(s.val) && isNum(s.reps)) tonnage += +s.val * +s.reps;
    }
    return { tonnage: Math.round(tonnage), sets, km: runOf(log, tpl)?.km || 0 };
  }
  /* Séries notées par groupe de muscles (muscles principaux de chaque exercice) : un repère de volume, plus parlant que le tonnage */
  const MUSCLE_GROUPS = [['Pectoraux', ['pec']], ['Dos', ['lat', 'midback', 'trap', 'lower']], ['Épaules', ['deltF', 'deltB']], ['Bras', ['bicep', 'tricep', 'forearm']], ['Jambes', ['quad', 'ham', 'glute', 'calf']], ['Tronc', ['abs', 'oblique']]];
  function muscleSets(logs, dates, templates, findSheet) {
    const out = MUSCLE_GROUPS.map(([name]) => ({ name, sets: 0 }));
    for (const d of dates) {
      const log = logs?.[d]; if (!log || log.status !== 'faite') continue;
      for (const { ex, e } of entryRows(log, templates?.[log.templateId], templates)) {
        if (!e || e.skipped || ['km', 'min'].includes(unitOf(ex))) continue;
        const n = (e.sets || []).filter(s => s && (isNum(s.val) || isNum(s.reps))).length || (isNum(e.val) ? 1 : 0);
        const prim = findSheet(ex.name)?.prim || [];
        MUSCLE_GROUPS.forEach(([, ids], i) => { if (ids.some(m => prim.includes(m))) out[i].sets += n; });
      }
    }
    return out;
  }
  /* Une course « facile » plus rapide que la zone facile n'est plus vraiment facile */
  function easyCheck(run, zones) {
    if (!run?.pace || !zones?.easy) return null;
    const [fast, slow] = zones.easy;
    return { pace: run.pace, tooFast: run.pace < fast - 5, tooSlow: run.pace > slow + 30, zone: zones.easy };
  }

  /* Exercices en alternance (même champ alt) : un seul par séance, celui fait le moins récemment.
     Ce qui est déjà noté ce jour-là reste affiché, pour ne jamais cacher une série faite. */
  function activeExercises(tpl, logs, dateIso) {
    const xs = tpl?.exercises || [], groups = {};
    for (const ex of xs) if (ex.alt) (groups[ex.alt] = groups[ex.alt] || []).push(ex);
    if (!Object.keys(groups).length) return xs;
    const keep = new Set(xs.filter(ex => !ex.alt));
    const lastDone = ex => { const h = history(logs, ex.name).filter(x => x.date < dateIso); return h.length ? h[h.length - 1].date : ''; };
    for (const list of Object.values(groups)) {
      const noted = list.filter(ex => { const e = logs?.[dateIso]?.entries?.[ex.name]; return e && !e.skipped; });
      if (noted.length) { noted.forEach(ex => keep.add(ex)); continue; }
      keep.add(list.reduce((a, b) => lastDone(b) < lastDone(a) ? b : a, list[0]));
    }
    return xs.filter(ex => keep.has(ex));
  }
  /* Dernière note laissée sur un exercice (réglage de machine, sensation) */
  function lastMemo(logs, exName, dateIso) {
    const k = Object.keys(logs || {}).filter(d => d < dateIso && logs[d].entries?.[exName]?.memo).sort().pop();
    return k ? { date: k, text: logs[k].entries[exName].memo } : null;
  }

  /* ---------- Nutrition ----------
     Besoins estimés : métabolisme de base (Mifflin-St Jeor) × activité, puis l'objectif.
     Protéines 1,6 g/kg : au-delà, les gains de muscle n'augmentent plus en moyenne (Morton 2018).
     Lipides 25 % des calories, glucides le reste. Ce sont des estimations : le poids dit s'il faut ajuster. */
  const ACTIVITY = { faible: 1.375, modere: 1.55, eleve: 1.725 };
  const GOAL_KCAL = { prise: 250, maintien: 0, seche: -400 };
  function nutritionTargets(p, weightKg) {
    if (!p || !isNum(p.age) || !isNum(p.height) || !isNum(weightKg) || !p.sex) return null;
    const w = +weightKg, bmr = 10 * w + 6.25 * +p.height - 5 * +p.age + (p.sex === 'F' ? -161 : 5);
    const tdee = bmr * (ACTIVITY[p.activity] || ACTIVITY.modere);
    const kcal = Math.round((tdee + (GOAL_KCAL[p.goal] ?? GOAL_KCAL.prise)) / 10) * 10;
    const protein = Math.round(1.6 * w), fat = Math.round(kcal * 0.25 / 9), carbs = Math.max(0, Math.round((kcal - protein * 4 - fat * 9) / 4));
    return { bmr: Math.round(bmr), tdee: Math.round(tdee), kcal, protein, fat, carbs };
  }
  /* Repère d'ajustement d'après l'évolution du poids sur 4 semaines */
  function calorieAdvice(weights, goal) {
    const ws = weightStats(weights);
    if (!ws || ws.d4 == null) return 'Pèse-toi 2 à 3 fois par semaine, le matin : après 4 semaines, l’app te dira s’il faut ajuster les calories.';
    const d = ws.d4, f = v => `${v > 0 ? '+' : ''}${frNum(r1(v))} kg`;
    const [lo, hi] = { prise: [0.4, 1.6], maintien: [-0.8, 0.8], seche: [-3, -0.8] }[goal] || [-0.8, 0.8];
    if (d < lo) return `${f(d)} en 4 semaines : moins que visé, ajoute environ 150 kcal par jour.`;
    if (d > hi) return `${f(d)} en 4 semaines : plus que visé, retire environ 150 kcal par jour.`;
    return `${f(d)} en 4 semaines : dans la cible, garde ces apports.`;
  }

  /* Plus longue course des N derniers jours (repère de prudence, étude Frandsen 2025) */
  function longestRun(logs, tpl, dateIso, days = 30) {
    let best = 0;
    for (const [k, log] of Object.entries(logs || {})) {
      if (k >= dateIso || dayDiff(k, dateIso) > days || log.status !== 'faite' || log.templateId !== 'D') continue;
      best = Math.max(best, runOf(log, tpl)?.km || 0);
    }
    return best;
  }

  /* Les séances passées gardent les exercices retirés ou déplacés depuis : on les affiche quand même */
  const RETIRED = {
    'Sauts verticaux': { name: 'Sauts verticaux', sets: '3', reps: '3 sauts', unit: 'reps' },
    'Fentes marchées ou step-ups': { name: 'Fentes marchées ou step-ups', sets: '2', reps: '8-10 par jambe', unit: 'kg' },
    'Face pull': { name: 'Face pull', sets: '2', reps: '12-15', unit: 'kg' },
    'Pallof press': { name: 'Pallof press', sets: '2', reps: '10 par côté', unit: 'kg' }
  };
  const exInfo = (templates, name) => exDef(templates, name)?.ex || RETIRED[name] || { name, unit: 'kg', reps: '' };
  function entryRows(log, tpl, templates) {
    const rows = (tpl?.exercises || []).map(ex => ({ ex, e: log?.entries?.[ex.name], planned: true })), seen = new Set(rows.map(r => r.ex.name));
    for (const [name, e] of Object.entries(log?.entries || {})) if (!seen.has(name)) rows.push({ ex: exInfo(templates, name), e, planned: false });
    return rows;
  }

  /* ---------- Évolution du programme ----------
     Appliquée une seule fois sur un téléphone déjà installé. Ne remplace jamais un texte
     que l'utilisateur a changé : seules les anciennes valeurs connues sont mises à jour. */
  const PROGRAM_VERSION = 6;
  const PROG2 = {
    rename: [['Développé couché léger', 'Développé couché pause']],
    add: {
      A: [['Tractions supination', { name: 'Suspension à la barre', sets: '2', reps: '45-60 s', unit: 's', main: true, rest: 90, tip: 'Tiens jusqu’à ce que la prise soit sur le point de lâcher. Dès 60 s aux 2 séries, ajoute du lest et note-le dans la remarque.' }],
        ['Marche du fermier', { name: 'Curl marteau', sets: '2', reps: '8-12', unit: 'kg', step: 2, tip: 'Note le poids d’un seul haltère. Coudes le long du corps.' }]],
      B: [[null, { name: 'Sauts verticaux', sets: '3', reps: '3 sauts', unit: 'reps', rest: 60, tip: 'Après l’échauffement. Saute le plus haut possible, chaque saut à fond. Ne fais pas ces séries fatigué.' }],
        ['Dips', { name: 'Extension triceps à la poulie', sets: '2', reps: '10-12', unit: 'kg', tip: 'Coudes immobiles, le long du corps.' }],
        ['Développé militaire haltères', { name: 'Fentes marchées ou step-ups', sets: '2', reps: '8-10 par jambe', unit: 'kg', step: 2, tip: 'Note le poids d’un seul haltère. Buste droit, pas de grand pas forcé.' }]]
    },
    edits: {
      'Soulevé de terre': {
        reps: [['1×4 lourde + 2×6'], '1 série lourde de 4, puis 2 séries de 6'],
        tip: [['repos 3-5 min, double pronation puis mixte sur la lourde seulement', 'Repos de 3 à 5 min. Paumes vers toi ; prise mixte seulement sur la série lourde.'], 'Repos de 3 à 5 min. Les deux paumes vers toi. Prise mixte seulement sur la série lourde, en changeant de main à chaque séance.'] },
      'Tractions pronation': { tip: [['note le lest, 0 au poids du corps', 'Indique le lest : 0 si tu travailles sans lest.'], 'Indique le lest : 0 si tu n’en mets pas.'] },
      'Tractions supination': { tip: [['note le lest, 0 au poids du corps', 'Indique le lest : 0 si tu travailles sans lest.'], 'Indique le lest : 0 si tu n’en mets pas.'] },
      'Rowing barre': { tip: [['seul tirage horizontal, buste stable'], 'Buste immobile, dos droit.'] },
      'Face pull': { tip: [['prévention épaules', 'Protège les épaules : garde une charge légère.'], 'Charge légère, coudes à hauteur d’épaules.'] },
      'Marche du fermier': {
        step: [[undefined], 2],
        tip: [['poids par main, grip + gainage', 'Note le poids d’une seule main. Travaille la prise et le gainage.'], 'Note le poids d’une seule main. Dès 40 m sur les 2 séries, ajoute 2 kg par main.'] },

  /* ---------- Points d'attention ---------- */
  function vbOf(sheet) { return (sheet.vb || '10 0 220 205').split(' ').map(Number); }
  function wrapLabel(text) {
    if (text.length <= 18) return [text];
    const w = text.split(' ');
    let a = '', i = 0;
    while (i < w.length && (a + ' ' + w[i]).trim().length <= Math.ceil(text.length / 2) + 2) a = (a + ' ' + w[i++]).trim();
    return [a, w.slice(i).join(' ')].filter(Boolean);
  }
  const xmlEsc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
  function drawMarks(sheet, J, t) {
    const i = Math.round(t), near = 1 - Math.abs(t - i) / 0.2;
    if (near <= 0) return '';
    const [vx, vy, vw, vh] = vbOf(sheet);
    let o = `<g style="opacity:${Math.min(1, near * 1.6).toFixed(2)}">`;
    for (const m of sheet.frames[i]?.warn || []) {
      const a = J[m.at] || J.hip, lines = wrapLabel(m.t), tw = Math.max(...lines.map(x => x.length)) * 3.95 + 10, th = lines.length * 9 + 5;
      let x = m.dx >= 0 ? a[0] + m.dx : a[0] + m.dx - tw, y = a[1] + m.dy - th / 2;
      x = Math.max(vx + 2, Math.min(vx + vw - tw - 2, x)); y = Math.max(vy + 2, Math.min(vy + vh - th - 2, y));
      const cx = Math.max(x, Math.min(x + tw, a[0])), cy = Math.max(y, Math.min(y + th, a[1]));
      o += `<line x1="${n1(a[0])}" y1="${n1(a[1])}" x2="${n1(cx)}" y2="${n1(cy)}" class="m-line"/>` + circ(a, 3.4, 'm-dot');
      o += `<rect x="${n1(x)}" y="${n1(y)}" width="${n1(tw)}" height="${th}" rx="3.5" class="m-box"/>`;
      lines.forEach((l, k) => { o += `<text x="${n1(x + tw / 2)}" y="${n1(y + 9.6 + k * 9)}" text-anchor="middle" class="m-text">${xmlEsc(l)}</text>`; });
    }
    return o + '</g>';
  }
  /* Étiquettes en 3D : rangées à gauche et à droite du corps, quel que soit l'angle de vue */
  function layoutMarks(items, W, H) {
    const cols = { l: [], r: [] };
    for (const it of items) {
      const lines = wrapLabel(it.t), w = Math.max(...lines.map(x => x.length)) * 5.7 + 12, h = lines.length * 14 + 6;
      cols[it.x < W / 2 ? 'l' : 'r'].push({ ...it, lines, w, h });
    }
    const out = [];
    for (const side of ['l', 'r']) {
      const c = cols[side].sort((a, b) => a.y - b.y);
      let y = 32;
      for (const b of c) { b.by = Math.max(y, Math.min(H - b.h - 6, b.y - b.h / 2)); y = b.by + b.h + 4; }
      let over = c.length ? c[c.length - 1].by + c[c.length - 1].h + 6 - H : 0;
      for (let i = c.length - 1; i >= 0 && over > 0; i--) { const lim = i ? c[i - 1].by + c[i - 1].h + 4 : 32, d = Math.min(over, c[i].by - lim); c[i].by -= d; over -= d; }
      for (const b of c) { b.bx = side === 'l' ? 6 : W - b.w - 6; b.side = side; out.push(b); }
    }
    return out;
  }
  function drawFigure(sheet, t, opt = {}) {
    const J = joints(poseAt(sheet, t)), w = sheet.work || [];

    o += leg(J.hip, J.knee2, J.foot2, J.toe2, 'b b-back', 'b b-back', 'b b-back');
    o += leg(J.hip, J.knee, J.foot, J.toe, c('thigh'), c('shin'), 'b b-shoe');
    const f = J.front, chest = along(J.hip, J.shoulder, 0.68), glute = along(J.hip, J.shoulder, 0.02);
    o += limb(J.hip, J.shoulder, 8.5, 9.5, c('torso'));
    o += circ([chest[0] + f[0] * 2.6, chest[1] + f[1] * 2.6], 9.2, c('torso')) + circ([glute[0] - f[0] * 2.8, glute[1] - f[1] * 2.8], 8.2, c('torso'));
    o += limb(J.shoulder, J.head, 3.6, 3.6, 'b');

function saveCache(){ LS.set('cache', { templates: S.templates, logs: S.logs, weights: S.weights, goals: S.goals, cycle: S.cycle, profile: S.profile, nutrition: S.nutrition }); }
function applyLocal(path, data){
  const [c, id] = path.split('/');
  if (c === 'settings') { if (id === 'cycle' && data) S.cycle = { ...S.cycle, ...data }; if (id === 'profile') S.profile = data?.text || ''; if (id === 'program') S.programVersion = +data?.version || 1; if (id === 'nutrition') S.nutrition = data || null; return; }
  if (!['templates','logs','weights','goals'].includes(c)) return;
  if (data == null) delete S[c][id]; else S[c][id] = data;
}
/* Toute écriture passe par la file d'attente : elle survit à une coupure réseau à la salle */
function write(path, data){
  const curEx = path.startsWith('templates/') && S.run && runExercises(S.templates[S.run.tid])[S.run.i]?.name;
  applyLocal(path, data);
  if (curEx) { const i = runExercises(S.templates[S.run.tid]).findIndex(x => x.name === curEx); if (i >= 0) S.run.i = i; }
  outbox[path] = data == null ? { __del: true } : JSON.parse(JSON.stringify(data));
  LS.set('outbox', outbox); saveCache(); renderSync(); flush();
}
let flushing = false;
async function flush(){
  if (!S.db || flushing) return;
  flushing = true;
  try {
    /* Recommence tant que des écritures arrivent pendant l'enregistrement */
    let failed = false;
    while (!failed && Object.keys(outbox).length) {
      for (const [p, d] of Object.entries(outbox)) {
        try {
          if (d.__del) await S.db.doc(p).delete(); else await S.db.doc(p).set(d);
          if (outbox[p] === d) { delete outbox[p]; LS.set('outbox', outbox); }
        } catch (e) { S.online = 'wait'; failed = true; break; }
      }
    }
  } finally { flushing = false; renderSync(); }
}
setInterval(flush, 15000);
window.addEventListener('online', flush);

/* Mini-lecteur : la séance réduite reste au-dessus des onglets, et le repos continue de tourner (et de sonner) */
function miniState(R){
  const t = S.templates[R.tid]; if (!t) return '';
  if (R.phase === 'rest') { const left = (R.restEnd - Date.now()) / 1000; return left > 0 ? `Repos · ${L.fmtDur(Math.ceil(left))}` : 'Repos terminé · c’est reparti'; }
  if (R.phase === 'feel0') return 'Avant de commencer';
  if (R.phase === 'end') return 'Fin de séance';
  if (R.phase === 'run') return 'Course';
  const xs = runExercises(t), x = xs[R.i]; return x ? `${R.i + 1}/${xs.length} · ${x.name}` : '';
}
function renderMini(){
  const m = $('mini'), R = S.run, on = !!(R && !S.showRun && S.templates[R.tid]), was = !m.hidden;
  m.hidden = !on; $('app').classList.toggle('hasmini', on);
  if (!on) { m.innerHTML = ''; return; }
  m.classList.toggle('enter', !was);
  m.classList.toggle('done', R.phase === 'rest' && R.restEnd <= Date.now());
  m.style.setProperty('--c', col(R.tid));
  m.innerHTML = `<button data-a="resume" aria-label="Reprendre la séance ${esc(tplName(R.tid))}"><span class="disc sm" style="--c:${col(R.tid)}" aria-hidden="true">${esc(R.tid)}</span><span class="mt"><b>${esc(tplName(R.tid))}</b><small id="ministate">${esc(miniState(R))}</small></span><span class="go">Reprendre</span></button>`;
  if (R.phase === 'rest' && R.restEnd > Date.now()) startTicker();
}
