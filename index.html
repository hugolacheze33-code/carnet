<script>
window.CARNET_MODE = 'pwa';
window.CARNET_VERSION = '2026-11-02 13:28';
/* Base locale : même interface que la base claude.ai, stockée sur le téléphone */
(function(){
  const KEY = 'carnet.db';
  const seed = {"templates":{"A":{"exercises":[{"main":true,"name":"Soulevé de terre","reps":"1×4 lourde + 2×6","scheme":[{"label":"Lourde","reps":4},{"label":"Série 2","reps":6},{"label":"Série 3","reps":6}],"sets":"3","step":2.5,"tip":"Repos de 3 à 5 min. Paumes vers toi ; prise mixte seulement sur la série lourde.","unit":"kg"},{"loadAt":12,"main":true,"name":"Tractions pronation","reps":"max −1","sets":"3","tip":"Indique le lest : 0 si tu travailles sans lest.","unit":"kg"},{"loadAt":12,"main":true,"name":"Tractions supination","reps":"max −1","sets":"2","tip":"Indique le lest : 0 si tu travailles sans lest.","unit":"kg"},{"name":"Rowing barre","reps":"6-8","sets":"2","tip":"Buste immobile, dos droit.","unit":"kg"},{"name":"Face pull","reps":"12-15","sets":"2","tip":"Protège les épaules : garde une charge légère.","unit":"kg"},{"name":"Marche du fermier","reps":"30-40 m","sets":"2","tip":"Note le poids d’une seule main. Travaille la prise et le gainage.","unit":"kg"}],"name":"Dos · tirage","order":1,"short":"A · Dos"},"B":{"exercises":[{"main":true,"name":"Développé couché","reps":"1×4 lourde + 2×6","scheme":[{"label":"Lourde","reps":4},{"label":"Série 2","reps":6},{"label":"Série 3","reps":6}],"sets":"3","step":2.5,"tip":"À faire en premier. Repos de 3 à 4 min.","unit":"kg","double":true},{"loadAt":10,"main":true,"name":"Dips","reps":"6-10","sets":"2","tip":"Indique le lest : 0 si tu travailles sans lest.","unit":"kg"},{"name":"Développé militaire haltères","reps":"8-10","sets":"2","tip":"Note le poids d’un seul haltère.","unit":"kg"},{"name":"Pallof press","reps":"10 par côté","sets":"2","tip":"Résiste à la rotation du buste.","unit":"kg"},{"name":"Planche latérale","reps":"30-45 s par côté","sets":"2","unit":"s"}],"name":"Poussée","order":2,"short":"B · Poussée"},"C":{"exercises":[{"name":"Sauts en longueur ou sur box","reps":"3 sauts","sets":"4","tip":"Après 5 à 8 min de cardio facile et de mobilité. Récupère complètement entre les séries.","unit":"cm"},{"main":true,"name":"Squat","reps":"1×4 lourde + 2×6","scheme":[{"label":"Lourde","reps":4},{"label":"Série 2","reps":6},{"label":"Série 3","reps":6}],"sets":"3","step":2.5,"tip":"Repos de 3 à 5 min.","unit":"kg"},{"name":"Développé couché léger","reps":"5","sets":"3","tip":"70 à 75 % de ta série lourde. Il doit te rester 2 à 3 répétitions possibles.","unit":"kg"},{"name":"Fentes bulgares","reps":"8-10","sets":"2","tip":"Fais toutes les répétitions d’une jambe, puis change.","unit":"kg"},{"name":"Leg curl ou Nordic curl","reps":"6-10","sets":"2","tip":"Protège l’arrière des cuisses pour la course.","unit":"kg"},{"name":"Mollets debout ou assis","reps":"10-15","sets":"3","tip":"Alterne debout et assis d’une séance à l’autre.","unit":"kg"}],"name":"Jambes · athlétisme","order":3,"short":"C · Jambes"},"D":{"exercises":[{"main":true,"name":"Distance","reps":"facile 45-70 min, ou 4×1 km / 3×8 min soutenues","sets":"1","tip":"Une seule séance soutenue par semaine, jamais la veille de la séance C.","unit":"km"},{"name":"Durée","reps":"allure où tu peux parler","sets":"1","unit":"min"}],"name":"Course","order":4,"short":"D · Course"}},"settings":{"cycle":{"start":"2026-10-05","weeks":7}}};
  let store; try { store = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { store = null; }
  if (!store) store = { templates: seed.templates, settings: seed.settings, logs: {}, weights: {}, goals: {} };
  const subs = new Set();
  const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} };
  /* Une mise à jour ne touche jamais aux données : elle en garde seulement une copie de sécurité */
  try {
    const seen = localStorage.getItem('carnet.version');
    if (seen && seen !== window.CARNET_VERSION) localStorage.setItem('carnet.db.avant-maj', JSON.stringify(store));
    localStorage.setItem('carnet.version', window.CARNET_VERSION);
  } catch (e) {}
  persist();
  const notify = () => subs.forEach(f => { try { f(); } catch (e) {} });
  const clone = d => JSON.parse(JSON.stringify(d));
  const db = {
    collection: c => ({ onSnapshot(cb){ const f = () => cb({ docs: Object.entries(store[c] || {}).map(([id, d]) => ({ id, exists: true, data: () => clone(d) })) }); subs.add(f); queueMicrotask(f); return () => subs.delete(f); } }),
    doc: p => { const [c, id] = p.split('/'); return {
      async set(d){ (store[c] = store[c] || {})[id] = clone(d); localStorage.setItem(KEY, JSON.stringify(store)); notify(); },
      async delete(){ if (store[c]) delete store[c][id]; persist(); notify(); },
      onSnapshot(cb){ const f = () => { const d = store[c] && store[c][id]; cb({ id, exists: !!d, data: () => d && clone(d) }); }; subs.add(f); queueMicrotask(f); return () => subs.delete(f); }
    }; }
  };
  const downloads = { async save({ filename, data }){
    const file = new File([data], filename, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: filename }); return { status: 'saved' }; }
      catch (e) { if (e && e.name === 'AbortError') throw { code: 'declined' }; }
    }
    const url = URL.createObjectURL(file), a = document.createElement('a');
    a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    return { status: 'saved' };
  } };
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
  window.claude = { use: async n => ({ db, downloads })[n] || null };
})();
</script>

<title>Carnet de séances</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Sol de salle : fond caoutchouc, texte craie, couleurs de disques olympiques comme code des séances.
   Colonne unique pensée pour le pouce (max 560 px), barre d'onglets en bas, mode séance plein écran. */
:root{
  --floor:#111315; --rubber:#1a1d20; --steel:#262b30; --line:#323940;
  --chalk:#f1eee6; --dim:#9ba2a9; --ink:#111315;
  --pA:#e0393f; --pB:#2f74de; --pC:#e9b51f; --pD:#32a35a;
  --plate20:#2f74de; --plate10:#32a35a; --plate5:#f1eee6; --plate25:#e0393f; --plate125:#b9c0c6; --bar:#b9c0c6;
  --deload:#8b7be0; --warn:#f4b860; --warn-bg:#3a2a10; --ok:#4cc27a; --bad:#ff6b6b; --claude:#d97757;
  --display:"Big Shoulders Display","Arial Narrow","Roboto Condensed",sans-serif;
  --body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --floor:#e9e6df; --rubber:#f8f6f1; --steel:#dcd8cf; --line:#cbc6bb;
  --chalk:#16191c; --dim:#5d636a; --ink:#f8f6f1;
  --pA:#c8262c; --pB:#1f5fbf; --pC:#a87a00; --pD:#22803f;
  --plate20:#1f5fbf; --plate10:#22803f; --plate5:#fdfcf9; --plate25:#c8262c; --plate125:#8e959b; --bar:#8e959b;
  --deload:#5b46b8; --warn:#8a4b00; --warn-bg:#fbe9cc; --ok:#1d7a42; --bad:#b3261e; --claude:#b85a3a; color-scheme:light}}
:root[data-theme="light"]{
  --floor:#e9e6df; --rubber:#f8f6f1; --steel:#dcd8cf; --line:#cbc6bb;
  --chalk:#16191c; --dim:#5d636a; --ink:#f8f6f1;
  --pA:#c8262c; --pB:#1f5fbf; --pC:#a87a00; --pD:#22803f;
  --plate20:#1f5fbf; --plate10:#22803f; --plate5:#fdfcf9; --plate25:#c8262c; --plate125:#8e959b; --bar:#8e959b;
  --deload:#5b46b8; --warn:#8a4b00; --warn-bg:#fbe9cc; --ok:#1d7a42; --bad:#b3261e; --claude:#b85a3a; color-scheme:light}
*{box-sizing:border-box}
html,body{background:var(--floor)}
body{color:var(--chalk);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body.locked{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
input,select,textarea{font:inherit;color:var(--chalk);background:var(--floor);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
:focus-visible{outline:3px solid var(--chalk);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:900;text-transform:uppercase;margin:0;line-height:.95;text-wrap:balance;letter-spacing:.01em}
h2{font-size:1.9rem}
h3{font-size:1.35rem}
p{margin:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.15em;font-size:.82rem;color:var(--dim)}
.dim{color:var(--dim)}
.small{font-size:.85rem}
.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:14px calc(96px + env(safe-area-inset-bottom,0px));display:grid;gap:16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-family:var(--display);font-weight:900;font-size:1.25rem;text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:8px}
.brand svg{width:26px;height:26px;flex:none}
/* accueil : la date en très grand, comme un panneau de salle */
.hero{display:grid;gap:12px;padding-top:4px}
.hdate{display:flex;align-items:flex-end;gap:12px;line-height:.8}
.hnum{font-family:var(--display);font-weight:900;font-size:6.2rem;letter-spacing:-.03em;line-height:.78}
.hside{display:grid;gap:6px;padding-bottom:6px}
.hday{font-family:var(--display);font-weight:900;font-size:1.9rem;text-transform:uppercase;line-height:.9}
.hmon{font-family:var(--display);font-weight:800;font-size:1.1rem;text-transform:uppercase;letter-spacing:.14em;color:var(--dim)}
/* disque de séance : la lettre sur un disque à la couleur de la séance */
.disc{--s:58px;width:var(--s);height:var(--s);flex:none;border-radius:50%;background:var(--c);color:var(--ink);display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:calc(var(--s)*.5);line-height:1;box-shadow:inset 0 0 0 calc(var(--s)*.07) color-mix(in srgb,var(--c) 70%,#000),inset 0 0 0 calc(var(--s)*.13) var(--c),inset 0 0 0 calc(var(--s)*.15) color-mix(in srgb,var(--c) 75%,#000)}
.disc.sm{--s:34px}
.chead{display:flex;gap:14px;align-items:center}
.chead h2{font-size:1.75rem}
.sync{font-size:.78rem;color:var(--dim);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--dim)}
.sync.ok i{background:var(--ok)} .sync.wait i{background:var(--warn)} .sync.off i{background:var(--bad)}
.view{display:grid;gap:16px}
.card{background:var(--rubber);border-radius:16px;padding:16px;display:grid;gap:12px;min-width:0}
.card.plate{border-top:8px solid var(--c,var(--line))}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.stack{display:grid;gap:8px}
/* cycle */
.cycle{display:grid;grid-template-columns:repeat(var(--n,7),1fr);gap:4px}
.cycle i{height:10px;background:var(--steel);border-radius:2px}
.cycle i.on{background:var(--chalk)}
.cycle i.dl{background:repeating-linear-gradient(135deg,var(--deload) 0 3px,transparent 3px 6px)}
.cycle i.dl.on{background:var(--deload)}
/* boutons */
.btn{border:0;border-radius:14px;padding:14px 18px;font-family:var(--display);font-weight:900;font-size:1.3rem;text-transform:uppercase;letter-spacing:.04em;background:var(--steel);color:var(--chalk);min-height:56px}
.btn.main{background:var(--chalk);color:var(--ink);width:100%;font-size:1.65rem;min-height:68px}
.btn.wide{width:100%}
.btn.ghost{background:transparent;border:2px solid var(--line)}
.btn.danger{background:transparent;border:2px solid var(--bad);color:var(--bad)}
.btn.sm{font-size:1rem;min-height:44px;padding:8px 14px;border-radius:10px}
.btn.claude{background:var(--claude);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:transparent;border-radius:10px;min-height:48px;padding:6px 14px;font-family:var(--display);font-weight:800;font-size:1.1rem;text-transform:uppercase;letter-spacing:.04em}
.chip.on{background:var(--c,var(--chalk));border-color:var(--c,var(--chalk));color:var(--ink)}
.chip.sq{min-width:52px;justify-content:center}
.tplpick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tplpick button{border:0;border-radius:14px;min-height:96px;background:var(--steel);text-align:left;padding:12px;display:grid;gap:6px;align-content:start}
.tplpick b{font-family:var(--display);font-weight:900;font-size:1.5rem;text-transform:uppercase;line-height:.95}
.tplpick span{font-size:.8rem;color:var(--dim)}
.alert{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:12px 14px;font-size:.92rem;font-weight:500;display:grid;gap:8px}
.alert button{justify-self:start;border:2px solid currentColor;background:transparent;border-radius:10px;padding:6px 12px;font-weight:600;min-height:40px}
.banner{background:var(--c,var(--chalk));color:var(--ink);border-radius:14px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;border:0;width:100%;text-align:left}
.banner b{font-family:var(--display);font-weight:900;font-size:1.35rem;text-transform:uppercase}
.exl{display:grid;gap:8px}
.exl .r{display:flex;justify-content:space-between;gap:10px;font-size:.95rem}
.exl .r b{font-weight:600;flex:0 1 45%}
.exl .num{font-family:var(--body);font-variant-numeric:tabular-nums}
.exl .r span{color:var(--dim);text-align:right}
.up{color:var(--ok);font-weight:600}
.dlw{color:var(--deload);font-weight:600}
.pr{color:var(--ok);font-weight:700}
/* semaine */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;text-align:center}
.week .d{font-family:var(--display);font-weight:800;font-size:.8rem;color:var(--dim)}
.week button{border:0;height:46px;border-radius:9px;background:var(--steel);font-family:var(--display);font-weight:900;font-size:1.2rem;color:var(--ink);position:relative;padding:0}
.week button.p{background:transparent;border:2px dashed var(--c);color:var(--c)}
.week button.f{background:var(--c)}
.week button.today{box-shadow:0 0 0 2px var(--chalk)}
.week button .w{position:absolute;top:3px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--warn)}
/* calendrier */
.calhead{display:flex;justify-content:space-between;align-items:center}
.calhead button{width:48px;height:48px;border:0;border-radius:10px;background:var(--steel);font-size:1.4rem}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dowh{font-family:var(--display);font-weight:800;font-size:.78rem;color:var(--dim);text-align:center;text-transform:uppercase}
.day{min-height:58px;border-radius:8px;border:2px solid transparent;background:var(--steel);padding:4px;display:flex;flex-direction:column;gap:3px;align-items:flex-start;min-width:0;position:relative}
.day.out{opacity:.35}
.day.dl{background:color-mix(in srgb,var(--deload) 22%,var(--steel))}
.day.sel{border-color:var(--chalk)}
.day .n{font-family:var(--mono);font-size:.75rem}
.day.today .n{background:var(--chalk);color:var(--ink);border-radius:4px;padding:0 4px}
.day .c{font-family:var(--display);font-weight:900;font-size:1.1rem;border-radius:5px;padding:0 5px;color:var(--ink);background:var(--c);max-width:100%;overflow:hidden;white-space:nowrap}
.day .c.p{background:transparent;color:var(--c);box-shadow:inset 0 0 0 2px var(--c)}
.day .w{position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--dim)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend b{width:12px;height:12px;border-radius:3px;display:inline-block}
.confirm{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:12px;display:grid;gap:10px;font-weight:500}
/* progrès */
.lifts{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:10px}
.lift{background:var(--steel);border-radius:12px;padding:12px;display:grid;gap:4px;align-content:start;min-width:0;border-top:5px solid var(--c)}
.lift .v{font-family:var(--display);font-weight:900;font-size:2rem;line-height:.95}
.lift svg,.wchart svg{width:100%;display:block}
.zones{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.zone{background:var(--steel);border-radius:10px;padding:10px;display:grid;gap:2px}
.zone b{font-family:var(--display);font-weight:900;font-size:1.5rem}
table.runs{width:100%;border-collapse:collapse;font-size:.88rem}
table.runs td,table.runs th{padding:6px 4px;border-top:1px solid var(--line);text-align:left}
table.runs th{color:var(--dim);font-weight:500;font-size:.78rem}
.form{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.field{display:grid;gap:4px;min-width:0}
.field label{font-size:.8rem;color:var(--dim)}
.field input{width:120px}
.field select{max-width:100%}
.goal{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:6px}
.meter{height:10px;border-radius:5px;background:var(--steel);overflow:hidden}
.meter i{display:block;height:100%;background:var(--chalk)}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.pill.ok{background:color-mix(in srgb,var(--ok) 20%,transparent);color:var(--ok)}
.pill.amb{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.pill.done{background:var(--chalk);color:var(--ink)}
.stats{display:flex;flex-wrap:wrap;gap:10px 26px}
.stat .v{font-family:var(--display);font-weight:900;font-size:1.9rem;line-height:1}
/* programme */
.exrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;border-top:1px solid var(--line);padding-top:10px}
.exrow .t{display:grid;gap:2px;min-width:0}
.exrow .t b{font-weight:600}
.exrow .t span{font-size:.82rem;color:var(--dim)}
.tools{display:flex;gap:4px}
.tools button{width:44px;height:44px;border:0;border-radius:10px;background:var(--steel);font-size:1.05rem}
.sheet{display:grid;gap:12px;background:var(--steel);border-radius:14px;padding:14px}
.sheet .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet .field input,.sheet .field select{width:100%}
.check{display:flex;gap:10px;align-items:center;min-height:44px}
.check input{width:22px;height:22px}
.schemerow{display:grid;grid-template-columns:minmax(0,1fr) 80px 44px;gap:8px;align-items:center}
.schemerow input{width:100%}
/* Claude */
.q{justify-self:end;background:var(--steel);border-radius:14px 14px 4px 14px;padding:10px 14px;max-width:90%}
.a{display:grid;gap:10px;line-height:1.55}
.a ul{margin:0;padding-left:20px;display:grid;gap:4px}
.change{border:2px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px}
.change .before{color:var(--dim);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--bad) 70%,transparent)}
.change .after{font-weight:600}
.change.done{border-color:var(--ok)}
.change.skip{opacity:.5}
textarea{width:100%;min-height:90px;resize:vertical}
.suggest{display:flex;flex-wrap:wrap;gap:8px}
.suggest button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:8px 12px;font-size:.85rem;min-height:40px;text-align:left}
/* barre d'onglets */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--rubber);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:20}

.nav button.on{color:var(--chalk);background:var(--steel)}

.drain{height:14px;border-radius:7px;background:color-mix(in srgb,var(--ink) 22%,transparent);overflow:hidden}
.drain i{display:block;height:100%;background:var(--ink)}
.rbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.toast{background:var(--ink);color:var(--chalk);border-radius:12px;padding:10px 14px;font-weight:600}

<section class="sess" id="sess" hidden aria-live="polite"></section>

<script>
/* Carnet de séances — logique pure (aucun accès au DOM ni à la base).
   Testée par test/logic.test.js, injectée telle quelle dans la page au build. */
const L = (() => {
  const BW = '__poids__';
  const DAY = 864e5;

  /* ---------- Dates ---------- */
  const pad = n => String(n).padStart(2, '0');
  const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
  const dayDiff = (a, b) => Math.round((parse(b) - parse(a)) / DAY);
  const weeksBetween = (a, b) => dayDiff(a, b) / 7;
  const dow = s => (parse(s).getDay() + 6) % 7;            // 0 = lundi
  const weekStart = s => addDays(s, -dow(s));
  const fr = s => { const d = parse(s); return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}`; };
  const frY = s => `${fr(s)}/${parse(s).getFullYear()}`;

  /* ---------- Nombres ---------- */
  const isNum = v => v !== '' && v != null && typeof v !== 'boolean' && !isNaN(v);
  const r1 = x => Math.round(x * 10) / 10;
  const roundTo = (x, step) => Math.round(Math.round(x / step) * step * 100) / 100;
  const e1rm = (kg, reps) => reps > 1 ? kg * (1 + reps / 30) : kg;   // Epley, comme la v4
  const frNum = x => String(Math.round(x * 100) / 100).replace('.', ',');
  const topOf = r => { const m = String(r ?? '').match(/(\d+)\s*-\s*(\d+)/); return m ? +m[2] : (/^\s*\d+\s*$/.test(String(r ?? '')) ? +r : null); };

  /* Durées : "20:28" → 1228 s, "1:02:05" → 3725 s, "56" → 56 min */
  function parseDur(v) {
    if (v == null || v === '') return null;
    if (typeof v === 'number') return v * 60;
    const p = String(v).trim().split(':').map(Number);
    if (p.some(isNaN)) return null;
    if (p.length === 1) return p[0] * 60;
    if (p.length === 2) return p[0] * 60 + p[1];
    return p[0] * 3600 + p[1] * 60 + p[2];
  }
  function fmtDur(sec) {
    sec = Math.max(0, Math.round(sec));
    const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
    return h ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
  }
  const fmtPace = secPerKm => isFinite(secPerKm) && secPerKm > 0 ? fmtDur(secPerKm) : '—';

  /* ---------- Cycle ---------- */
  function cycleInfo(dateIso, cycle) {
    const n = +cycle?.weeks || 7;
    const w = Math.floor(dayDiff(cycle.start, dateIso) / 7);
    if (w < 0) return null;
    const pos = (w % n) + 1;
    return { pos, n, deload: pos === n, cycleNo: Math.floor(w / n) + 1 };
  }
  function deloadStart(dateIso, cycle) {
    const c = cycleInfo(dateIso, cycle); if (!c) return null;
    return addDays(cycle.start, ((c.cycleNo - 1) * c.n + c.n - 1) * 7);
  }

  /* ---------- Séances types ---------- */
  const tplList = templates => Object.entries(templates || {}).sort((a, b) => (a[1].order ?? 9) - (b[1].order ?? 9));
  const unitOf = ex => ex.unit || 'kg';
  function exDef(templates, name) {
    for (const [id, t] of tplList(templates)) for (const ex of t.exercises || []) if (ex.name === name) return { id, ex };
    return null;
  }
  /* barre = schéma lourde + séries ; pdc = poids du corps lesté ; km ; simple = le reste */
  const kind = ex => ex.scheme ? 'barre' : ex.loadAt ? 'pdc' : unitOf(ex) === 'km' ? 'km' : 'simple';
  /* Deuxième grandeur saisie à chaque série : répétitions, mètres, ou rien */
  function repsUnit(ex) {
    const u = unitOf(ex);
    if (u !== 'kg') return null;
    if (/\d\s*m\b/.test(String(ex.reps || ''))) return 'm';
    return 'reps';
  }
  function valStep(ex) {
    const u = unitOf(ex);
    if (u === 'kg') return kind(ex) === 'pdc' ? 2.5 : (+ex.step || 2.5);
    return { s: 5, cm: 5, km: 0.1, min: 1 }[u] || 1;
  }
  function defaultRest(ex) {
    if (isNum(ex.rest)) return +ex.rest;
    const k = kind(ex), u = unitOf(ex);
    if (k === 'barre') return 180;
    if (k === 'pdc') return 150;
    if (u === 'cm') return 120;
    if (u === 's') return 60;
    return 90;
  }
  const nSets = ex => Math.max(1, ex.scheme ? ex.scheme.length : (parseInt(ex.sets, 10) || 1));

  /* ---------- Historique ---------- */
  function history(logs, exName) {
    return Object.keys(logs || {}).sort()
      .map(k => ({ date: k, e: logs[k].entries?.[exName], log: logs[k] }))
      .filter(x => x.e && !x.e.skipped && isNum(x.e.val));
  }
  function lastBefore(logs, exName, dateIso, cycle, skipDeload) {
    const h = history(logs, exName).filter(x => x.date < dateIso && (!skipDeload || !cycleInfo(x.date, cycle)?.deload));
    return h[h.length - 1] || null;
  }
  function missing(log, tpl, todayIso, dateIso) {
    if (!tpl || !log) return false;
    if (log.status !== 'faite' && dateIso >= todayIso) return false;
    return (tpl.exercises || []).some(ex => { const e = log.entries?.[ex.name]; return !(e?.skipped) && !isNum(e?.val); });
  }

  /* Mesure suivie pour une séance (identique à la v4) */
  function metric(ex, e) {
    if (!e) return null;
    const k = kind(ex);
    if (k === 'barre') {
      const sets = (e.sets || []).filter(s => isNum(s.val) && isNum(s.reps));
      if (!sets.length) return isNum(e.val) ? +e.val : null;
      return Math.max(...sets.map(s => e1rm(+s.val, +s.reps)));
    }
    if (k === 'pdc') {
      const sets = (e.sets || []).filter(s => isNum(s.reps));
      return sets.length ? Math.max(...sets.map(s => +s.reps)) : (isNum(e.reps) ? +e.reps : null);
    }
    return isNum(e.val) ? +e.val : null;
  }
  function describe(ex, e) {
    if (!e) return '';
    if (e.skipped) return 'passé';
    const u = unitOf(ex), ru = repsUnit(ex);
    const fv = v => frNum(+v);
    if (e.sets?.length) {
      return e.sets.filter(s => s && (isNum(s.val) || isNum(s.reps))).map(s => {
        const v = isNum(s.val) ? fv(s.val) : '0';
        if (kind(ex) === 'pdc') return `${+s.val > 0 ? '+' + v + ' kg' : 'sans lest'} × ${isNum(s.reps) ? s.reps : '?'}`;
        if (!ru) return `${v} ${u}`;
        return `${v}${u === 'kg' ? ' kg' : ''} × ${isNum(s.reps) ? s.reps : '?'}${ru === 'm' ? ' m' : ''}`;
      }).join(' · ');
    }
    if (!isNum(e.val)) return '';
    return `${fv(e.val)} ${u}${isNum(e.reps) ? ` × ${e.reps}` : ''}`;
  }
  /* Résumé enregistré : val/reps = meilleure série (format v4), + sets et targets */
  function finalize(ex, e) {
    if (!e) return e;
    if (e.skipped) return { skipped: true };
    if (!e.sets) return e;
    const out = {};
    if (e.targets) out.targets = e.targets.slice();
    const sets = e.sets.map(s => s || {}).map(s => ({ val: isNum(s.val) ? +s.val : '', reps: isNum(s.reps) ? +s.reps : '' }));
    out.sets = sets;
    const done = sets.filter(s => isNum(s.reps) || isNum(s.val));
    if (!done.length) return out;
    if (ex.loadAt) {
      const b = done.reduce((a, s) => (+s.reps || 0) > (+a.reps || 0) ? s : a, done[0]);
      return { ...out, val: isNum(b.val) ? +b.val : 0, reps: isNum(b.reps) ? +b.reps : '' };
    }
    const withVal = done.filter(s => isNum(s.val));
    if (!withVal.length) return out;
    const b = withVal.reduce((a, s) => +s.val > +a.val ? s : a, withVal[0]);
    return { ...out, val: +b.val, reps: isNum(b.reps) ? +b.reps : '' };
  }

  /* ---------- Progression : charges proposées pour la prochaine séance ---------- */
  function suggest(ex, last, opt = {}) {
    const k = kind(ex), deload = !!opt.deload, e = last || null;
    const step = valStep(ex);
    if (k === 'barre') {
      const base = ex.scheme.map(s => +s.reps);
      const lastT = e?.targets?.length === base.length ? e.targets.map(Number) : base;
      const heavyLast = isNum(e?.sets?.[0]?.val) ? +e.sets[0].val : (isNum(e?.val) ? +e.val : null);
      if (heavyLast == null) {
        return { sets: ex.scheme.map((s, i) => ({ label: s.label, val: '', reps: base[i], target: base[i] })), targets: base, note: 'Première fois : choisis une charge qui te laisse encore 1 à 2 répétitions possibles en fin de série.', kindNote: 'first' };
      }
      const met = !!e && ex.scheme.every((s, i) => isNum(e.sets?.[i]?.reps) && +e.sets[i].reps >= lastT[i]);
      let heavy = heavyLast, T = lastT, note = '', kn = 'same';
      if (deload) {
        heavy = roundTo(heavyLast * 0.9, 2.5); T = base;
        const back = roundTo(heavy * 0.9, 2.5);
        return { sets: [{ label: ex.scheme[0].label, val: heavy, reps: T[0], target: T[0] }, { label: ex.scheme[1]?.label || 'Série 2', val: back, reps: T[1] ?? T[0], target: T[1] ?? T[0] }], targets: [T[0], T[1] ?? T[0]], note: 'Semaine d’allègement : charge réduite de 10 %, 2 séries seulement. Arrête-toi quand il te reste 3 à 4 répétitions possibles.', kindNote: 'deload' };
      }
      const plus = lastT.some((t, i) => t > base[i]);
      if (met) {
        if (ex.double && !plus) { T = base.map(r => r + 1); note = 'Dernière fois, tu as fait toutes les répétitions : garde la même charge et fais 1 répétition de plus par série.'; kn = 'reps'; }
        else { heavy = heavyLast + step; T = base; note = `Dernière fois, tu as fait toutes les répétitions : ajoute ${frNum(step)} kg.`; kn = 'up'; }
      } else note = 'Garde la même charge jusqu’à réussir toutes les répétitions prévues.';
      const back = roundTo(heavy * 0.9, 2.5);
      return { sets: ex.scheme.map((s, i) => ({ label: s.label, val: i === 0 ? heavy : back, reps: T[i], target: T[i] })), targets: T, note, kindNote: kn };
    }
    let n = nSets(ex);
    if (deload) n = Math.ceil(n / 2);
    const ls = (e?.sets || []).filter(s => s && (isNum(s.val) || isNum(s.reps)));
    if (k === 'pdc') {
      const lest = ls.length ? Math.max(...ls.map(s => isNum(s.val) ? +s.val : 0)) : (isNum(e?.val) ? +e.val : 0);
      const met = ls.length >= nSets(ex) && ls.every(s => isNum(s.reps) && +s.reps >= ex.loadAt);
      const add = met && !deload ? 2.5 : 0;
      const sets = Array.from({ length: n }, (_, j) => ({ label: `Série ${j + 1}`, val: lest + add, reps: add ? '' : (ls[j]?.reps ?? ls[ls.length - 1]?.reps ?? '') }));
      const note = deload ? 'Semaine d’allègement : moitié moins de séries. Arrête-toi quand il te reste 3 à 4 répétitions possibles.'
        : met ? `Tu as fait ${ex.loadAt} répétitions à toutes les séries : ajoute 2,5 kg de lest.` : (e ? `Ajoute du lest quand tu fais ${ex.loadAt} répétitions à toutes les séries.` : 'Indique le lest : 0 si tu travailles sans lest.');
      return { sets, note, kindNote: deload ? 'deload' : met ? 'up' : 'same' };
    }
    const lastVal = ls.length ? Math.max(...ls.filter(s => isNum(s.val)).map(s => +s.val), -Infinity) : (isNum(e?.val) ? +e.val : null);
    const hasVal = lastVal != null && isFinite(lastVal);
    const top = topOf(ex.reps);
    const ru = repsUnit(ex);
    const met = unitOf(ex) === 'kg' && ru === 'reps' && top && ls.length >= nSets(ex) && ls.every(s => isNum(s.reps) && +s.reps >= top);
    let val = hasVal ? lastVal : '';
    let note = '';
    if (hasVal && deload && unitOf(ex) === 'kg') { val = roundTo(lastVal * 0.9, step); note = 'Semaine d’allègement : charge réduite de 10 %, moitié moins de séries.'; }
    else if (deload) note = 'Semaine d’allègement : moitié moins de séries.';
    else if (met) { val = lastVal + step; note = `Tu as atteint le haut de ton objectif de répétitions : ajoute ${frNum(step)} kg.`; }
    const sets = Array.from({ length: n }, (_, j) => ({ label: `Série ${j + 1}`, val, reps: ru ? (met ? '' : (ls[j]?.reps ?? ls[ls.length - 1]?.reps ?? '')) : '' }));
    return { sets, note, kindNote: deload ? 'deload' : met ? 'up' : 'same' };
  }

  /* ---------- Disques et échauffement ---------- */
  function platesPerSide(total, bar = 20, avail = [20, 10, 5, 2.5, 1.25]) {
    if (!isNum(total)) return { side: [], ok: false };
    let rem = Math.round((+total - bar) / 2 * 1000) / 1000;
    if (rem < 0) return { side: [], ok: false, under: true };
    const side = [];
    for (const p of [...avail].sort((a, b) => b - a)) while (rem >= p - 1e-9) { side.push(p); rem = Math.round((rem - p) * 1000) / 1000; }

  }
  function warmup(work, opt = {}) {
    const bar = opt.bar ?? 20;
    if (!isNum(work) || +work < bar + 15) return [];
    const out = opt.fromFloor ? [] : [{ val: bar, reps: 10 }];
    for (const [p, reps] of [[0.4, 5], [0.6, 3], [0.75, 2], [0.88, 1]]) {
      const v = Math.max(bar, roundTo(work * p, 2.5));
      if (v >= work) continue;
      if (out.length && v <= out[out.length - 1].val) continue;
      out.push({ val: v, reps });

  }

  /* ---------- Records ---------- */
  function scoreSet(ex, s, bw) {
    if (!s) return null;
    const k = kind(ex), u = unitOf(ex);
    if (k === 'barre' || (u === 'kg' && repsUnit(ex) === 'reps' && k !== 'pdc')) return isNum(s.val) && isNum(s.reps) && +s.reps > 0 ? e1rm(+s.val, +s.reps) : null;
    if (k === 'pdc') return isNum(s.reps) && +s.reps > 0 ? e1rm(bw + (isNum(s.val) ? +s.val : 0), +s.reps) : null;

  }
  const entrySets = e => (e?.sets?.length ? e.sets : (e && isNum(e.val) ? [{ val: e.val, reps: e.reps }] : [])).filter(Boolean);
  function bestOf(ex, hist, bw) {
    let best = null;

  }
  function prLabel(ex, s, score) {
    const k = kind(ex), u = unitOf(ex);

    if (k === 'pdc') return `${+s.val > 0 ? '+' + frNum(+s.val) + ' kg' : 'sans lest'} × ${s.reps}`;

  }
  /* Records battus par `entry` par rapport à l'historique précédent (rien la première fois) */
  function newPRs(ex, entry, prevHist, bw = 75) {
    if (!entry || entry.skipped || !prevHist.length) return [];
    const prev = bestOf(ex, prevHist, bw), cur = bestOf(ex, [{ e: entry, date: '' }], bw);

  }

  /* ---------- Course ---------- */
  function runOf(log, tpl) {
    if (!log || !tpl) return null;
    const exKm = (tpl.exercises || []).find(x => unitOf(x) === 'km');
    const exMin = (tpl.exercises || []).find(x => unitOf(x) === 'min');
    const km = exKm && isNum(log.entries?.[exKm.name]?.val) ? +log.entries[exKm.name].val : null;
    const sec = isNum(log.run?.sec) ? +log.run.sec : (exMin && isNum(log.entries?.[exMin.name]?.val) ? +log.entries[exMin.name].val * 60 : null);

  }
  function bestRunRef(logs, templates, base, todayIso) {
    let best = base ? { ...base, p: riegel(base.km, base.sec, 5) } : null;
    for (const [k, log] of Object.entries(logs || {})) {
      if (log.status !== 'faite' || log.templateId !== 'D' || weeksBetween(k, todayIso) > 12) continue;
      const r = runOf(log, templates?.D);
      if (!r?.km || !r.sec || r.km < 3) continue;
      const p = riegel(r.km, r.sec, 5);

  }
  function runPRs(run, prevRuns) {
    const out = [];

    const longest = Math.max(...prevRuns.map(r => r.km || 0));
    if (run.km > longest + 1e-6) out.push(`Plus longue course : ${frNum(run.km)} km`);
    const paced = prevRuns.filter(r => r.km >= 3 && r.pace);
    if (run.km >= 3 && run.pace && paced.length && run.pace < Math.min(...paced.map(r => r.pace)) - 0.5) out.push(`Meilleure allure : ${fmtPace(run.pace)} /km`);
    return out;
  }

  /* ---------- Enchaînements ---------- */
  function sequenceAlerts(logs, from, to) {
    const out = [], L0 = logs || {};

    for (let d = from; d <= to; d = addDays(d, 1)) {
      const a = L0[d], b = L0[addDays(d, 1)];
      if (!a || !b) continue;
      if (isHard(a) && b.templateId === 'C') out.push({ date: d, next: addDays(d, 1), code: 'hard-before-C', text: `Course soutenue le ${fr(d)}, la veille de la séance C : tes jambes seront fatiguées pour le squat et les sauts.` });
      const pair = [a.templateId, b.templateId].sort().join('');
      if (pair === 'AC') out.push({ date: d, next: addDays(d, 1), code: 'A-C', text: `A et C deux jours de suite (${fr(d)} et ${fr(addDays(d, 1))}) : le bas du dos n’a pas le temps de récupérer entre soulevé de terre et squat.` });
    }
    const weeks = {};
    for (const [d, l] of Object.entries(L0)) if (d >= weekStart(from) && d <= to && isHard(l)) (weeks[weekStart(d)] = weeks[weekStart(d)] || []).push(d);
    for (const [w, ds] of Object.entries(weeks)) if (ds.length > 1) out.push({ date: ds.sort()[1], code: 'two-hard', text: `Deux courses soutenues la semaine du ${fr(w)} : garde-en une seule.` });

  }

  /* Séance suivante dans la rotation A, B, course facile, C, course soutenue,
     en évitant les enchaînements interdits avec ce qui est déjà au calendrier */
  const NEXT = { A: ['B'], B: ['D', 'facile'], 'D:facile': ['C'], C: ['D', 'soutenue'], 'D:soutenue': ['A'] };
  function suggestNext(logs, dateIso) {
    const prev = Object.keys(logs || {}).filter(k => k < dateIso && logs[k].status === 'faite').sort().pop();
    const l = prev && logs[prev];
    const key = !l ? null : l.templateId === 'D' ? `D:${l.run?.type === 'soutenue' ? 'soutenue' : 'facile'}` : l.templateId;
    const first = NEXT[key] || ['A'];
    const order = [first, ['A'], ['B'], ['D', 'facile'], ['C']].filter((c, i, a) => a.findIndex(x => x.join() === c.join()) === i);
    for (const [id, type] of order) {
      const trial = { ...logs, [dateIso]: { templateId: id, ...(type ? { run: { type } } : {}) } };
      const bad = sequenceAlerts(trial, addDays(dateIso, -1), dateIso).some(a => a.date === dateIso || a.next === dateIso);
      if (!bad) return { id, type: type || null, rotation: id === first[0] && (type || null) === (first[1] || null) };

  }

  /* ---------- Objectifs (repris de la v4) ---------- */
  function goalMetric(ex, g) { if (!ex) return +g.target; return kind(ex) === 'barre' ? e1rm(+g.target, +g.reps || 1) : +g.target; }
  function currentFor(g, ctx) {
    if (g.exercise === BW) { const ks = Object.keys(ctx.weights || {}).sort(); return ks.length ? +ctx.weights[ks[ks.length - 1]].kg : null; }
    const def = exDef(ctx.templates, g.exercise); if (!def) return null;
    const h = history(ctx.logs, g.exercise).map(x => ({ m: metric(def.ex, x.e), d: x.date })).filter(x => x.m != null);
    if (!h.length) return null;
    if (kind(def.ex) === 'km') { const recent = h.filter(x => weeksBetween(x.d, ctx.today) <= 4); return Math.max(...(recent.length ? recent : h).map(x => x.m)); }
    return h[h.length - 1].m;
  }
  function plan(g, ctx) {
    const cw = +ctx.cycle?.weeks || 7;
    const def = g.exercise === BW ? null : exDef(ctx.templates, g.exercise), ex = def?.ex;
    const k = g.exercise === BW ? 'poids' : ex ? kind(ex) : 'simple';
    const target = goalMetric(ex, g), cur = currentFor(g, ctx);
    const unit = k === 'barre' ? 'kg' : k === 'pdc' ? 'répétitions' : k === 'poids' ? 'kg' : unitOf(ex || {});
    const weeks = Math.max(weeksBetween(ctx.today, g.date), 0);
    const eff = Math.max(weeks * (cw - 1) / cw, 0.5);
    if (cur == null) return { cur, target, unit, pct: 0, state: 'nodata', text: k === 'poids' ? 'Enregistre ton poids pour calculer le plan.' : 'Note une première séance de cet exercice pour calculer le plan.' };
    const diff = target - cur, base = g.base ?? cur;
    const pct = target === base ? (diff <= 0 ? 100 : 0) : Math.max(0, Math.min(100, (cur - base) / (target - base) * 100));
    const reached = k === 'poids' ? Math.abs(diff) < 0.3 : diff <= 0;
    if (reached) return { cur, target, unit, pct: 100, state: 'done', text: 'Objectif atteint. Fixe-toi la cible suivante.' };
    if (weeks <= 0) return { cur, target, unit, pct, state: 'bad', text: 'La date est passée. Mets une nouvelle date pour garder un plan.' };
    const rate = k === 'barre' ? Math.max(cur * 0.01, 0.5) : k === 'pdc' ? 0.5 : k === 'km' ? Math.max(cur * 0.1, 0.5) : k === 'poids' ? (diff > 0 ? 0.25 : 0.5) : Math.max(Math.abs(cur) * 0.02, 0.5);
    const need = Math.abs(diff) / eff, ratio = need / rate;
    const state = ratio <= 1 ? 'ok' : ratio <= 2 ? 'amb' : 'bad';
    const realWeeks = Math.ceil(Math.abs(diff) / rate * cw / (cw - 1));
    const realDate = addDays(ctx.today, realWeeks * 7);
    let text = '';
    if (k === 'barre') {
      const perWeekWorking = need / (1 + 4 / 30);
      const step = +ex.step || 2.5, stepTxt = frNum(step);
      const every = Math.max(1, Math.round(step / perWeekWorking));
      text = every >= 4 ? `Tu as de la marge : +${stepTxt} kg sur ta série lourde toutes les 3 à 4 semaines suffit. Arrête chaque série quand il te reste 1 à 2 répétitions possibles.`
        : `Ajoute ${stepTxt} kg sur ta série lourde ${every === 1 ? 'chaque semaine' : `toutes les ${every} semaines`}, dès que tu valides toutes les répétitions. Arrête chaque série quand il te reste 1 à 2 répétitions possibles, et respecte la semaine d'allègement.`;
    } else if (k === 'pdc') {
      const every = Math.max(1, Math.round(1 / need));
      text = `Gagne 1 répétition sur ta meilleure série ${every === 1 ? 'chaque semaine' : `toutes les ${every} semaines`}. Si tu ne progresses pas deux séances de suite, ajoute une série en fin de séance.`;
    } else if (k === 'km') {
      text = `Allonge ta sortie longue d'environ ${frNum(need)} km par semaine, à allure facile, et fais une semaine plus courte toutes les 4 semaines. Au-delà de +10 % par semaine, le risque de blessure monte.`;
    } else if (k === 'poids') {
      text = diff > 0 ? `Vise environ +${frNum(need)} kg par semaine : un léger surplus alimentaire, 1,6 à 2 g de protéines par kg et ta progression en charge. Pèse-toi le matin à jeun et suis la moyenne sur 7 jours.`

    if (state === 'bad') text += ` À ce rythme, c'est trop rapide : une date réaliste serait le ${frY(realDate)}.`;
    return { cur, target, unit, pct, state, text, need };
  }

  /* ---------- Poids corporel ---------- */
  function weightStats(weights) {
    const ks = Object.keys(weights || {}).sort();
    if (!ks.length) return null;
    const vals = ks.map(k => +weights[k].kg), last = vals[vals.length - 1], lastDate = ks[ks.length - 1];
    const win = ks.filter(k => weeksBetween(k, lastDate) < 1).map(k => +weights[k].kg);

    const old = ks.filter(k => weeksBetween(k, lastDate) >= 4);

  /* ---------- Demander à Claude ---------- */
  const EX_FIELDS = ['name', 'sets', 'reps', 'unit', 'main', 'step', 'scheme', 'loadAt', 'tip', 'rest', 'double'];
  const UNITS = ['kg', 'km', 'min', 's', 'cm'];
  function cleanExercise(x) {
    if (!x || typeof x !== 'object' || typeof x.name !== 'string' || !x.name.trim()) return null;
    const ex = { name: x.name.trim().slice(0, 80) };
    ex.sets = String(x.sets ?? (Array.isArray(x.scheme) ? x.scheme.length : 2)).slice(0, 10);
    ex.reps = String(x.reps ?? '').slice(0, 60);
    ex.unit = UNITS.includes(x.unit) ? x.unit : 'kg';
    if (x.main) ex.main = true;
    if (isNum(x.step) && +x.step > 0 && +x.step <= 20) ex.step = +x.step;
    if (Array.isArray(x.scheme) && x.scheme.length) {
      const sc = x.scheme.slice(0, 8).map((s, i) => ({ label: String(s?.label || (i ? `Série ${i + 1}` : 'Lourde')).slice(0, 30), reps: parseInt(s?.reps, 10) })).filter(s => s.reps > 0 && s.reps < 50);

    if (x.double) ex.double = true;
    return ex;
  }
  /* Ne garde que les changements applicables ; renvoie aussi les rejets pour les afficher */
  function validateChanges(raw, ctx) {
    const ok = [], rejected = [];
    const list = Array.isArray(raw) ? raw.slice(0, 20) : [];
    for (const c of list) {
      const why = typeof c?.raison === 'string' ? c.raison.slice(0, 300) : '';
      const t = c?.seance && ctx.templates?.[c.seance];
      const n = t ? (t.exercises || []).length : 0;
      const idx = parseInt(c?.index, 10);
      const bad = msg => rejected.push({ op: c?.op, msg });
      switch (c?.op) {
        case 'modifier_exercice': {
          if (!t) { bad('séance inconnue'); break; }
          if (!(idx >= 0 && idx < n)) { bad('exercice introuvable'); break; }
          const ex = cleanExercise({ ...t.exercises[idx], ...c.exercice });
          if (!ex) { bad('exercice invalide'); break; }
          ok.push({ op: c.op, seance: c.seance, index: idx, exercice: ex, raison: why }); break;
        }
        case 'ajouter_exercice': {
          if (!t) { bad('séance inconnue'); break; }
          const ex = cleanExercise(c.exercice);
          if (!ex) { bad('exercice invalide'); break; }
          ok.push({ op: c.op, seance: c.seance, index: isNaN(idx) ? n : Math.max(0, Math.min(n, idx)), exercice: ex, raison: why }); break;
        }
        case 'retirer_exercice':
          if (!t || !(idx >= 0 && idx < n)) { bad('exercice introuvable'); break; }
          ok.push({ op: c.op, seance: c.seance, index: idx, raison: why }); break;
        case 'deplacer_exercice': {
          const to = parseInt(c?.vers, 10);
          if (!t || !(idx >= 0 && idx < n) || !(to >= 0 && to < n) || to === idx) { bad('déplacement impossible'); break; }
          ok.push({ op: c.op, seance: c.seance, index: idx, vers: to, raison: why }); break;
        }
        case 'ajouter_objectif': {
          const g = c.objectif || {};
          const def = g.exercise === BW ? true : exDef(ctx.templates, g.exercise);
          if (!def || !isNum(g.target) || !/^\d{4}-\d{2}-\d{2}$/.test(g.date || '') || g.date <= ctx.today) { bad('objectif invalide'); break; }
          const goal = { exercise: g.exercise, target: +g.target, date: g.date };
          if (def !== true && kind(def.ex) === 'barre') goal.reps = parseInt(g.reps, 10) || 1;
          ok.push({ op: c.op, objectif: goal, raison: why }); break;
        }
        case 'prevoir_seance':
          if (!/^\d{4}-\d{2}-\d{2}$/.test(c?.date || '') || c.date < ctx.today || !ctx.templates?.[c.seance]) { bad('séance à prévoir invalide'); break; }
          ok.push({ op: c.op, date: c.date, seance: c.seance, type: ['facile', 'soutenue'].includes(c.type) ? c.type : undefined, raison: why }); break;

  }
  /* Applique un changement de séance type ; renvoie la nouvelle séance (copie) */
  function applyTemplateChange(tpl, c) {
    const t = JSON.parse(JSON.stringify(tpl)), xs = t.exercises;
    if (c.op === 'modifier_exercice') xs[c.index] = c.exercice;
    if (c.op === 'ajouter_exercice') xs.splice(c.index, 0, c.exercice);
    if (c.op === 'retirer_exercice') xs.splice(c.index, 1);

    return t;
  }
  function exSummary(ex) {

    if (ex.step) parts.push(`palier ${frNum(ex.step)} kg`);
    if (ex.loadAt) parts.push(`lest à partir de ${ex.loadAt} répétitions`);
    if (ex.rest) parts.push(`repos ${fmtDur(ex.rest)}`);
    if (ex.double) parts.push('double progression');

  function describeChange(c, ctx) {

    const old = t?.exercises?.[c.index];
    switch (c.op) {
      case 'modifier_exercice': return { title: `${name} · modifier ${old?.name}`, before: `${old?.name} : ${exSummary(old)}`, after: `${c.exercice.name} : ${exSummary(c.exercice)}` };
      case 'ajouter_exercice': return { title: `${name} · ajouter en position ${c.index + 1}`, before: '', after: `${c.exercice.name} : ${exSummary(c.exercice)}` };
      case 'retirer_exercice': return { title: `${name} · retirer`, before: `${old?.name} : ${exSummary(old)}`, after: '' };
      case 'deplacer_exercice': return { title: `${name} · déplacer ${old?.name}`, before: `position ${c.index + 1}`, after: `position ${c.vers + 1}` };
      case 'ajouter_objectif': { const g = c.objectif; return { title: 'Nouvel objectif', before: '', after: `${g.exercise === BW ? 'Poids corporel' : g.exercise} : ${frNum(g.target)}${g.reps ? ` kg × ${g.reps}` : ''} pour le ${frY(g.date)}` }; }
      case 'prevoir_seance': { const old2 = ctx.logs?.[c.date]; const ot = old2 && ctx.templates?.[old2.templateId]; return { title: `Calendrier · ${frY(c.date)}`, before: ot ? `${ot.short || ot.name} (${old2.status})` : 'rien de prévu', after: `${t?.short || t?.name}${c.type ? ` (${c.type})` : ''} prévue` }; }
    }

  }

  function sessionLine(date, log, ctx) {
    const t = ctx.templates?.[log.templateId]; if (!t) return '';
    const parts = (t.exercises || []).map(ex => { const d = describe(ex, log.entries?.[ex.name]); return d ? `${ex.name} ${d}` : ''; }).filter(Boolean);
    const r = log.templateId === 'D' ? runOf(log, t) : null;
    if (r?.km && r.sec) parts.push(`allure ${fmtPace(r.pace)}/km${r.type ? ' ' + r.type : ''}${r.hr ? ' FC ' + r.hr : ''}`);
    const f = log.feel || {};
    const fl = [f.sleep && `sommeil ${f.sleep}/5`, f.energy && `énergie ${f.energy}/5`, f.pain ? `douleur ${f.pain}/5 ${(f.zones || []).join(', ')}` : '', f.rpe && `difficulté ${f.rpe}/5`].filter(Boolean).join(', ');
    return `- ${date} ${t.short || log.templateId} (${log.status}) : ${parts.join(' ; ') || 'rien noté'}${fl ? ' | ' + fl : ''}${log.note ? ' | note : ' + log.note.slice(0, 160) : ''}`;
  }
  function buildClaudeContext(ctx) {
    const c = cycleInfo(ctx.today, ctx.cycle);
    const tpls = tplList(ctx.templates).map(([id, t]) => ({ seance: id, nom: t.name, exercices: (t.exercises || []).map((ex, i) => ({ index: i, ...ex })) }));
    const since = addDays(ctx.today, -56);
    const sessions = Object.keys(ctx.logs || {}).sort().filter(k => k >= since).slice(-40).map(k => sessionLine(k, ctx.logs[k], ctx)).filter(Boolean);
    const goals = Object.values(ctx.goals || {}).map(g => { const p = plan(g, ctx); return `- ${g.exercise === BW ? 'Poids corporel' : g.exercise} : ${g.target}${g.reps ? ' × ' + g.reps : ''} pour le ${g.date} (actuel ${p.cur == null ? '?' : r1(p.cur)} ${p.unit}, verdict ${p.state})`; });
    const ws = weightStats(ctx.weights);
    const recs = [];
    for (const [, t] of tplList(ctx.templates)) for (const ex of t.exercises || []) if (ex.main) { const b = bestOf(ex, history(ctx.logs, ex.name), ws?.last || 75); if (b) recs.push(`- ${ex.name} : ${prLabel(ex, b.set, b.score)} le ${b.date}`); }
    return [
      `Date du jour : ${ctx.today}. ${c ? `Cycle ${c.cycleNo}, semaine ${c.pos}/${c.n}${c.deload ? ' (allègement)' : ''}.` : ''}`,
      `PROFIL\n${ctx.profile}`,
      `RÈGLES DU PROGRAMME\n${ctx.rules}`,

  function joint(a, b, l1, l2, side) {

  const find = name => SHEETS.find(s => s.match.test(String(name || '').trim())) || null;

  const GLOSSARY = [

  return { BONE, joint, joints, mix, poseAt, drawFigure, SHEETS, find, GLOSSARY };
})();

<script>
/* ======================= Données fixes ======================= */
const PROFILE = `Profil non renseigné : complète-le dans Programme (taille, poids, niveau, objectifs, matériel).`;
const RULES = `Séries de 6 à environ 90 % de la série lourde, 1-2 reps en réserve sur les gros exercices. Progression +2,5 kg au squat et au soulevé de terre dès que toutes les reps sont faites ; couché en double progression (1×5 + 2×7 à charge égale, puis +2,5 kg). Tractions et dips : lest dès le seuil de reps atteint partout.
Cycles de 7 semaines depuis le 05/10/2026, la 7e en allègement (−10 %, moitié des séries, 3-4 reps en réserve).
À 5 séances : A, B, course facile, C, repos, course soutenue, repos. Jamais de course soutenue la veille de C, jamais A et C deux jours de suite, une seule course soutenue par semaine.`;
const RUN_BASE = { km: 4.23, sec: 1228 };
/* 'claude' : page publiée sur claude.ai ; 'pwa' : web app autonome, données sur le téléphone */
const MODE = window.CARNET_MODE === 'pwa' ? 'pwa' : 'claude';
const ZONES = ['Épaule G','Épaule D','Coude','Poignet','Bas du dos','Hanche','Genou','Cheville','Autre'];
const COLORS = { A:'var(--pA)', B:'var(--pB)', C:'var(--pC)', D:'var(--pD)' };
const PLATE_STYLE = { 20:['var(--plate20)',74,15], 10:['var(--plate10)',62,12], 5:['var(--plate5)',48,10], 2.5:['var(--plate25)',36,8], 1.25:['var(--plate125)',28,7] };
const DOWS = ['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
const MONTHS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const BW = L.BW;
const today = () => L.iso(new Date());
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const col = id => COLORS[id] || 'var(--chalk)';
const $ = id => document.getElementById(id);

/* ======================= Stockage local ======================= */
const LS = {
  get(k, d){ try { const v = localStorage.getItem('carnet.' + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v){ try { localStorage.setItem('carnet.' + k, JSON.stringify(v)); } catch {} },
  del(k){ try { localStorage.removeItem('carnet.' + k); } catch {} }
};

/* ======================= État ======================= */
const cache = LS.get('cache', null);
const S = {
  templates: cache?.templates || {}, logs: cache?.logs || {}, weights: cache?.weights || {}, goals: cache?.goals || {}, profile: cache?.profile || '',
  cycle: cache?.cycle || { start: '2026-10-05', weeks: 7 },
  db: null, online: 'wait', loaded: !!cache,
  tab: LS.get('tab', 'today'), sel: today(), view: null, confirm: {}, edit: null, panelMsg: '',
  run: LS.get('run', null), showRun: false,
  chat: [], asking: null, msgs: {}, sample: undefined, downloads: undefined, sound: LS.get('sound', true)
};
S.view = (() => { const d = L.parse(today()); d.setDate(1); return d; })();
let outbox = LS.get('outbox', {});
const ctx = () => ({ templates: S.templates, logs: S.logs, weights: S.weights, goals: S.goals, cycle: S.cycle, today: today(), profile: S.profile || PROFILE, rules: RULES });
const bw = () => L.weightStats(S.weights)?.last || 75;

function saveCache(){ LS.set('cache', { templates: S.templates, logs: S.logs, weights: S.weights, goals: S.goals, cycle: S.cycle, profile: S.profile }); }
function applyLocal(path, data){
  const [c, id] = path.split('/');
  if (c === 'settings') { if (id === 'cycle' && data) S.cycle = { ...S.cycle, ...data }; if (id === 'profile') S.profile = data?.text || ''; return; }
  if (!['templates','logs','weights','goals'].includes(c)) return;
  if (data == null) delete S[c][id]; else S[c][id] = data;
}
/* Toute écriture passe par la file d'attente : elle survit à une coupure réseau à la salle */
function write(path, data){
  const curEx = path.startsWith('templates/') && S.run && runExercises(S.templates[S.run.tid])[S.run.i]?.name;
  applyLocal(path, data);
  if (curEx) { const i = runExercises(S.templates[S.run.tid]).findIndex(x => x.name === curEx); if (i >= 0) S.run.i = i; }
  outbox[path] = data == null ? { __del: true } : JSON.parse(JSON.stringify(data));
  LS.set('outbox', outbox); saveCache(); renderSync(); flush();
}
let flushing = false;
async function flush(){
  if (!S.db || flushing) return;
  flushing = true;
  try {
    /* Recommence tant que des écritures arrivent pendant l'enregistrement */
    let failed = false;
    while (!failed && Object.keys(outbox).length) {
      for (const [p, d] of Object.entries(outbox)) {
        try {
          if (d.__del) await S.db.doc(p).delete(); else await S.db.doc(p).set(d);
          if (outbox[p] === d) { delete outbox[p]; LS.set('outbox', outbox); }
        } catch (e) { S.online = 'wait'; failed = true; break; }
      }
    }
  } finally { flushing = false; renderSync(); }
}
setInterval(flush, 15000);
window.addEventListener('online', flush);

/* ======================= Rendu général ======================= */
const ICONS = {
  today: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>',
  cal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>',
  prog: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19h16M6 15l4-4 3 3 5-6"/></svg>',
  plan: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h3M18 12h3M6 8v8M18 8v8M9 6v12M15 6v12M9 12h6"/></svg>',
  info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>',
  claude: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6 5.6 18.4"/></svg>'
};
const TABS = [['today','Aujourd’hui'],['cal','Calendrier'],['prog','Progrès'],['plan','Programme'],['info','Info'],['claude','Coach']];
function renderNav(){
  $('nav').innerHTML = TABS.map(([id, label]) => `<button data-a="tab" data-v="${id}" class="${S.tab===id?'on':''} ${id==='claude'?'cl':''}" aria-current="${S.tab===id?'page':'false'}">${ICONS[id]}<span>${label}</span></button>`).join('');
}
function renderSync(){
  const n = Object.keys(outbox).length, el = $('sync');
  const st = !S.db ? (S.online === 'off' ? 'off' : 'wait') : n ? 'wait' : 'ok';
  el.className = 'sync ' + st;
  el.lastElementChild.textContent = !S.db ? (S.online === 'off' ? (n ? `Hors ligne · ${n} en attente` : 'Hors ligne') : 'Connexion…') : n ? `${n} modification${n>1?'s':''} en attente` : MODE === 'pwa' ? 'Enregistré' : 'Synchronisé';
}
let pendingRender = false;
function renderAll(force){
  renderSync(); renderNav();
  const a = document.activeElement;
  if (!force && a && $('view').contains(a) && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) { pendingRender = true; }
  else { pendingRender = false; renderView(); }
  if (S.run && S.showRun) { const ae = document.activeElement; if (!(ae && $('sess').contains(ae) && /INPUT|TEXTAREA/.test(ae.tagName))) renderSession(); } else { $('sess').hidden = true; document.body.classList.remove('locked'); }
}
document.addEventListener('focusout', () => setTimeout(() => { if (pendingRender && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName || '')) renderAll(); }, 50));
function renderView(){
  const v = $('view');
  if (!S.loaded && !Object.keys(S.templates).length) {
    v.innerHTML = `<div class="card"><h2>${S.online==='off'?'Hors ligne':'Chargement'}</h2><p class="dim">${S.online==='off'?'Ouvre cette page connecté à claude.ai pour charger ton programme. Une fois chargé, il reste disponible ici même sans réseau.':'Tes séances types, ton calendrier et tes records arrivent.'}</p></div>`;
    return;
  }
  const resume = S.run && !S.showRun ? `<button class="banner" style="--c:${col(S.run.tid)}" data-a="resume"><span><span class="eyebrow" style="color:inherit">Séance en cours</span><br><b>${esc(tplName(S.run.tid))}</b></span><b>Reprendre ›</b></button>` : '';
  const upd = S.updateReady ? `<div class="alert"><span>Une nouvelle version de l’app est prête. Tes données ne changent pas.${S.run ? ' Ta séance en cours sera conservée.' : ''}</span><button data-a="reload">Mettre à jour</button></div>` : '';
  v.innerHTML = upd + resume + ({ today: viewToday, cal: viewCal, prog: viewProg, plan: viewPlan, info: viewInfo, claude: viewClaude })[S.tab]();
  if (S.tab === 'prog') afterProg();
  if (S.tab === 'info' && S.infoName && EX.find(S.infoName)) figMount(EX.find(S.infoName));
}

/* ======================= Info : fiches et schémas animés ======================= */
const FIG = { raf: 0, t: 0, play: true, sheet: null, dir: 1, prev: 0, idx: -1 };
function figMount(sheet){
  if (FIG.sheet !== sheet) { FIG.sheet = sheet; FIG.t = 0; FIG.dir = 1; FIG.play = !window.matchMedia?.('(prefers-reduced-motion: reduce)').matches; }
  FIG.idx = -1; figDraw(); if (FIG.play) figKick();
}
function figDraw(){
  const svg = $('fig'); if (!svg || !FIG.sheet) return false;
  svg.innerHTML = EX.drawFigure(FIG.sheet, FIG.t);
  const r = $('figrange'); if (r) r.value = FIG.t;
  const i = Math.round(FIG.t);
  if (i !== FIG.idx) {
    FIG.idx = i;
    const f = FIG.sheet.frames[i], tx = $('figtext');
    if (tx) tx.innerHTML = '<b>' + (i + 1) + '. ' + esc(f.label) + '</b><br>' + esc(f.text);
    document.querySelectorAll('[data-a="figstep"]').forEach((b, j) => b.classList.toggle('on', j === i));
  }
  const p = $('figplay'); if (p) p.textContent = FIG.play ? 'Pause' : 'Lecture';
  return true;
}
function figLoop(now){
  FIG.raf = 0;
  if (!FIG.play || !figDraw()) return;
  const n = FIG.sheet.frames.length - 1, dt = Math.min(0.1, (now - FIG.prev) / 1000); FIG.prev = now;
  FIG.t += FIG.dir * dt * 0.5;
  if (FIG.t >= n) { FIG.t = n; FIG.dir = -1; } else if (FIG.t <= 0) { FIG.t = 0; FIG.dir = 1; }
  FIG.raf = setTimeout(() => figLoop(performance.now()), 33);
}
function figKick(){ if (!FIG.raf) { FIG.prev = performance.now(); FIG.raf = setTimeout(() => figLoop(performance.now()), 33); } }
document.addEventListener('input', ev => { if (ev.target.id === 'figrange') { FIG.t = +ev.target.value; FIG.play = false; figDraw(); } });
function infoDetail(sheet, back){
  const def = L.tplList(S.templates).find(([, t]) => exOrder(t).some(x => EX.find(x.name) === sheet));
  return `<section class="card info" style="--c:${col(def?.[0])}">
    <div><button class="btn sm ghost" data-a="${back}">‹ Retour</button></div>
    <h2>${esc(sheet.name)}</h2><p class="small dim">${esc(sheet.why)}</p>
    <div class="figbox"><svg id="fig" viewBox="${sheet.vb || '10 0 220 205'}" role="img" aria-label="Schéma animé du mouvement : ${esc(sheet.name)}"></svg></div>
    <div class="figctl"><button class="btn sm" id="figplay" data-a="figplay">Pause</button><input type="range" id="figrange" min="0" max="${sheet.frames.length - 1}" step="0.01" value="0" aria-label="Avancer dans le mouvement"></div>
    <div class="chips" role="group" aria-label="Étapes du mouvement">${sheet.frames.map((f, i) => `<button class="chip" data-a="figstep" data-v="${i}">${i + 1}. ${esc(f.label)}</button>`).join('')}</div>
    <p class="figtext" id="figtext" aria-live="polite"></p>
    <p class="small dim">Touche une étape ou fais glisser le curseur. En couleur : les parties du corps qui travaillent le plus.</p>
  </section>

function viewInfo(){

  return h;
}

/* ======================= Aides communes ======================= */
function tplName(id){ const t = S.templates[id]; return t ? (t.short || t.name) : id; }
function exOrder(t){ return t?.exercises || []; }
function dayLabel(k){ const d = L.parse(k); return `${DOWS[L.dow(k)]} ${d.getDate()} ${MONTHS[d.getMonth()]}`; }
function prevHist(name, date){ return L.history(S.logs, name).filter(x => x.date < date); }
function lastFor(name, date){ return L.lastBefore(S.logs, name, date, S.cycle, true); }
function isBarbell(ex){ return L.kind(ex) === 'barre' || /barre|couché/i.test(ex.name); }
function lightBenchLoad(ex, date){
  if (!/couché (léger|pause)/i.test(ex.name)) return null;
  const heavy = L.history(S.logs, 'Développé couché').filter(x => x.date <= date).pop();
  const v = heavy?.e?.sets?.[0]?.val ?? heavy?.e?.val;
  return L.isNum(v) ? L.roundTo(+v * 0.725, 2.5) : null;
}
function suggestFor(ex, date){
  const c = L.cycleInfo(date, S.cycle);
  const last = lastFor(ex.name, date);
  const s = L.suggest(ex, last?.e || null, { deload: !!c?.deload });
  const light = lightBenchLoad(ex, date);
  if (light != null) { const v = c?.deload ? L.roundTo(light * 0.9, 2.5) : light; s.sets.forEach(x => x.val = v); s.note = `Charge calculée : 72,5 % de ta dernière série lourde au développé couché${c?.deload ? ', puis 10 % de moins (semaine d’allègement)' : ''}.`; }
  return { ...s, last };
}
function seqAlertsAround(k){ return L.sequenceAlerts(S.logs, L.addDays(k, -8), L.addDays(k, 8)); }
function weekDays(k){ const s = L.weekStart(k); return Array.from({ length: 7 }, (_, i) => L.addDays(s, i)); }

function cycleBlock(k){
  const c = L.cycleInfo(k, S.cycle);
  if (!c) return `<p class="dim">Le cycle commence le ${L.fr(S.cycle.start)}.</p>`;
  const bars = Array.from({ length: c.n }, (_, i) => `<i class="${i+1===c.n?'dl ':''}${i+1<=c.pos?'on':''}"></i>`).join('');
  const dl = L.deloadStart(k, S.cycle), left = c.n - c.pos;
  return `<div class="stack"><div class="cycle" style="--n:${c.n}" aria-hidden="true">${bars}</div>
    <p class="small ${c.deload?'dlw':'dim'}">${c.deload ? 'Semaine d’allègement : charges réduites de 10 %, moitié moins de séries, et arrête-toi quand il te reste 3 à 4 répétitions possibles. Si tu te sens en forme, tu peux alléger un peu moins.' : `Prochaine semaine d’allègement (plus facile) : le ${L.fr(dl)}, dans ${left===1?'1 semaine':left+' semaines'}.`}</p></div>`;
}
function missingAlerts(){
  return Object.keys(S.logs).filter(k => k <= today() && !(S.run && S.run.date === k) && L.missing(S.logs[k], S.templates[S.logs[k].templateId], today(), k)).sort().slice(-4)
    .map(k => `<div class="alert"><span>${esc(tplName(S.logs[k].templateId))} du ${L.fr(k)} : il manque des charges. As-tu fait cette séance ?</span><div class="row"><button data-a="enter" data-v="${k}">Oui, noter mes charges</button>${S.logs[k].status === 'faite' ? '' : `<button data-a="notdone" data-v="${k}">Non, la retirer</button>`}</div></div>`).join('');
}
function seqAlertHtml(list){ return list.map(a => `<div class="alert"><span>${esc(a.text)}</span><button data-a="goday" data-v="${a.date}">Voir le ${L.fr(a.date)}</button></div>`).join(''); }

/* ======================= Aujourd'hui ======================= */
function viewToday(){
  const k = today(), log = S.logs[k], t = log && S.templates[log.templateId], c = L.cycleInfo(k, S.cycle);
  const dd = L.parse(k);
  let h = `<div class="hero"><div class="hdate"><span class="hnum">${dd.getDate()}</span><span class="hside"><span class="hday">${DOWS[L.dow(k)]}</span><span class="hmon">${MONTHS[dd.getMonth()]}</span></span></div>
    <div class="stack"><div class="eyebrow">${c ? `Cycle ${c.cycleNo} · semaine ${c.pos} sur ${c.n}` : 'Avant le premier cycle'}</div>${cycleBlock(k)}</div></div>`;
  const wk = weekDays(k);
  h += seqAlertHtml(L.sequenceAlerts(S.logs, wk[0], L.addDays(wk[6], 7)).filter(a => (a.next || a.date) >= k));
  h += missingAlerts();
  if (MODE === 'pwa') {
    const lx = LS.get('lastExport', null), days = lx ? L.dayDiff(lx, k) : null, n = Object.keys(S.logs).length;
    if (n >= 3 && (days == null || days >= 14)) h += `<div class="alert"><span>${days == null ? 'Tes séances sont enregistrées uniquement sur ce téléphone.' : `Dernière sauvegarde il y a ${days} jours.`} Fais une sauvegarde pour ne rien perdre.</span><button data-a="tab" data-v="plan">Sauvegarder</button></div>`;
  }

      <div class="exl">${exOrder(t).map(ex => { const d = L.describe(ex, log.entries?.[ex.name]); return `<div class="r"><b>${esc(ex.name)}</b><span class="num">${esc(d || '—')}</span></div>`; }).join('')}</div>
      ${feelLine(log)}
      <div class="row"><button class="btn sm ghost" data-a="enter" data-v="${k}">Modifier les charges</button></div></section>`;
  } else if (log && t) {
    h += todayCard(k, log, t);
  } else {
    const sg = L.suggestNext(S.logs, k), st = S.templates[sg.id];
    if (st) h += `<section class="card plate" style="--c:${col(sg.id)}">${cardHead(sg.id, sg.rotation ? 'Suggestion du jour' : 'Suggestion adaptée à ta semaine', st.name + (sg.type ? ` ${sg.type}` : ''))}
      <p class="small dim">${esc(hasRun(st) ? (sg.type === 'soutenue' ? 'Ta course soutenue de la semaine : 4 × 1 km ou 3 × 8 min.' : 'Sortie facile, à une allure où tu peux parler.') : (st.exercises || []).filter(x => x.main).map(x => x.name).join(' · '))}</p>
      <button class="btn main" data-a="planstart" data-v="${sg.id}" data-t="${sg.type || ''}">Démarrer ${esc(st.short || sg.id)}</button></section>`;
    h += `<section class="card"><h3>Ou choisis ta séance</h3>
      <div class="tplpick">${L.tplList(S.templates).map(([id, tp]) => `<button data-a="planday" data-v="${id}" data-d="${k}" style="--c:${col(id)}"><span class="disc sm" style="--c:${col(id)}" aria-hidden="true">${esc(id)}</span><b>${esc((tp.short || tp.name).replace(/^\w\s*·\s*/, ''))}</b><span>${esc(hasRun(tp) ? 'Facile ou soutenue' : (tp.exercises||[]).filter(x => x.main).slice(0,2).map(x=>x.name).join(', '))}</span></button>`).join('')}</div>
      <p class="small dim">Jour de repos ? Rien à faire : la journée reste vide dans le calendrier.</p></section>`;
  }
  const done = wk.filter(d => S.logs[d]?.status === 'faite').length, planned = wk.filter(d => S.logs[d]).length;
  h += `<section class="card"><div class="between"><h3>Cette semaine</h3><span class="small dim">${done} faite${done>1?'s':''} sur ${planned} prévue${planned>1?'s':''}</span></div>${weekStrip(wk)}</section>`;
  const recent = recentPRs();
  if (recent.length) h += `<section class="card"><h3>Derniers records</h3><div class="exl">${recent.map(r => `<div class="r"><b>${esc(r.ex)}</b><span class="pr">${esc(r.label)} (${L.fr(r.date)})</span></div>`).join('')}</div></section>`;
  return h;
}
function todayCard(k, log, t){
  const c = L.cycleInfo(k, S.cycle), id = log.templateId;
  const rows = exOrder(t).map(ex => {
    if (L.unitOf(ex) === 'km' || L.unitOf(ex) === 'min') return '';
    const s = suggestFor(ex, k), first = s.sets[0];
    const what = L.kind(ex) === 'barre' ? (L.isNum(first?.val) ? `${L.frNum(first.val)} kg × ${first.reps}` : esc(ex.scheme.map(s => s.reps).join(' / ')) + ' répétitions') : L.kind(ex) === 'pdc' ? `${s.sets.length} × ${esc(ex.reps)}${+first?.val>0?` · +${L.frNum(first.val)} kg`:''}` : `${s.sets.length} × ${esc(ex.reps)}`;
    return `<div class="r"><b>${esc(ex.name)}</b><span>${what}${s.kindNote==='up'?' <span class="up">↑</span>':''}</span></div>`;
  }).join('');
  const isRun = exOrder(t).some(ex => L.unitOf(ex) === 'km');
  const z = L.paceZones(L.bestRunRef(S.logs, S.templates, RUN_BASE, today()));
  const runLine = isRun ? `<div class="r"><b>Course ${esc(log.run?.type || 'facile')}</b><span class="num">${log.run?.type==='soutenue' ? `4 × 1 km à ${L.fmtPace(z.interval)} ou 3 × 8 min à ${L.fmtPace(z.tempo)}` : `45-70 min à ${L.fmtPace(z.easy[0])}-${L.fmtPace(z.easy[1])} /km`}</span></div>` : '';
  return `<section class="card plate" style="--c:${col(id)}">
    ${cardHead(id, 'Prévue aujourd’hui', t.name)}
    ${c?.deload ? '<p class="dlw small">Allègement : charges déjà réduites de 10 % et moitié des séries.</p>' : ''}
    ${isRun ? typeChips(k, log) : ''}
    <div class="exl">${runLine}${rows}</div>
    <button class="btn main" data-a="start" data-v="${k}">Démarrer la séance</button>
    <div class="row"><button class="btn sm ghost" data-a="goday" data-v="${k}">Changer de séance</button></div>
  </section>`;
}
/* En-tête de carte : la séance représentée par un disque de sa couleur */
function cardHead(id, label, title){
  return `<div class="chead"><span class="disc" style="--c:${col(id)}" aria-hidden="true">${esc(id)}</span><div class="stack" style="gap:4px"><div class="eyebrow" style="color:${col(id)}">${esc(label)}</div><h2>${esc(title)}</h2></div></div>`;
}
function typeChips(k, log){
  const ty = log?.run?.type || 'facile';
  return `<div class="chips" role="group" aria-label="Type de course">${['facile','soutenue'].map(x => `<button class="chip ${ty===x?'on':''}" style="--c:var(--pD)" data-a="runtype" data-v="${x}" data-d="${k}">${x}</button>`).join('')}</div>`;
}
function weekStrip(days){
  const alerts = L.sequenceAlerts(S.logs, days[0], days[6]);
  return `<div class="week">${days.map(d => `<span class="d">${DOWS[L.dow(d)][0]}</span>`).join('')}${days.map(d => {
    const l = S.logs[d], id = l?.templateId;
    const warn = alerts.some(a => a.date === d || a.next === d);
    return `<button data-a="goday" data-v="${d}" class="${l ? (l.status==='faite'?'f':'p') : ''} ${d===today()?'today':''}" style="--c:${col(id)}" aria-label="${dayLabel(d)}${l?' : '+esc(tplName(id))+' '+l.status:''}">${l ? esc(id) : ''}${warn?'<i class="w"></i>':''}</button>`;
  }).join('')}</div>`;
}
function feelLine(log){
  const f = log.feel; if (!f) return '';
  const parts = [f.sleep && `Sommeil ${f.sleep}/5`, f.energy && `Énergie ${f.energy}/5`, f.pain ? `Douleur ${f.pain}/5${f.zones?.length ? ' (' + f.zones.join(', ') + ')' : ''}` : '', f.rpe && `Difficulté ${f.rpe}/5`].filter(Boolean);
  return parts.length || log.note ? `<p class="small dim">${esc(parts.join(' · '))}${log.note ? `<br>« ${esc(log.note)} »` : ''}</p>` : '';
}
function recentPRs(){
  const out = [], ks = Object.keys(S.logs).sort().filter(k => S.logs[k].status === 'faite').slice(-12), w = bw();
  for (const k of ks) {
    const log = S.logs[k], t = S.templates[log.templateId]; if (!t) continue;
    for (const ex of exOrder(t)) {
      if (!ex.main || L.kind(ex) === 'km') continue;
      const e = log.entries?.[ex.name]; if (!e) continue;
      L.newPRs(ex, e, prevHist(ex.name, k), w).forEach(label => out.push({ ex: ex.name, label, date: k }));
    }
    if (log.templateId === 'D') {
      const r = L.runOf(log, t), prev = Object.keys(S.logs).filter(x => x < k && S.logs[x].templateId === 'D' && S.logs[x].status === 'faite').map(x => L.runOf(S.logs[x], t)).filter(x => x?.km);
      L.runPRs(r, prev).forEach(label => out.push({ ex: 'Course', label, date: k }));
    }
  }
  return out.slice(-4).reverse();
}

/* ======================= Calendrier ======================= */
function viewCal(){
  const v = S.view, y = v.getFullYear(), m = v.getMonth();
  const off = (new Date(y, m, 1).getDay() + 6) % 7, start = L.iso(new Date(y, m, 1 - off));
  const alerts = L.sequenceAlerts(S.logs, L.addDays(start, -1), L.addDays(start, 42));
  let g = ['L','M','M','J','V','S','D'].map(d => `<div class="dowh">${d}</div>`).join('');
  for (let i = 0; i < 42; i++) {
    const k = L.addDays(start, i), d = L.parse(k);
    if (i === 35 && d.getMonth() !== m) break;
    const l = S.logs[k], t = l && S.templates[l.templateId], c = L.cycleInfo(k, S.cycle);
    const warn = alerts.some(a => a.date === k || a.next === k) || (l && L.missing(l, t, today(), k));
    g += `<button class="day ${d.getMonth()!==m?'out':''} ${c?.deload?'dl':''} ${k===today()?'today':''} ${k===S.sel?'sel':''}" data-a="sel" data-v="${k}" aria-label="${dayLabel(k)}${t?' : '+esc(tplName(l.templateId))+' '+l.status:''}">
      <span class="n">${d.getDate()}</span>${t ? `<span class="c ${l.status==='faite'?'':'p'}" style="--c:${col(l.templateId)}">${esc(l.templateId)}</span>` : ''}${warn?'<i class="w"></i>':''}</button>`;
  }
  return `<section class="card">
      <div class="calhead"><button data-a="month" data-v="-1" aria-label="Mois précédent">‹</button><h2>${MONTHS[m]} ${y}</h2><button data-a="month" data-v="1" aria-label="Mois suivant">›</button></div>
      <div class="grid">${g}</div>
      <div class="legend">${L.tplList(S.templates).map(([id, t]) => `<span><b style="background:${col(id)}"></b>${esc(t.short || t.name)}</span>`).join('')}<span><b style="background:color-mix(in srgb,var(--deload) 50%,var(--steel))"></b>Allègement</span><span><b style="box-shadow:inset 0 0 0 2px var(--dim)"></b>Prévue</span></div>
    </section>${dayPanel(S.sel)}`;
}
function dayPanel(k){
  const l = S.logs[k], t = l && S.templates[l.templateId], c = L.cycleInfo(k, S.cycle), id = l?.templateId;
  let h = `<section class="card ${t?'plate':''}" id="daypanel" style="--c:${col(id)}"><div class="eyebrow">${dayLabel(k)}${c?` · cycle ${c.cycleNo}, sem. ${c.pos}/${c.n}${c.deload?' · allègement':''}`:''}</div>
    <h2>${t ? esc(t.name) : 'Repos'}</h2>`;
  if (!l || l.status !== 'faite') {
    h += `<div class="chips" role="group" aria-label="Séance de ce jour">${L.tplList(S.templates).map(([tid, tp]) => `<button class="chip ${id===tid?'on':''}" style="--c:${col(tid)}" data-a="planday" data-v="${tid}" data-d="${k}">${esc(tp.short || tid)}</button>`).join('')}</div>`;
    if (id === 'D') h += typeChips(k, l);
  }
  h += seqAlertHtml(L.sequenceAlerts(S.logs, L.addDays(k, -1), k).filter(a => a.date === k || a.next === k));
  if (t) {
    const done = l.status === 'faite';
    h += `<div class="exl">${exOrder(t).map(ex => { const d = L.describe(ex, l.entries?.[ex.name]); return `<div class="r"><b>${esc(ex.name)}</b><span class="num">${esc(d || (done ? 'à noter' : ex.scheme ? ex.scheme.length + ' séries : ' + ex.scheme.map(s => s.reps).join(', ') + ' répétitions' : ex.sets + ' × ' + ex.reps))}</span></div>`; }).join('')}</div>`;
    if (l.templateId === 'D') { const r = L.runOf(l, t); if (r?.pace) h += `<p class="small">Allure <b class="num">${L.fmtPace(r.pace)} /km</b>${r.hr ? ` · fréquence cardiaque ${r.hr}` : ''}${r.treadmill ? ' · tapis' : ''}</p>`; }
    h += feelLine(l);
    h += `<div class="stack">`;
    if (k === today() && !done) h += `<button class="btn main" data-a="start" data-v="${k}">Démarrer la séance</button>`;
    else if (k <= today()) h += `<button class="btn wide" data-a="enter" data-v="${k}">${done ? 'Modifier les charges' : 'Noter les charges'}</button>`;
    h += `<button class="btn sm danger" data-a="del" data-v="${k}">Supprimer</button></div>`;
    if (S.confirm.day === k + ':1') h += `<div class="confirm"><span>Es-tu sûr de vouloir supprimer la séance suivante : ${esc(t.name)} du ${L.fr(k)} ?</span><div class="row"><button class="btn sm danger" data-a="del2" data-v="${k}">Oui</button><button class="btn sm ghost" data-a="nodel">Annuler</button></div></div>`;
    if (S.confirm.day === k + ':2') h += `<div class="confirm"><span>Dernière confirmation : supprimer définitivement ${esc(t.name)} du ${L.fr(k)} et ses charges ?</span><div class="row"><button class="btn sm danger" data-a="del3" data-v="${k}">Supprimer</button><button class="btn sm ghost" data-a="nodel">Annuler</button></div></div>`;
  } else h += `<p class="dim small">Choisis une séance pour la prévoir ce jour-là.</p>`;
  if (S.panelMsg) h += `<p class="small dim" role="status">${esc(S.panelMsg)}</p>`;
  return h + `</section>`;
}

/* ======================= Progrès ======================= */
function spark(vals, H = 46, goal = null){
  if (vals.length < 2) return '';
  const W = 240, p = 5, all = goal != null ? [...vals, goal] : vals;
  const min = Math.min(...all), max = Math.max(...all), rng = (max - min) || 1;
  const X = i => p + i * (W - 2 * p) / (vals.length - 1), Y = v => H - p - (v - min) * (H - 2 * p) / rng;
  const line = vals.map((v, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join('');
  const g = goal != null ? `<line x1="${p}" x2="${W - p}" y1="${Y(goal)}" y2="${Y(goal)}" stroke="var(--ok)" stroke-dasharray="4 3" stroke-width="1.5" vector-effect="non-scaling-stroke"/>` : '';
  return `<svg viewBox="0 0 ${W} ${H}" style="height:${H}px" preserveAspectRatio="none" aria-hidden="true">${g}
    <path d="${line}L${X(vals.length - 1)},${H - p}L${X(0)},${H - p}Z" fill="currentColor" fill-opacity=".14"/><path d="${line}" fill="none" stroke="currentColor" stroke-width="2.5" vector-effect="non-scaling-stroke"/>
    <circle cx="${X(vals.length - 1)}" cy="${Y(vals[vals.length - 1])}" r="4" fill="currentColor"/></svg>`;
}
const mainLifts = () => { const out = []; L.tplList(S.templates).forEach(([id, t]) => exOrder(t).filter(ex => ex.main).forEach(ex => out.push({ id, ex }))); return out; };
function viewProg(){
  const w = bw();
  const lifts = mainLifts().map(({ id, ex }) => {
    const hist = L.history(S.logs, ex.name), h = hist.map(x => ({ m: L.metric(ex, x.e), e: x.e })).filter(x => x.m != null);
    const k = L.kind(ex), last = h[h.length - 1], best = L.bestOf(ex, hist, w);
    const goal = Object.values(S.goals).find(g => g.exercise === ex.name), gm = goal ? L.goalMetric(ex, goal) : null;
    const unit = k === 'barre' ? 'kg, max estimé' : k === 'pdc' ? (last?.m > 1 ? 'répétitions' : 'répétition') : L.unitOf(ex);
    return `<div class="lift" style="--c:${col(id)}"><div class="eyebrow" style="color:${col(id)}">${esc(id)}</div><b>${esc(ex.name)}</b>
      ${last ? `<div class="v num" style="font-family:var(--display)">${L.frNum(L.r1(last.m))} <span class="small dim" style="font-family:var(--body);font-weight:500">${unit}</span></div>
      <div class="small dim">${esc(L.describe(ex, last.e))}</div>
      ${best ? `<div class="small pr">Record · ${esc(L.prLabel(ex, best.set, best.score))}</div>` : ''}
      <div style="color:${col(id)}">${spark(h.map(x => x.m), 46, gm)}</div>` : `<div class="small dim">Rien de noté pour l’instant.</div>`}</div>`;
  }).join('');

function runCard(){

    .map(k => ({ k, r: L.runOf(S.logs[k], S.templates.D) })).filter(x => x.r?.km);
  const wk = weekDays(today()), km = wk.reduce((a, d) => a + ((S.logs[d]?.templateId === 'D' && S.logs[d].status === 'faite' && L.runOf(S.logs[d], S.templates.D)?.km) || 0), 0);
