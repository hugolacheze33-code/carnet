const FIG = { raf: 0, t: 0, play: true, sheet: null, dir: 1, prev: 0, idx: -1, hold: 0, no3d: false };
function figMount(sheet){
  if (FIG.sheet !== sheet) { FIG.sheet = sheet; FIG.t = 0; FIG.dir = 1; FIG.hold = 2.2; FIG.play = !window.matchMedia?.('(prefers-reduced-motion: reduce)').matches; }
  FIG.idx = -1; fig3dAttach(); figDraw(); if (FIG.play) figKick();
  /* Le schéma 2D s'affiche tout de suite ; le personnage 3D prend le relais une fois chargé */
  if (!FIG.no3d && !FIG3D.ready()) FIG3D.load().then(() => { fig3dAttach(); figDraw(); }).catch(() => { FIG.no3d = true; });
}
function fig3dAttach(){
  const on = !FIG.no3d && FIG3D.ready() && FIG3D.mount($('figbox'), $('figmarks'));
  const v = $('figviews'); if (v) v.hidden = !on;
  const h = $('fighint'); if (h) h.hidden = !on;
  return on;
}
function figViewMark(name){ document.querySelectorAll('[data-a="figview"]').forEach(b => b.classList.toggle('on', b.dataset.v === name)); }
FIG3D.onView(figViewMark);
FIG3D.onLost(() => { FIG.no3d = true; $('figbox')?.classList.remove('is3d'); const m = $('figmarks'); if (m) m.innerHTML = ''; fig3dAttach(); figDraw(); });
function figDraw(){
  const svg = $('fig'); if (!svg || !FIG.sheet) return false;
  const in3d = !FIG.no3d && FIG3D.ready() && FIG3D.draw(FIG.sheet, FIG.t);
  if (!in3d) svg.innerHTML = EX.drawFigure(FIG.sheet, FIG.t, { marks: true });
  const r = $('figrange'); if (r) r.value = FIG.t;
  const i = Math.round(FIG.t);
  if (i !== FIG.idx) {
    FIG.idx = i;
    const f = FIG.sheet.frames[i], tx = $('figtext');
    if (tx) tx.innerHTML = '<b>' + (i + 1) + '. ' + esc(f.label) + '</b><br>' + esc(f.text) + (f.warn?.length ? '<ul class="figwarn">' + f.warn.map(w => '<li>' + esc(w.t) + '</li>').join('') + '</ul>' : '');
    const tag = $('figtag'); if (tag) tag.textContent = 'Étape ' + (i + 1) + ' sur ' + FIG.sheet.frames.length;
    document.querySelectorAll('[data-a="figstep"]').forEach((b, j) => b.classList.toggle('on', j === i));
  }
  const p = $('figplay'); if (p) p.textContent = FIG.play ? 'Pause' : 'Lecture';
  return true;
}
/* L'animation marque un arrêt à chaque étape, le temps de lire les points d'attention */
function figLoop(now){
  FIG.raf = 0;
  if (!FIG.play || !$('fig') || !FIG.sheet) return;
  const n = FIG.sheet.frames.length - 1, dt = Math.min(0.1, (now - FIG.prev) / 1000); FIG.prev = now;
  if (FIG.hold > 0) FIG.hold -= dt;
  else {
    const before = FIG.t, target = FIG.dir > 0 ? Math.floor(before + 1e-6) + 1 : Math.ceil(before - 1e-6) - 1;
    FIG.t += FIG.dir * dt * 0.62;
    if ((FIG.dir > 0 && FIG.t >= target) || (FIG.dir < 0 && FIG.t <= target)) {
      FIG.t = target; FIG.hold = FIG.sheet.frames[target].warn?.length ? 2.2 : 0.7;
      if (target >= n) FIG.dir = -1; else if (target <= 0) FIG.dir = 1;
    }
    figDraw();
  }
  FIG.raf = setTimeout(() => figLoop(performance.now()), 33);
}
function figKick(){ if (!FIG.raf) { FIG.prev = performance.now(); FIG.raf = setTimeout(() => figLoop(performance.now()), 33); } }

function viewInfo(){
  const open = S.infoName && EX.find(S.infoName);
  if (open) return infoDetail(open, 'infoclose');
  let h = `<section class="card"><div class="kline">${kairosSpot('point')}<p class="small dim">Touche un exercice pour voir le mouvement et les muscles travaillés.</p></div><button class="inforow" data-a="tab" data-v="plan"><span class="nm">Les consignes de ton programme</span><span aria-hidden="true">›</span></button></section>`;
  for (const [id, t] of L.tplList(S.templates)) {
    const seen = new Set(), rows = [];
    for (const x of exOrder(t)) {

/* ======================= Aides communes ======================= */
function tplName(id){ const t = S.templates[id]; return t ? (t.short || t.name) : id; }
function exOrder(t){ return t?.exercises || []; }
function dayLabel(k){ const d = L.parse(k); return `${DOWS[L.dow(k)]} ${d.getDate()} ${MONTHS[d.getMonth()]}`; }
function prevHist(name, date){ return L.history(S.logs, name).filter(x => x.date < date); }
function lastFor(name, date){ return L.lastBefore(S.logs, name, date, S.cycle, true); }
function isBarbell(ex){ return L.kind(ex) === 'barre' || /barre|couché/i.test(ex.name); }
function lightBenchLoad(ex, date){
  if (!/couché (léger|pause)/i.test(ex.name)) return null;
  const heavy = L.history(S.logs, 'Développé couché').filter(x => x.date <= date).pop();
  const v = heavy?.e?.sets?.[0]?.val ?? heavy?.e?.val;
  return L.isNum(v) ? L.roundTo(+v * 0.8, 2.5) : null;
}
function suggestFor(ex, date){
  const c = L.cycleInfo(date, S.cycle);
  const last = lastFor(ex.name, date);
  const s = L.suggest(ex, last?.e || null, { deload: !!c?.deload });
  const light = lightBenchLoad(ex, date);
  if (light != null) { const v = c?.deload ? L.roundTo(light * 0.9, 2.5) : light; s.sets.forEach(x => x.val = v); s.note = `Charge calculée : 80 % de ta dernière série lourde au développé couché${c?.deload ? ', puis 10 % de moins (semaine d’allègement)' : ''}.`; }
  return { ...s, last };
}

function todayCard(k, log, t){
  const c = L.cycleInfo(k, S.cycle), id = log.templateId;
  const rows = L.activeExercises(t, S.logs, k).map(ex => {
    if (L.unitOf(ex) === 'km' || L.unitOf(ex) === 'min') return '';

    return `<div class="r"><b>${esc(ex.name)}</b><span>${what}${s.kindNote==='up'?' <span class="up">↑</span>':''}</span></div>`;
  }).join('');
  const isRun = exOrder(t).some(ex => L.unitOf(ex) === 'km');

  const runLine = isRun ? `<div class="r"><b>Course ${esc(log.run?.type || 'facile')}</b><span class="num">${log.run?.type==='soutenue' ? `4 fois 1 km à ${L.fmtPace(z.interval)} /km, ou 3 fois 8 min à ${L.fmtPace(z.tempo)} /km` : `45 à 70 min à ${L.fmtPace(z.easy[0])}-${L.fmtPace(z.easy[1])} /km`}</span></div>` : '';
  const far = isRun ? L.longestRun(S.logs, t, k) : 0;
  const farLine = far ? `<p class="small dim">Ta plus longue sortie des 30 derniers jours : ${L.frNum(L.r1(far))} km. Essaie de rester sous ${L.frNum(L.r1(far * 1.1))} km.</p>` : '';
  return `<section class="card plate" style="--c:${col(id)}">
    ${cardHead(id, 'Prévue aujourd’hui', t.name, metaOf(t))}
    ${c?.deload ? '<p class="dlw small">Allègement : charges déjà réduites de 10 % et moitié des séries.</p>' : ''}

function sendMail(){
  const input = $('mailaddr'), addr = String(input ? input.value : LS.get('mailTo', '')).trim();
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(addr)) { msg('mstatus', 'Indique ton adresse mail pour continuer.'); input?.focus(); return; }
  LS.set('mailTo', addr);
  let text = '', url = '', days = 28;
  /* Une adresse mailto trop longue peut être coupée : on réduit la période si besoin */
  for (days of [28, 14, 7]) {
    text = L.buildMailReport(ctx(), days);
    url = 'mailto:' + encodeURI(addr) + '?subject=' + encodeURIComponent('Carnet séance ' + today()) + '&body=' + encodeURIComponent(text);
    if (url.length <= 20000) break;
  }
  try { navigator.clipboard?.writeText(text)?.catch?.(() => {}); } catch {}
  S.msgs.mstatus = `Ton application de mail s’ouvre avec tes séances des ${days} derniers jours : touche Envoyer. Si le mail est vide, colle son contenu : il est déjà copié.`;
  renderAll(true);
  openMailUrl(url);
}

function feelLine(log){

function recentPRs(){
  const out = [], ks = Object.keys(S.logs).sort().filter(k => S.logs[k].status === 'faite').slice(-12), w = bw();
  for (const k of ks) {
    const log = S.logs[k], t = S.templates[log.templateId]; if (!t) continue;
    for (const ex of exOrder(t)) {
      if (!ex.main || L.kind(ex) === 'km') continue;
      const e = log.entries?.[ex.name]; if (!e) continue;
      L.newPRs(ex, e, prevHist(ex.name, k), w).forEach(label => out.push({ ex: ex.name, label, date: k }));
    }
    if (log.templateId === 'D') {
      const r = L.runOf(log, t), prev = Object.keys(S.logs).filter(x => x < k && S.logs[x].templateId === 'D' && S.logs[x].status === 'faite').map(x => L.runOf(S.logs[x], t)).filter(x => x?.km);
      L.runPRs(r, prev).forEach(label => out.push({ ex: 'Course', label, date: k }));
    }
  }
  return out.slice(-4).reverse();
}

/* ======================= Progrès ======================= */
function spark(vals, H = 46, goal = null){
  if (vals.length < 2) return '';
  const W = 240, p = 5, all = goal != null ? [...vals, goal] : vals;
  const min = Math.min(...all), max = Math.max(...all), rng = (max - min) || 1;
  const X = i => p + i * (W - 2 * p) / (vals.length - 1), Y = v => H - p - (v - min) * (H - 2 * p) / rng;
  const line = vals.map((v, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join('');
  const g = goal != null ? `<line x1="${p}" x2="${W - p}" y1="${Y(goal)}" y2="${Y(goal)}" stroke="var(--ok)" stroke-dasharray="4 3" stroke-width="1.5" vector-effect="non-scaling-stroke"/>` : '';
  return `<svg viewBox="0 0 ${W} ${H}" style="height:${H}px" preserveAspectRatio="none" aria-hidden="true">${g}
    <path d="${line}L${X(vals.length - 1)},${H - p}L${X(0)},${H - p}Z" fill="currentColor" fill-opacity=".14"/><path d="${line}" fill="none" stroke="currentColor" stroke-width="2.5" vector-effect="non-scaling-stroke"/>
    <circle cx="${X(vals.length - 1)}" cy="${Y(vals[vals.length - 1])}" r="4" fill="currentColor"/></svg>`;
}
const mainLifts = () => { const out = []; L.tplList(S.templates).forEach(([id, t]) => exOrder(t).filter(ex => ex.main).forEach(ex => out.push({ id, ex }))); return out; };
/* Cette semaine : régularité, records, volume par muscle et respect de l'allure facile */
function weekTiles(){
  const wk = weekDays(today()), done = wk.filter(d => S.logs[d]?.status === 'faite'), planned = wk.filter(d => S.logs[d]).length;
  const prs = recentPRs().filter(p => wk.includes(p.date)).length;
  const groups = L.muscleSets(S.logs, wk, S.templates, EX.find), sets = groups.reduce((a, g) => a + g.sets, 0);
  const z = L.paceZones(L.bestRunRef(S.logs, S.templates, RUN_BASE, today()));
  const runs = done.filter(d => S.logs[d].templateId === 'D' && (S.logs[d].run?.type || 'facile') === 'facile').map(d => ({ d, c: L.easyCheck(L.runOf(S.logs[d], S.templates.D), z), hr: S.logs[d].run?.hr })).filter(x => x.c);
  const runLines = runs.map(({ d, c, hr }) => `<p class="small ${c.tooFast ? '' : 'dim'}"${c.tooFast ? ' style="color:var(--warn)"' : ''}>Course facile du ${L.fr(d)} : ${L.fmtPace(c.pace)} /km${hr ? `, fréquence cardiaque ${hr}` : ''}. ${c.tooFast ? `Plus rapide que ta zone facile (${L.fmtPace(c.zone[0])}-${L.fmtPace(c.zone[1])}) : ralentis pour qu’elle reste facile.` : 'Dans ta zone facile.'}</p>`).join('');

function runCard(){

function readExForm(){
  const E = S.edit, v = id => $(id)?.value.trim() ?? '';
  const x = { ...E.ex, name: v('e-name'), unit: v('e-unit') || 'kg', reps: v('e-reps'), tip: v('e-tip') };
  const num = s => s === '' ? undefined : Number(s.replace(',', '.'));
  x.rest = num(v('e-rest')); x.step = num(v('e-step')); x.loadAt = num(v('e-load'));
  x.main = $('e-main').checked;
  if (E.ex.scheme) { x.scheme = E.ex.scheme.map((s, j) => ({ label: v('e-sl' + j) || s.label, reps: parseInt(v('e-sr' + j), 10) || s.reps })); x.double = !!$('e-double')?.checked; x.sets = String(x.scheme.length); }
  else x.sets = v('e-sets') || '2';
  for (const k of Object.keys(x)) if (x[k] === undefined || x[k] === '' || x[k] === false || (typeof x[k] === 'number' && isNaN(x[k]))) delete x[k];
  if (!x.reps) x.reps = '';
  return x;
}
function renameEverywhere(oldName, newName){
  if (!oldName || oldName === newName) return;
  if (S.run?.ex?.[oldName]) { S.run.ex[newName] = S.run.ex[oldName]; delete S.run.ex[oldName]; persistRun(); }
  for (const [k, log] of Object.entries(S.logs)) if (log.entries?.[oldName]) {
    const entries = { ...log.entries }; entries[newName] = entries[oldName]; delete entries[oldName];
    write('logs/' + k, { ...log, entries });
  }
  for (const [id, g] of Object.entries(S.goals)) if (g.exercise === oldName) write('goals/' + id, { ...g, exercise: newName });
}
function saveTemplate(tid, exercises){ write('templates/' + tid, { ...S.templates[tid], exercises }); }

const RING_C = 2 * Math.PI * 92;
function ringOffset(frac){ return (RING_C * (1 - Math.max(0, Math.min(1, frac)))).toFixed(1); }
function restRing(R){
  const frac = (R.restEnd - Date.now()) / 1000 / R.restTotal;
  return `<svg viewBox="0 0 200 200" aria-hidden="true"><circle class="track" cx="100" cy="100" r="92"/><circle class="val${frac > 0 ? '' : ' end'}" id="drain" cx="100" cy="100" r="92" stroke-dasharray="${RING_C.toFixed(1)}" stroke-dashoffset="${ringOffset(frac)}"/></svg>`;
}
function setRing(el, frac){ el.setAttribute('stroke-dashoffset', ringOffset(frac)); el.classList.toggle('end', !(frac > 0)); }
function startTicker(){
  if (ticker) return;
  ticker = setInterval(() => {
    const R = S.run; if (!R || R.phase !== 'rest') return stopTicker();
    const left = (R.restEnd - Date.now()) / 1000, c = $('clock'), d = $('drain');
    if (c) c.textContent = left > 0 ? L.fmtDur(Math.ceil(left)) : 'GO';
    if (d) setRing(d, left / R.restTotal);
    const ms = $('ministate'); if (ms && !S.showRun) ms.textContent = miniState(R);
    const sec = Math.ceil(left);
    if (sec <= 3 && sec >= 1 && R.lastTick !== sec) { R.lastTick = sec; beep(660, .08, 0, .25); }
    if (left <= 0 && !R.signaled) {
      R.signaled = true; persistRun();
      beep(988, .18); beep(988, .18, .25); beep(1319, .45, .5);
      const el = $('sess'); el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
      const g = $('restgo'); if (g) g.textContent = 'C’est reparti';
      if (c) c.textContent = 'GO';
      const mi = $('mini'); if (mi && !mi.hidden) mi.classList.add('done');
    }
  }, 200);
}
function stopTicker(){ clearInterval(ticker); ticker = null; }

    case 'rtype': R.runData.type = v; persistRun(); syncRun(); renderSession(); return;
    case 'rtread': R.runData.treadmill = !R.runData.treadmill; persistRun(); renderSession(); return;
    case 'rst': readRunInputs(); { const d = R.runData, n = +b.dataset.d; if (b.dataset.f === 'km') d.km = Math.max(0, Math.round((d.km + n * 0.1) * 100) / 100); else d.sec = Math.max(0, d.sec + n * 60); } persistRun(); renderSession(); return;
    case 'rdone': readRunInputs(); if (!(R.runData.km > 0) || !(R.runData.sec > 0)) { S.toastMain = 'Indique la distance et la durée.'; renderSession(); return; } R.runData.done = true; { const prev = Object.keys(S.logs).filter(d => d < R.date && S.logs[d].templateId === 'D' && S.logs[d].status === 'faite').map(d => L.runOf(S.logs[d], t)).filter(x => x?.km); L.runPRs({ km: R.runData.km, pace: R.runData.sec / R.runData.km }, prev).forEach(p => { if (!R.prs.some(q => q.label === p)) R.prs.push({ ex: 'Course', label: p }); }); } R.phase = firstOpen(R, t) ? 'ex' : 'end'; persistRun(); syncRun(); renderSession(); return;
    case 'sfinish': { readSessInputs(); const l = logFromRun('faite'); clearTimeout(syncT); write('logs/' + R.date, l); S.run = null; S.showRun = false; persistRun(); keepAwake(false); stopTicker(); S.tab = R.date === today() ? 'today' : 'cal'; renderAll(true); window.scrollTo(0, 0); return; }
    case 'sabandon': R.abandon = 1; renderSession(); return;
    case 'sabandon1': R.abandon = 2; renderSession(); return;
    case 'sabandonx': R.abandon = 0; renderSession(); return;
    case 'sabandon2': clearTimeout(syncT); if (S.run && S.templates[R.tid]) write('logs/' + R.date, logFromRun(S.logs[R.date]?.status === 'faite' ? 'faite' : 'prévue')); S.run = null; S.showRun = false; persistRun(); keepAwake(false); stopTicker(); renderAll(true); return;
  }
});
function readSessInputs(){
  const R = S.run; if (!R) return;
  const note = $('in-note'); if (note) R.note = note.value.trim();
  const t = S.templates[R.tid], x = runExercises(t)[R.i]; if (!x || R.phase !== 'ex') return;
  const s = R.ex[x.name].sets[R.j], iv = $('in-val'), ir = $('in-reps'), im = $('in-memo');
  if (im) R.ex[x.name].memo = im.value.trim();
  const num = el => { const r = el.value.trim().replace(',', '.'); return r === '' ? '' : Number(r); };
  if (iv) { const n = num(iv); if (n === '' || !isNaN(n)) { if (n !== s.val) s.auto = false; s.val = n; } }
  if (ir) { const n = num(ir); if (n === '' || !isNaN(n)) s.reps = n === '' ? '' : Math.round(n); }
}
function readRunInputs(){
  const d = S.run?.runData; if (!d) return;
  const k = $('in-km'), du = $('in-dur'), hr = $('in-hr');
  if (k) { const n = Number(k.value.replace(',', '.')); if (!isNaN(n) && n >= 0) d.km = n; }
  if (du) { const s = L.parseDur(du.value); if (s != null && s >= 0) d.sec = s; }
  if (hr) { const n = parseInt(hr.value, 10); d.hr = n > 30 && n < 230 ? n : null; }
}
document.addEventListener('change', ev => {
  const id = ev.target.id;
  if (id === 'g-ex') return syncGoalForm();
  if (id === 'e-bar' && S.edit) {
    const on = ev.target.checked; S.edit.ex = readExForm();
    if (on && !S.edit.ex.scheme) { S.edit.ex.scheme = [{ label: 'Lourde', reps: 4 }, { label: 'Série 2', reps: 6 }, { label: 'Série 3', reps: 6 }]; S.edit.ex.sets = '3'; }
    if (!on) { delete S.edit.ex.scheme; delete S.edit.ex.double; }
    renderAll(true); return;
  }
  if (S.run && ['in-val', 'in-reps'].includes(id)) {
    readSessInputs();
    const R = S.run, t = S.templates[R.tid], x = runExercises(t)[R.i], e = R.ex[x.name];
    if (id === 'in-val' && L.kind(x) === 'barre' && R.j === 0 && L.isNum(e.sets[0].val)) e.sets.forEach((o, k) => { if (k > 0 && !o.done && o.auto) o.val = L.roundTo(e.sets[0].val * 0.9, 2.5); });
    persistRun(); renderSession(); return;
  }
  if (S.run && ['in-km', 'in-dur', 'in-hr'].includes(id)) { readRunInputs(); persistRun(); renderSession(); return; }
  if (S.run && id === 'in-memo') { const R2 = S.run, x = runExercises(S.templates[R2.tid])[R2.i]; if (x) { R2.ex[x.name].memo = ev.target.value.trim(); persistRun(); syncRun(); } return; }
  if (S.run && id === 'in-note') { S.run.note = ev.target.value.trim(); persistRun(); }
});
document.addEventListener('focusin', ev => { if (ev.target.matches?.('.stepper input')) setTimeout(() => ev.target.select?.(), 0); });
document.addEventListener('submit', ev => {
  ev.preventDefault();
  const f = ev.target;
  if (f.id === 'askform') {
    const q = $('ask').value.trim(); if (!q) return;
    S.askError = ''; S.askDraft = '';
    if (!S.sample) { S.askDraft = q; S.askError = S.sample === null ? 'Claude n’est pas disponible dans cette vue.' : 'Connexion à Claude en cours, réessaie dans quelques secondes.'; renderAll(true); return; }
    ask(q); return;
  }
  if (f.id === 'goalform') {
    const st = $('gstatus'), ex = $('g-ex').value, val = Number($('g-val').value.replace(',', '.')), reps = parseInt($('g-reps').value, 10) || 1, date = $('g-date').value;
    if (!L.isNum(val) || !date) { msg('gstatus', 'Indique une valeur et une date.'); return; }
    if (date <= today()) { msg('gstatus', 'Choisis une date dans le futur.'); return; }
    const def = L.exDef(S.templates, ex), g = { exercise: ex, target: val, date, created: today() };
    if (def && L.kind(def.ex) === 'barre') g.reps = reps;
    const base = L.currentFor(g, ctx()); if (base != null) g.base = base;
    write('goals/g' + Date.now(), g); renderAll(true); msg('gstatus', 'Objectif ajouté.'); return;
  }
  if (f.id === 'wform') {
    const date = $('w-date').value, kg = Number($('w-kg').value.replace(',', '.'));
    if (!date || !L.isNum(kg) || kg < 30 || kg > 200) { msg('wstatus', 'Indique une date et un poids en kg.'); return; }
    write('weights/' + date, { kg, date }); renderAll(true); msg('wstatus', `Poids du ${L.fr(date)} enregistré.`); return;
  }
  if (f.id === 'profform') {
    const text = $('p-text').value.trim().slice(0, 4000);
    write('settings/profile', { text }); renderAll(true); msg('pstatus', 'Profil enregistré.'); return;
  }
  if (f.id === 'cycleform') {
    const start = $('c-start').value, weeks = parseInt($('c-weeks').value, 10);
    if (!start || !(weeks >= 2 && weeks <= 16)) { msg('cstatus', 'Indique une date et un nombre de semaines entre 2 et 16.'); return; }
    write('settings/cycle', { start, weeks }); renderAll(true); msg('cstatus', 'Cycle enregistré.'); return;
  }
  if (f.id === 'exform') {
    const x = L.cleanExercise(readExForm()), E = S.edit;
    if (!x) { E.msg = 'Donne un nom à l’exercice.'; renderAll(true); return; }
    const xs = [...S.templates[E.tid].exercises];
    if (xs.some((o, i) => o.name === x.name && i !== E.i) || (x.name !== E.orig && L.exDef(S.templates, x.name))) { E.msg = 'Ce nom existe déjà dans ton programme : choisis-en un autre.'; renderAll(true); return; }
    if (E.i >= 0) { xs[E.i] = x; renameEverywhere(E.orig, x.name); } else xs.push(x);
    saveTemplate(E.tid, xs); S.edit = null; renderAll(true); return;
  }
});
function msg(id, text){ S.msgs[id] = text; const el = $(id); if (el) el.textContent = text; }
async function exportData(){
  if (!S.downloads) { msg('xstatus', 'L’export n’est pas disponible dans cette vue. Ouvre la page depuis claude.ai.'); return; }
  const settings = { cycle: S.cycle, program: { version: S.programVersion || 1 } }; if (S.profile) settings.profile = { text: S.profile }; if (S.nutrition) settings.nutrition = S.nutrition;
  const data = JSON.stringify({ app: 'Carnet de séances', version: 5, exportedAt: new Date().toISOString(), templates: S.templates, logs: S.logs, weights: S.weights, goals: S.goals, settings }, null, 2);
  try { await S.downloads.save({ filename: `carnet-seances-${today()}.json`, data }); LS.set('lastExport', today()); msg('xstatus', 'Sauvegarde enregistrée.'); }
  catch (e) { msg('xstatus', e?.code === 'declined' ? 'Export annulé.' : 'L’export a échoué. Réessaie.'); }
}
/* Restauration : remplace toutes les données par celles du fichier, après double confirmation */
function importConfirm(){
  const P = S.pendingImport; if (!P) return '';
  const n = Object.keys(P.logs || {}).length;
  const what = `${n} séance${n > 1 ? 's' : ''}, ${Object.keys(P.templates || {}).length} séances types, ${Object.keys(P.weights || {}).length} pesée(s), ${Object.keys(P.goals || {}).length} objectif(s) du fichier ${P._name}`;
  if (S.importStep === 1) return `<div class="confirm"><span>Es-tu sûr de vouloir remplacer toutes tes données actuelles par la sauvegarde suivante : ${esc(what)} ?</span><div class="row"><button class="btn sm danger" data-a="imp1">Oui</button><button class="btn sm ghost" data-a="impx">Annuler</button></div></div>`;
  if (S.importStep === 2) return `<div class="confirm"><span>Dernière confirmation : tes séances actuelles seront définitivement remplacées par ${esc(what)}.</span><div class="row"><button class="btn sm danger" data-a="imp2">Remplacer</button><button class="btn sm ghost" data-a="impx">Annuler</button></div></div>`;
  return '';
}
/* Applique une seule fois l'évolution du programme sur un téléphone déjà installé */
/* Séance restée ouverte depuis un jour précédent, « Terminer » oublié : on la clôt avec ce qui a été noté */
function closeForgottenRun(){
  const R = S.run;
  if (!R || R.date >= today() || !S.templates[R.tid] || Date.now() - (+R.startedAt || 0) < 6 * 3600 * 1000) return false;
  const done = Object.values(R.ex || {}).some(e => e?.sets?.some(s => s.done));
  if (done || S.logs[R.date]) {
    const l = logFromRun(done || S.logs[R.date]?.status === 'faite' ? 'faite' : 'prévue');
    delete l.finishedAt;
    write('logs/' + R.date, l);
  }
  S.run = null; S.showRun = false; LS.del('run'); keepAwake(false); stopTicker();
  return true;
}
function runMigration(){
  if (closeForgottenRun()) renderAll(true);
  /* Réparation de la version 5 : une séance du 04/11 ouverte sans aucune série faite ne doit pas la bloquer */
  if (MODE === 'pwa' && S.programVersion && S.programVersion < 5 && S.run?.date === '2026-11-04' && S.run.tid === 'B' && S.logs['2026-11-03']?.templateId === 'B' && !Object.values(S.run.ex || {}).some(e => e?.sets?.some(s => s.done))) {
    S.run = null; S.showRun = false; LS.del('run'); keepAwake(false); stopTicker();
  }
  /* Jamais pendant une séance : elle reprendra à la fin, sans changer les exercices en cours */
  if (MODE !== 'pwa' || S.run || !S.programVersion || S.programVersion >= L.PROGRAM_VERSION || !S.templates.A) return;
  const m = L.migrateProgram(S.templates, S.programVersion);
  for (const [a, b] of m.renames) renameEverywhere(a, b);
  for (const id of Object.keys(m.templates)) write('templates/' + id, m.templates[id]);
  const fix = L.repairLogs(S.logs, S.programVersion);
  for (const [d, l] of Object.entries(fix.writes)) write('logs/' + d, l);
  write('settings/program', { version: L.PROGRAM_VERSION });
  const notice = [...m.changes, ...fix.changes];
  if (notice.length) { S.programNotice = notice; LS.set('programNotice', notice); }
  renderAll();
}
function doImport(){
  const P = S.pendingImport; if (!P) return;
  for (const c of ['templates', 'logs', 'weights', 'goals']) {
    const next = P[c] || {};
    for (const id of Object.keys(S[c])) if (!(id in next)) write(`${c}/${id}`, null);
    for (const [id, d] of Object.entries(next)) write(`${c}/${id}`, d);
  }
  if (P.settings?.cycle) write('settings/cycle', P.settings.cycle);
  if (P.settings?.profile) write('settings/profile', P.settings.profile);
  if (P.settings?.nutrition) write('settings/nutrition', P.settings.nutrition);
  write('settings/program', P.settings?.program || { version: 1 });
  S.pendingImport = null; S.importStep = 0; S.run = null; persistRun();
  runMigration(); renderAll(true); msg('xstatus', 'Sauvegarde restaurée.');
}
document.addEventListener('change', ev => {
  if (ev.target.id !== 'importfile') return;
  const f = ev.target.files?.[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    let d = null; try { d = JSON.parse(r.result); } catch {}
    const safeIds = o => Object.keys(o || {}).every(k => /^[\w.-]{1,40}$/.test(k));
    const okShape = d && typeof d === 'object' && ['templates', 'logs', 'weights', 'goals'].every(k => (d[k] == null || typeof d[k] === 'object') && safeIds(d[k])) && d.templates && Object.keys(d.templates).length && Object.values(d.templates).every(t => Array.isArray(t?.exercises));
    if (!okShape) { msg('xstatus', 'Ce fichier n’est pas une sauvegarde du Carnet de séances. Choisis un fichier exporté depuis l’app.'); return; }
    for (const t of Object.values(d.templates)) t.exercises = t.exercises.map(L.cleanExercise).filter(Boolean);
    d._name = f.name; S.pendingImport = d; S.importStep = 1; renderAll(true);
  };
  r.readAsText(f);
});

/* ======================= Démarrage ======================= */
/* Nouvelle version : elle s'installe toute seule dès que rien n'est en cours, jamais pendant une séance ou une saisie.
   Les données restent dans carnet.db : une mise à jour n'y touche pas, et en garde une copie (carnet.db.avant-maj). */
function autoUpdate(){
  if (!S.updateReady) return false;
  if ((S.run && S.showRun) || S.edit || S.pendingImport || S.asking || S.tab === 'claude' || /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName || '')) return false;
  try {
    if (Date.now() - (+sessionStorage.getItem('carnet.autoReload') || 0) < 60000) return false;
    sessionStorage.setItem('carnet.autoReload', String(Date.now()));
  } catch {}
  saveCache(); location.reload(); return true;
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { runMigration(); autoUpdate(); } });
window.carnetUpdateReady = () => { S.updateReady = true; if (!autoUpdate()) renderAll(); };
/* Sans cache local, le programme n'est pas encore chargé ici : ne jamais jeter une séance en cours pour autant */
if (S.loaded && S.run && !S.templates[S.run.tid]) { S.run = null; persistRun(); }
renderAll(true);
(async () => {
  const use = window.claude?.use;
  if (!use) { S.online = 'off'; S.sample = null; S.downloads = null; renderAll(); return; }
  use('sample').then(s => { S.sample = s; if (S.tab === 'claude') renderAll(); }).catch(() => { S.sample = null; });
  use('downloads').then(d => { S.downloads = d; }).catch(() => { S.downloads = null; });
  const db = await use('db').catch(() => null);
  if (!db) { S.online = 'off'; renderAll(); return; }
  S.db = db; S.online = 'ok';
  const overlay = c => { for (const [p, d] of Object.entries(outbox)) { const [cc, id] = p.split('/'); if (cc === c) { if (d.__del) delete S[c][id]; else S[c][id] = d; } } };
  const watch = c => db.collection(c).onSnapshot(snap => {
    const o = {}; snap.docs.forEach(d => { if (d.exists) o[d.id] = d.data(); });
    S[c] = o; overlay(c); S.loaded = true; saveCache();
    if (S.run && !S.templates[S.run.tid] && c === 'templates') { S.run = null; persistRun(); }
    renderAll();
  }, () => { S.online = 'wait'; renderSync(); });
  ['templates', 'logs', 'weights', 'goals'].forEach(watch);
  db.doc('settings/cycle').onSnapshot(d => { if (d.exists && !outbox['settings/cycle']) S.cycle = { ...S.cycle, ...d.data() }; saveCache(); renderAll(); }, () => {});
  db.doc('settings/program').onSnapshot(d => { S.programVersion = d.exists ? (+d.data()?.version || 1) : 1; setTimeout(runMigration, 0); }, () => {});
  db.doc('settings/nutrition').onSnapshot(d => { if (!outbox['settings/nutrition']) S.nutrition = d.exists ? d.data() : null; saveCache(); renderAll(); }, () => {});
  db.doc('settings/profile').onSnapshot(d => { if (!outbox['settings/profile']) S.profile = d.exists ? (d.data()?.text || '') : S.profile; saveCache(); renderAll(); }, () => {});
  flush();
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  const hadController = !!navigator.serviceWorker.controller;
  /* Nouvelle version prête : on le signale, sans jamais recharger tout seul (séance ou texte en cours) */
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController && window.carnetUpdateReady) window.carnetUpdateReady(); });
  addEventListener('load', () => navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); });
  }).catch(() => {}));
}
</script>
